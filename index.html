<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="㈜하이브릿지(가상 기업) 인사팀 신입을 위한 상황 선택형 온보딩 웹 앱">
<link rel="icon" href="assets/symbol.png">
<title>신입 100일 생존기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: white app shell — sticky brand header, tab rail, one working view at a time; the game view centres a single situation card. */
:root{
  color-scheme: light;
  --blue:#004aad; --blue-deep:#00307a; --blue-soft:#eef3fc; --blue-line:#cfdcf3;
  --ink:#1c2333; --ink-2:#4a5468; --ink-3:#7c8597;
  --line:#e3e8f0; --bg:#ffffff; --bg-soft:#f6f8fc;
  --amber:#ffb400; --amber-soft:#fff6de;
  --good:#17804f; --good-soft:#e7f5ee; --warn:#c2410c; --warn-soft:#fdeee6;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand img{height:28px;width:auto;display:block}
.brand .svc{border-left:1px solid var(--line);padding-left:12px;font-weight:700;color:var(--blue);font-size:15px;white-space:nowrap}
.roles{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--ink-2);padding:10px 14px;border-bottom:2px solid transparent;font-weight:500;font-size:14px;white-space:nowrap}
.tabs a small{font-size:11px;color:var(--ink-3);margin-left:4px;font-weight:400}
.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}

main{padding-block:28px 64px}
.view{display:grid;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--blue);font-weight:700;text-transform:uppercase}
.h1{font-family:var(--sans);font-size:clamp(30px,4.6vw,46px);line-height:1.25;color:var(--blue);font-weight:800;letter-spacing:-.02em}
.h2{font-family:var(--sans);font-size:22px;color:var(--ink);font-weight:700}
.lead{color:var(--ink-2);font-size:16px;max-width:36em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none}
.btn:hover{background:var(--blue-deep)}
.btn.ghost{background:var(--bg);color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:500;white-space:nowrap}
.chip.gray{background:var(--bg-soft);color:var(--ink-2);border:1px solid var(--line)}
.chip.amber{background:var(--amber-soft);color:#8a5a00}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:22px}
.soft{background:var(--bg-soft);border-color:transparent}
.sample{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sample::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.grid4{grid-template-columns:minmax(0,1fr)}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:12px 8px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .copy{display:grid;gap:18px}
.role-card{display:grid;gap:10px;align-content:start}
.role-card h3{font-size:17px}
.role-card ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.cycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cycle > div{padding:18px;display:grid;gap:6px;border-right:1px solid var(--line);position:relative}
.cycle > div:last-child{border-right:0}
.cycle b.l{font-family:var(--sans);font-size:26px;color:var(--blue);line-height:1}
.cycle .k{font-weight:700}
.cycle .f{font-size:13px;color:var(--ink-2)}
@media (max-width:760px){.cycle{grid-template-columns:repeat(2,minmax(0,1fr))}.cycle>div:nth-child(2){border-right:0}.cycle>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.company{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.company img{width:150px;height:auto}
@media (max-width:560px){.company{grid-template-columns:minmax(0,1fr)}.company img{width:120px}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:0}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:0;font-weight:500}
@media (max-width:480px){.facts{grid-template-columns:minmax(0,1fr)}}

/* situation card */
.sc{border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:0 10px 30px -18px rgba(0,48,122,.35);overflow:hidden}
.sc-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:#eeecf0;overflow:hidden}
.av.ic{background:var(--blue-soft);color:var(--blue)}
.av.ic svg{width:56%;height:56%}
.av.br{background:var(--blue-soft)}
.av.br svg{display:block}
.av.sm{width:34px;height:34px}
.av.xs{width:26px;height:26px}
.sc-head .who{min-width:0}
.sc-head .who b{display:block;font-size:15px}
.sc-head .who span{font-size:12px;color:var(--ink-3)}
.sc-head .chip{margin-left:auto}
.sc-body{padding:22px 20px;display:grid;gap:16px}
.sc-title{font-family:var(--sans);font-size:21px;color:var(--blue)}
.sc-text{font-size:17px;line-height:1.75}
.ctx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.ctx div{background:var(--bg-soft);border-radius:8px;padding:8px 10px;min-width:0}
.ctx dt{color:var(--ink-3)}
.ctx dd{margin:0;color:var(--ink);font-weight:500}
@media (max-width:520px){.ctx{grid-template-columns:minmax(0,1fr)}}

/* game */
.game{max-width:640px;margin:0 auto;width:100%;display:grid;gap:18px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g{display:grid;gap:5px;position:relative}
.g .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.g .bar{height:8px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line);overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}
.g.low .bar i{background:var(--warn)}
.g.low .lab b{color:var(--warn)}
.g .hint{position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-radius:50%;background:var(--amber);opacity:0;transition:opacity .15s}
.g .hint.on{opacity:1}
@media (max-width:480px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dayline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayline .d{font-family:var(--sans);font-size:28px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.progress{display:flex;gap:4px;margin-left:auto}
.progress i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--blue)}
.progress i.now{background:var(--amber)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--blue-line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.55;transition:background .15s,border-color .15s}
.choice:hover,.choice:focus-visible{background:var(--blue-soft);border-color:var(--blue)}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.deltas{display:flex;gap:6px;flex-wrap:wrap}
.fb{display:grid;gap:14px}
.mine{border-left:3px solid var(--blue);padding:4px 0 4px 14px;display:grid;gap:6px}
.senior{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border-radius:12px;background:var(--bg-soft)}
.senior .av{width:46px;height:46px}
.senior .nm{font-weight:700;font-size:14px}
.senior .nm span{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.senior q{display:block;quotes:none;margin:4px 0 6px}
.senior .why{font-size:13px;color:var(--blue)}
.dist{display:grid;gap:6px}
.dist .r{display:grid;grid-template-columns:22px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.dist .track{height:10px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.dist .track i{display:block;height:100%;background:var(--blue-line)}
.dist .r.me .track i{background:var(--blue)}
.dist .r.me b{color:var(--blue)}
.avatars{display:flex;gap:10px;flex-wrap:wrap}
.avatars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:520px){.avatars{grid-template-columns:repeat(3,minmax(0,1fr))}}
.avatars button{border:2px solid var(--line);border-radius:14px;padding:8px 4px 6px;background:var(--bg);display:grid;justify-items:center;gap:2px}
.avatars button small{font-size:12px;color:var(--ink-2)}
.avatars button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.avatars button[aria-pressed="true"] small{color:var(--blue);font-weight:700}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:15px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;font-size:14px}
.parts button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.story{display:grid;gap:10px;margin:0}
.story div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;font-size:14px}
.story dt{color:var(--blue);font-weight:700}
.story dd{margin:0}
@media (max-width:520px){.story div{grid-template-columns:minmax(0,1fr);gap:2px}}
.ending{background:var(--blue);color:#fff;border-radius:20px;padding:28px;display:grid;gap:16px}
.ending img{height:24px;width:auto}
.ending .type{font-family:var(--sans);font-size:30px;font-weight:700;line-height:1.3}
.ending p{color:#dbe6f8}
.ending .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ending .stats div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px;font-size:12px;color:#dbe6f8}
.ending .stats b{display:block;font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
@media (max-width:480px){.ending .stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ending.fail{background:var(--ink)}

/* community */
.comm{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.comm{grid-template-columns:minmax(0,1fr)}}
.chans{display:grid;gap:4px}
@media (max-width:760px){.chans{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}}
.chans button{text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;display:grid;gap:1px}
.chans button b{font-size:14px}
.chans button span{font-size:12px;color:var(--ink-3)}
.chans button[aria-pressed="true"]{background:var(--blue-soft)}
.chans button[aria-pressed="true"] b{color:var(--blue)}
.posts{display:grid;gap:14px}
.post{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.post .meta b{font-size:14px}
.post .ref{font-size:13px;background:var(--bg-soft);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.replies{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.reply{font-size:14px;display:grid;gap:2px}
.reply .meta{font-size:12px}
.reply-form{display:flex;gap:8px}
.reply-form input{flex:1;min-width:0;padding:8px 10px;font-size:14px}
.composer{display:grid;gap:10px}

/* register */
.reg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:start}
@media (max-width:860px){.reg{grid-template-columns:minmax(0,1fr)}}
.reg form{display:grid;gap:16px}
.qnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;margin-right:6px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);display:grid;gap:14px}
.map{display:grid;gap:8px;font-size:13px}
.map div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.map span{background:var(--bg-soft);border-radius:8px;padding:6px 10px}
.map i{color:var(--blue);font-style:normal}
.badges{display:flex;gap:8px;flex-wrap:wrap}

/* hrd */
.kpi{display:grid;gap:2px;padding:16px;border:1px solid var(--line);border-radius:12px}
.kpi b{font-size:28px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
.kpi span{font-size:13px;color:var(--ink-2)}
.kpi small{font-size:12px;color:var(--ink-3)}
.distlist{display:grid;gap:14px}
.distlist .it{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:center}
.distlist .nm{font-size:14px;font-weight:500;min-width:0}
.distlist .nm span{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11px;font-variant-numeric:tabular-nums}
.stack i{display:grid;place-items:center;font-style:normal;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack i:nth-child(1){background:#7fa2dc}
.stack i:nth-child(2){background:var(--blue)}
.stack i:nth-child(3){background:#b9c9e6;color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (max-width:600px){.distlist .it{grid-template-columns:minmax(0,1fr);gap:6px}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink-3);font-weight:500;background:var(--bg-soft)}
tr:last-child td{border-bottom:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.stuck{display:grid;gap:10px;counter-reset:s}
.stuck div{display:flex;gap:12px;align-items:center;font-size:14px}
.stuck div::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-size:12px;font-weight:700}
.stuck b{margin-left:auto;color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}

/* character + people */
.greet{display:flex;align-items:flex-end;gap:12px}
.greet svg{flex:none}
.bubble{position:relative;background:var(--blue-soft);color:var(--ink);border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:14px;margin-bottom:28px;min-width:0}
.hero-side{display:grid;gap:4px}
.people{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.people figure{margin:0;display:grid;gap:8px}
.people img{width:100%;max-width:100%;aspect-ratio:1;border-radius:16px;background:#eeecf0;object-fit:cover}
.people figcaption{display:grid;font-size:13px;color:var(--ink-3);line-height:1.4}
.people figcaption b{font-size:15px;color:var(--ink)}
@media (max-width:760px){.people{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mascot-panel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.mascot-panel{grid-template-columns:minmax(0,1fr);justify-items:start}}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.minis .av{width:38px;height:38px}
.end-hero{display:flex;gap:18px;align-items:center}
.end-bri{flex:none;background:#fff;border-radius:50%;width:112px;height:112px;display:grid;place-items:center}
@media (max-width:420px){.end-hero{flex-direction:column;align-items:flex-start}}
/* db detail, contribution, new senior case */
.linkbtn{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.linkbtn:hover{color:var(--blue);text-decoration:underline}
.linkbtn span{color:var(--ink-3);font-size:12px;margin-left:4px}
tr.detail td{background:var(--bg-soft)}
.dt{display:grid;gap:12px;padding:6px 2px;max-width:820px}
.dt ol{margin:0;padding-left:20px;display:grid;gap:6px}
.dt .senior{background:var(--bg)}
.newreg{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.notice{background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.badge-off{opacity:.45}
.mylist{display:grid;gap:6px;font-size:13px}
.mylist div{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mylist span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mylist .muted{white-space:nowrap}
/* ===== game stage (게임 화면만 게임처럼) ===== */
.stage{--sky:#e6eef9;--b1:#d2def1;--b2:#c3d3ec;--win:#edf2fa;position:relative;max-width:760px;width:100%;margin:0 auto;background:var(--sky);border-radius:26px;overflow:hidden;color:var(--ink)}
.stage.eve{--sky:#1d2c52;--b1:#26386a;--b2:#2f4579;--win:#ffcf5a}
.sky{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none}
.sky .b1{fill:var(--b1)}.sky .b2{fill:var(--b2)}.sky .win{fill:var(--win)}
.stage-in{position:relative;padding:16px clamp(12px,3vw,26px) 22px;display:grid;gap:14px}
.endstage .stage-in{padding-bottom:130px}
.eve .pick.c{background:#fff}
.g-h1{font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-.02em}
.g-h2{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.btn.big{padding:13px 22px;font-size:16px;border-radius:14px}
/* HUD */
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--bg);border-radius:18px;padding:10px 8px 8px;box-shadow:0 6px 16px -12px rgba(0,48,122,.5)}
.gg{display:grid;justify-items:center;gap:1px;position:relative}
.gi{width:34px;height:34px;display:block}
.gi .e{fill:#d6e1f2}.gi .f{fill:var(--blue)}
.gg.danger .gi .f{fill:var(--warn)}
.gg.danger .gi{animation:throb .9s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.12)}}
.gl{font-size:11px;color:var(--ink-2);white-space:nowrap}
.gv{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.gg.danger .gv{color:var(--warn)}
.dot{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-radius:50%;background:var(--amber);transition:width .15s,height .15s}
.pop{position:absolute;top:2px;right:8%;font-size:14px;font-weight:800;opacity:0;font-variant-numeric:tabular-nums}
.pop.plus{color:var(--good)}.pop.minus{color:var(--warn)}
.pop.up{animation:popup 1.6s ease forwards}
@keyframes popup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
/* top bar */
.gtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.gday{font-size:30px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.glabel{font-weight:700}
.gclock{font-size:13px;color:var(--ink-2)}
.eve .gday,.eve .glabel{color:#fff}.eve .gclock{color:#c9d6ee}
.gprog{margin-left:auto;display:flex;gap:5px;align-self:center}
.gprog i{width:26px;height:7px;border-radius:4px;background:rgba(0,48,122,.16)}
.eve .gprog i{background:rgba(255,255,255,.25)}
.gprog i.done{background:var(--blue)}.eve .gprog i.done{background:#fff}
.gprog i.now{background:var(--amber)}
/* situation + card deck */
.situ{background:var(--bg);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.situ h2{font-size:20px;font-weight:800;color:var(--blue)}
.situ p{font-size:16px;line-height:1.7}
.situ .ctxline{font-size:12px;color:var(--ink-3);line-height:1.5}
.deck{position:relative;width:min(290px,76vw);aspect-ratio:29/34;max-width:100%;margin:4px auto 0}
.under{position:absolute;inset:0;border-radius:22px;background:#fff;border:1px solid var(--line);transform:rotate(-4deg) translateY(8px)}
.under.u2{transform:rotate(3deg) translateY(12px);opacity:.75}
.gcard{position:absolute;inset:0;border-radius:22px;background:#fff;border:3px solid var(--blue);box-shadow:0 22px 34px -20px rgba(0,48,122,.7);overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .25s ease;display:grid;grid-template-rows:minmax(0,1fr) auto}
.gcard:active{cursor:grabbing}
.gcard:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.art{background:#eeecf0;display:grid;place-items:center;overflow:hidden;min-height:0}
.art img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.art-ic{width:100%;height:100%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.art-ic svg{width:40%;height:40%}
.art-bri{width:100%;height:100%;display:grid;place-items:end center;background:var(--blue-soft);padding-top:8px}
.plate{padding:10px 14px 12px;border-top:3px solid var(--blue);display:grid;background:#fff;text-align:center}
.plate b{font-size:17px;font-weight:800}
.plate span{font-size:12px;color:var(--ink-3)}
.ov{position:absolute;left:0;right:0;top:0;padding:14px 16px 16px;background:rgba(0,48,122,.94);color:#fff;font-weight:700;font-size:15px;line-height:1.5;opacity:0;transition:opacity .12s;z-index:2;display:flex;gap:8px;align-items:flex-start}
.ov span{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--amber);color:var(--ink);font-size:12px;font-weight:800}
.ov-r{justify-content:flex-end;text-align:right}
.gcard.l .ov-l,.gcard.r .ov-r{opacity:1}
.howto{font-size:12px;color:var(--ink-2);text-align:center}
.eve .howto{color:#c9d6ee}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border:2px solid transparent;background:var(--bg);border-radius:16px;padding:11px 13px;text-align:left;font-size:14px;line-height:1.5;display:grid;gap:3px;align-content:start;box-shadow:0 4px 12px -10px rgba(0,48,122,.6);transition:border-color .12s,transform .12s}
.pick .k{font-size:12px;font-weight:800;color:var(--blue)}
.pick.r{text-align:right}
.pick.hot,.pick:hover{border-color:var(--blue);transform:translateY(-2px)}
.pick.c{grid-column:1/-1;text-align:center;background:rgba(255,255,255,.75);border:2px dashed var(--blue-line);box-shadow:none}
.pick.c:hover{border-style:solid}
@media (max-width:480px){.picks{grid-template-columns:minmax(0,1fr)}.pick.r{text-align:left}}
/* buddy (내 아바타) */
.buddy{display:flex;align-items:flex-end;gap:8px;position:relative;z-index:1}
.buddy svg{flex:none}
.say{background:var(--bg);border:2px solid var(--blue);border-radius:16px 16px 16px 4px;padding:8px 13px;font-size:14px;font-weight:700;margin-bottom:22px;max-width:280px;color:var(--ink)}
/* result (2-2) */
.result{background:var(--bg);border-radius:20px;padding:18px;display:grid;gap:14px}
.res-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.res-head b{font-size:16px}
.res-head p{color:var(--ink-2);margin:2px 0 8px}
.res-k{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
.note-h{font-size:15px;font-weight:800}
.note-h small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.seniors2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.seniors2{grid-template-columns:minmax(0,1fr)}}
.scard{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.scard .sh{display:flex;gap:10px;align-items:center;padding:12px;background:var(--bg-soft);flex-wrap:wrap}
.scard .sh b{display:block;font-size:14px}
.scard .sh span{font-size:12px;color:var(--ink-3)}
.scard .tag{margin-left:auto}
.scard .sb{padding:12px 14px;display:grid;gap:8px;font-size:14px;align-content:start}
.scard q{quotes:none}
.scard .why{font-size:13px;color:var(--blue)}
.av.lg{width:52px;height:52px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.tag.same{background:var(--amber-soft);color:#8a5a00}
/* setup / id card */
.creator,.onboard{background:var(--bg);border-radius:22px;padding:22px;display:grid;gap:16px}
.cre-head p{color:var(--ink-2);font-size:14px;margin-top:4px}
.cre-row{display:flex;align-items:center;justify-content:center;gap:20px}
.cre-bri{display:grid;place-items:center;width:200px;height:200px;border-radius:50%;background:var(--blue-soft)}
.arrow{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--blue-line);background:var(--bg);font-size:26px;line-height:1;color:var(--blue);display:grid;place-items:center}
.arrow:hover{border-color:var(--blue)}
.cre-name{display:grid;justify-items:center;gap:6px}
.cre-name b{font-size:17px}
.cre-dots{display:flex;gap:6px}
.cre-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.cre-dots i.on{background:var(--blue)}
.idcard{width:min(360px,100%);margin:0 auto;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 22px 34px -22px rgba(0,48,122,.7);overflow:hidden;transform:rotate(-1.5deg)}
.id-top{background:var(--blue);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:13px;font-weight:700}
.id-top img{height:20px;width:auto}
.id-body{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:16px;align-items:center}
.id-photo{width:104px;height:120px;border-radius:12px;background:var(--blue-soft);overflow:hidden;display:grid;place-items:end center}
.id-body dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;font-size:13px}
.id-body dt{color:var(--ink-3)}
.id-body dd{margin:0;font-weight:700}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.id-foot{border-top:1px dashed var(--line);padding:8px 16px;font-size:12px;color:var(--ink-3);text-align:center}
.rules{display:grid;gap:12px}
.balance{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.balance{grid-template-columns:minmax(0,1fr)}}
.balance li{display:flex;gap:10px;align-items:center;background:var(--bg-soft);border-radius:12px;padding:10px 12px}
.balance li div{display:grid}
.balance li b{font-size:14px}
.balance li span{font-size:12px;color:var(--ink-2)}
.warnline{font-size:14px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px}
/* day intro */
.dayintro{background:var(--bg);border-radius:22px;padding:22px 18px 24px;display:grid;justify-items:center;gap:14px;text-align:center}
.journey{list-style:none;margin:0 0 4px;padding:0;display:flex;width:100%;max-width:440px;justify-content:space-between;position:relative}
.journey::before{content:"";position:absolute;left:14px;right:14px;top:7px;height:3px;background:var(--line)}
.journey li{position:relative;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.journey i{width:17px;height:17px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.journey li.done i{background:var(--blue);border-color:var(--blue)}
.journey li.now i{background:var(--amber);border-color:var(--amber)}
.journey li.now{color:var(--ink);font-weight:800}
.cal{width:150px;border-radius:18px;overflow:hidden;border:3px solid var(--blue);display:grid;background:#fff}
.cal .m{background:var(--blue);color:#fff;font-size:13px;font-weight:700;padding:6px}
.cal b{font-size:42px;font-weight:800;color:var(--blue);padding-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cal span{font-size:13px;color:var(--ink-2);padding-bottom:12px}
.cardbacks{display:flex;gap:10px}
.cardbacks i{width:48px;height:62px;border-radius:9px;background:var(--blue);display:grid;place-items:center;box-shadow:0 6px 10px -8px rgba(0,48,122,.8)}
.cardbacks i:nth-child(1){transform:rotate(-6deg)}.cardbacks i:nth-child(3){transform:rotate(6deg)}
.cardbacks img{width:22px;height:auto;filter:brightness(0) invert(1)}
/* retro */
.retro{background:var(--bg);border-radius:20px;padding:18px;display:grid;gap:14px}
/* ending */
.endwrap{display:grid;gap:14px;justify-items:center;text-align:center}
.end-k{font-weight:800;color:var(--blue)}
.eve .end-k,.eve .end-note{color:#fff}
.tcard{width:min(340px,100%);border-radius:24px;background:var(--blue);color:#fff;padding:14px;display:grid;gap:10px;border:6px solid #fff;box-shadow:0 0 0 2px var(--blue),0 26px 40px -24px rgba(0,48,122,.8);text-align:left;animation:deal .6s ease both}
.tcard.fail{background:#2b3446;box-shadow:0 0 0 2px #2b3446,0 26px 40px -24px rgba(0,0,0,.7)}
@keyframes deal{from{transform:translateY(24px) rotate(-6deg) scale(.92);opacity:0}to{transform:none;opacity:1}}
.tc-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.tc-top img{height:18px;width:auto}
.tc-art{background:#fff;border-radius:16px;display:grid;place-items:center;padding-top:8px}
.tc-name{font-size:13px;color:#c9d6ee}
.tc-type{font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.02em}
.tcard p{color:#dbe6f8;font-size:14px}
.tc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tc-stats div{display:grid;justify-items:center;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 4px;font-size:11px;color:#c9d6ee}
.tc-stats .gi .e{fill:rgba(255,255,255,.25)}.tc-stats .gi .f{fill:#fff}
.tc-stats b{font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
.end-note{font-size:14px;color:var(--ink-2);max-width:460px}
@media (prefers-reduced-motion:reduce){.gg.danger .gi,.tcard,.pop.up{animation:none}.pop.up{opacity:1}}

/* ===== v5: 역할 선택 · 캐릭터 커스터마이징 · 엘리베이터 · 사무실 · 대화창 ===== */
.start-head{display:grid;gap:8px;justify-items:center;text-align:center}
.rolepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:820px){.rolepick{grid-template-columns:minmax(0,1fr)}}
.rp{border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
.rp-art{height:210px;background:var(--blue-soft);display:grid;place-items:end center;overflow:hidden}
.rp-art img{width:100%;height:100%;object-fit:cover}
.rp-art.pv{place-items:center}
.rp-body{padding:18px;display:grid;gap:10px;align-content:start}
.rp-body h2{font-size:19px;font-weight:800}
.rp-body p{color:var(--ink-2);font-size:14px}
.rp-body .btn{justify-self:start;margin-top:4px}
.hud2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--bg);border-radius:18px;padding:8px 10px;box-shadow:0 6px 16px -12px rgba(0,48,122,.5)}
.hud2 .hud{box-shadow:none;padding:4px 0 0;background:none}
.hud-me{display:flex;gap:8px;align-items:center;min-width:0}
.hud-me .av{width:42px;height:42px;background:var(--blue-soft)}
.hud-me b{display:block;font-size:14px;line-height:1.2}
.hud-me span{font-size:11px;color:var(--ink-3);white-space:nowrap}
@media (max-width:560px){.hud-me div{display:none}.hud2{grid-template-columns:auto minmax(0,1fr) auto;padding:8px 6px}.gl{font-size:10px}}
.mute{border:0;background:var(--bg-soft);border-radius:10px;width:36px;height:36px;font-size:16px}
.quest{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:10px 14px;border-left:5px solid var(--amber)}
.quest .av{width:40px;height:40px;background:var(--blue-soft)}
.quest div{display:grid;min-width:0}
.quest b{font-size:13px;color:var(--blue)}
.quest span{font-size:15px;font-weight:700}
.quest em{font-style:normal;font-size:13px;color:var(--ink-2);margin-top:2px}
.office{position:relative;height:290px;border-radius:18px;overflow:hidden;background:#f3f6fb;border:2px solid #fff;box-shadow:0 10px 24px -18px rgba(0,48,122,.6)}
.office .wall{position:absolute;inset:0 0 27% 0;background:#eef2f8}
.office .windows{position:absolute;left:22%;right:4%;top:12%;height:44%;border-radius:6px;overflow:hidden;background:#cfe0f7;border:5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.office .windows .b1{fill:#b9cce9}.office .windows .b2{fill:#a9bfe2}.office .windows .win{fill:#e7eef9}
.office.night .wall{background:#2a3657}.office.night .windows{background:#1d2c52;border-color:#3a4a73;box-shadow:none}
.office.night .windows .b1{fill:#26386a}.office.night .windows .b2{fill:#2f4579}.office.night .windows .win{fill:#ffcf5a}
.office .poster{position:absolute;left:4%;top:12%;width:64px;height:84px;background:#fff;border-radius:6px;display:grid;justify-items:center;align-content:center;box-shadow:0 2px 0 rgba(0,0,0,.08);padding-top:4px}
.office .poster span{font-size:11px;font-weight:800;color:var(--blue)}
.office .wclock{position:absolute;right:5%;top:2%;font-size:12px;font-weight:800;color:var(--ink-2);background:#fff;border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.office .floor{position:absolute;inset:73% 0 0 0;background:#dfe6f2;cursor:pointer}
.office.night .floor{background:#3a4568}
.office .floor::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#c9d3e3}
.office.night .floor::before{background:#4a5680}
.ent{position:absolute;bottom:19%;transform:translateX(-50%);border:0;background:none;padding:0;display:grid;justify-items:center;cursor:pointer;z-index:1}
.ent .sprite{display:block;line-height:0}
.ent .ntag{font-size:11px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:1px 8px;margin-top:2px;white-space:nowrap}
.ent.later{opacity:.75}
.ent:focus-visible{outline:3px solid var(--amber);outline-offset:4px;border-radius:8px}
.bang{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--ink);font-weight:800;display:grid;place-items:center;font-size:15px;box-shadow:0 3px 0 #c98f00;animation:bob 1s ease-in-out infinite alternate}
.okm{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-size:12px;display:grid;place-items:center}
@keyframes bob{to{transform:translate(-50%,-6px)}}
.me{position:absolute;bottom:13%;transform:translateX(-50%);z-index:2;line-height:0;pointer-events:none}
.me.walk svg{animation:walkbob .28s ease-in-out infinite alternate}
@keyframes walkbob{from{transform:translateY(0)}to{transform:translateY(-5px) rotate(2deg)}}
.prompt{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;border-radius:8px;padding:4px 9px;line-height:1.4;margin-bottom:6px}
.prompt kbd{background:#fff;color:var(--ink);border-radius:4px;padding:0 4px;font-family:inherit;font-weight:800;font-size:11px}
.office-ctl{flex-wrap:nowrap}
.office-ctl #act{flex:0 1 auto;min-width:0;white-space:normal;line-height:1.35}
@media (max-width:560px){.office{height:250px}.ent.door .ntag{display:none}.ent .ntag{font-size:10px;padding:1px 6px}.ent svg{width:58px;height:auto}.me svg{width:64px;height:auto}.office .poster{display:none}.office .windows{left:4%}}
.office-ctl{justify-content:center}
.office-ctl .btn.ghost{min-width:48px;padding-inline:0;background:var(--bg)}
/* elevator */
.elev{display:grid;justify-items:center;gap:12px;padding:6px 0 4px;cursor:pointer;position:relative}
.ev-place{font-size:13px;font-weight:700;color:var(--ink-2)}
.eve .ev-place,.eve .ev-cap span{color:#c9d6ee}
.ev-panel{display:flex;gap:8px;align-items:center;background:#1c2333;color:#ffcf5a;border-radius:10px;padding:6px 16px;font-variant-numeric:tabular-nums}
.ev-panel b{font-size:24px;font-weight:800;min-width:2.4em;text-align:center}
.ev-car{position:relative;width:min(340px,86%);aspect-ratio:17/13;border-radius:12px 12px 4px 4px;overflow:hidden;background:#9aa8bf;border:8px solid #c9d3e3;box-shadow:0 20px 30px -24px rgba(0,0,0,.6)}
.ev-view{position:absolute;inset:0}
.ev-door{position:absolute;top:0;bottom:0;width:50%;background:#d7deea;transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.ev-door.l{left:0;border-right:2px solid #aeb9cc}
.ev-door.r{right:0;border-left:2px solid #aeb9cc}
.ev-door::after{content:"";position:absolute;top:12%;bottom:12%;width:2px;background:#c3ccdb}
.ev-door.l::after{right:16px}.ev-door.r::after{left:16px}
.ev-car.open .ev-door.l{transform:translateX(-100%)}

@keyframes blink{50%{opacity:.2}}

.cre-pv{display:grid;justify-items:center;gap:4px;text-align:center;position:sticky;top:130px}
.cre-stage{width:100%;max-width:260px;aspect-ratio:1;border-radius:24px;background:var(--blue-soft);display:grid;place-items:center;border:3px solid var(--blue)}
.cre-stage svg{animation:idle 1.6s ease-in-out infinite alternate}
@keyframes idle{to{transform:translateY(-6px)}}
.cre-pv b{font-size:18px;margin-top:8px}
.cre-pv span{font-size:13px;color:var(--ink-3)}
.cre-form{display:grid;gap:14px}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.seg2 button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-size:14px}
.seg2 button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid rgba(0,0,0,.08);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bang,.cre-stage svg,.me.walk svg,.dlg-next{animation:none}.ev-door{transition:none}}

footer{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--ink-3)}
footer .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

function bri(o={}){
  const c=o.c||'#004aad', acc=o.acc||'none', mood=o.mood||'neutral', wave=o.wave!==false||mood==='happy', sz=o.size||120, head=!!o.head;

  if(!head)parts.push(`<ellipse cx="100" cy="206" rx="58" ry="7" fill="#0b1a3a" opacity=".08"/>`);
  // arms (behind body)
  parts.push(wave?`<path d="M152 128 Q174 112 180 86" stroke="${c}" stroke-width="15" stroke-linecap="round" fill="none"/>`:`<path d="M152 132 Q168 146 172 160" stroke="${c}" stroke-width="15" stroke-linecap="round" fill="none"/>`);
  parts.push(`<path d="M48 132 Q32 146 28 160" stroke="${c}" stroke-width="15" stroke-linecap="round" fill="none"/>`);
  // body: arch-shaped (bridge) with an arch opening between the legs
  parts.push(`<path d="M38 104 A62 62 0 0 1 162 104 L162 186 Q162 198 150 198 L132 198 Q130 166 100 164 Q70 166 68 198 L50 198 Q38 198 38 186 Z" fill="${c}"/>`);
  // soft highlight
  parts.push(`<path d="M58 80 A48 48 0 0 1 96 54" stroke="#fff" stroke-opacity=".28" stroke-width="7" stroke-linecap="round" fill="none"/>`);
  // eyes + mouth by mood (happy / neutral / worried / tired)
  const ln=(d,w=4.5)=>`<path d="${d}" stroke="${dark}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
  if(mood==='happy'){
    parts.push(ln('M68 110 Q80 96 92 110',5)+ln('M108 110 Q120 96 132 110',5));
  }else if(mood==='tired'){
    parts.push(`<ellipse cx="80" cy="110" rx="12" ry="8" fill="#fff"/><ellipse cx="120" cy="110" rx="12" ry="8" fill="#fff"/><circle cx="81" cy="113" r="5" fill="${dark}"/><circle cx="121" cy="113" r="5" fill="${dark}"/>`);
    parts.push(`<path d="M66 108 Q80 101 94 108 L94 100 L66 100Z" fill="${c}"/><path d="M106 108 Q120 101 134 108 L134 100 L106 100Z" fill="${c}"/>`+ln('M67 108 Q80 103 93 108',3.5)+ln('M107 108 Q120 103 133 108',3.5));
  }else{
    const dy=mood==='worried'?4:0;
    parts.push(`<ellipse cx="80" cy="106" rx="12" ry="14" fill="#fff"/><ellipse cx="120" cy="106" rx="12" ry="14" fill="#fff"/>`);
    parts.push(`<circle cx="82" cy="${109+dy}" r="7" fill="${dark}"/><circle cx="122" cy="${109+dy}" r="7" fill="${dark}"/>`);
    parts.push(`<circle cx="85" cy="${105+dy}" r="2.6" fill="#fff"/><circle cx="125" cy="${105+dy}" r="2.6" fill="#fff"/>`);
    if(mood==='worried')parts.push(ln('M66 88 L90 82',4)+ln('M110 82 L134 88',4)+`<path d="M156 74 Q163 88 156 93 Q149 88 156 74Z" fill="#9fd0ff"/>`);
  }
  if(mood!=='tired')parts.push(`<ellipse cx="64" cy="128" rx="9" ry="5.5" fill="#ff8fab" opacity=".75"/><ellipse cx="136" cy="128" rx="9" ry="5.5" fill="#ff8fab" opacity=".75"/>`);
  if(mood==='happy')parts.push(`<path d="M87 124 Q100 146 113 124 Z" fill="${dark}"/><path d="M93 133 Q100 141 107 133 Q100 130 93 133Z" fill="#ff8fab"/>`);
  else if(mood==='worried')parts.push(`<ellipse cx="100" cy="132" rx="6" ry="5" fill="${dark}"/>`);
  else if(mood==='tired')parts.push(`<path d="M89 133 Q94.5 128 100 133 Q105.5 138 111 133" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>`);
  else parts.push(`<path d="M91 128 Q100 138 109 128" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>`);
  // accessories
  if(acc==='tie')parts.push(`<path d="M94 146 L106 146 L109 152 L100 176 L91 152 Z" fill="#ffb400"/><path d="M94 146 L106 146 L100 153 Z" fill="#e09a00"/>`);
  if(acc==='glasses')parts.push(`<g fill="none" stroke="${dark}" stroke-width="3.5"><circle cx="80" cy="106" r="17"/><circle cx="120" cy="106" r="17"/><path d="M97 104 Q100 101 103 104"/></g>`);
  if(acc==='headset')parts.push(`<path d="M40 100 A60 60 0 0 1 160 100" stroke="${dark}" stroke-width="6" fill="none"/><rect x="31" y="92" width="14" height="26" rx="6" fill="${dark}"/><rect x="155" y="92" width="14" height="26" rx="6" fill="${dark}"/><path d="M38 118 Q42 140 66 140" stroke="${dark}" stroke-width="3.5" fill="none"/><circle cx="68" cy="140" r="4.5" fill="${dark}"/>`);
  if(acc==='badge')parts.push(`<path d="M78 140 L96 160 M122 140 L104 160" stroke="#ffb400" stroke-width="3.5"/><rect x="88" y="158" width="24" height="30" rx="4" fill="#fff"/><rect x="92" y="164" width="16" height="4" rx="2" fill="${c}"/><rect x="92" y="172" width="11" height="3" rx="1.5" fill="#c9d6ee"/>`);

}

function avatar(p,cls='av'){
  if(p.img)return `<img class="${cls}" src="assets/${p.img}.jpg" alt="">`;
  if(p.icon)return `<span class="${cls} ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[p.icon]}</svg></span>`;
  if(p.me)return `<span class="${cls} br">${person(myLook(),{head:true})}</span>`;
  if(p.look)return `<span class="${cls} br">${person(p.look,{head:true})}</span>`;
  if(p.bri)return `<span class="${cls} br">${bri({...p.bri,head:true,wave:false})}</span>`;
  return avatar({icon:'user'},cls);
}
function authorOf(post){
  if(!post.by)return {bri:{c:'#9aa3b5'}};
  if(post.mine&&S.role==='junior'&&post.by===myName())return {me:true};
  return AUTHORS[post.by]||(/신입/.test(post.tag||'')&&post.by===myName()?{me:true}:{icon:'user'});
}

const VIEWS={home,start,game,community,register,hrd};
function route(){
  const v=(location.hash||'#home').slice(1);
  const name=VIEWS[v]?v:'home';
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+name?'page':'false'));
  document.querySelectorAll('#roleSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  $('#app').innerHTML=`<div class="view">${VIEWS[name]()}</div>`;
  bind[name]?.();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
$('#roleSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.role=b.dataset.role;save();

  if(location.hash===go)route();else location.hash=go;});

function deltaChips(d){return d.map((v,i)=>v?`<span class="chip ${v>0?'good':'warn'}">${GAUGES[i]} ${v>0?'+':''}${v}</span>`:'').join('')}
const myLook=()=>({...DEFAULT_LOOK,...(S.game.look||{})});
function moodNow(lastD){
  const g=S.game.g;
  if(g[3]<=20)return 'tired';
  if(Math.min(...g)<=20)return 'worried';
  if(lastD){const s=lastD.reduce((a,b)=>a+b,0);if(s>=8)return 'happy';if(s<0)return 'worried'}
  return 'neutral';
}

function buddy(mood,line){return `<div class="buddy">${person(myLook(),{mood,size:62,wave:mood==='happy'})}<p class="say">${esc(line)}</p></div>`}
function gIcon(i,v,id){return `<svg viewBox="0 0 24 24" class="gi" aria-hidden="true"><defs><clipPath id="${id}"><rect x="0" y="${(24-24*v/100).toFixed(2)}" width="24" height="24" data-gr="${i}"/></clipPath></defs><path d="${G_ICON[i]}" class="e"/><path d="${G_ICON[i]}" class="f" clip-path="url(#${id})"/></svg>`}
function hud(from){
  const G=S.game,g=from||G.g,D=DAYS[G.dayIdx]||DAYS[0];

    <div class="hud" role="group" aria-label="4대 밸런스 지표">${GAUGES.map((n,i)=>`<div class="gg ${G.g[i]<=20?'danger':''}" title="${n}: ${G_SUB[i]}"><span class="dot" data-h="${i}"></span>${gIcon(i,g[i],'gc'+i)}<span class="gl">${n}</span><b class="gv" data-gv="${i}">${g[i]}</b><span class="pop" data-pop="${i}"></span></div>`).join('')}</div>
    <button class="mute" id="mute" aria-pressed="${!S.muted}" title="효과음 ${S.muted?'켜기':'끄기'}">${S.muted?'🔇':'🔊'}</button></div>`;
}
function skyline(){
  const B=[[0,70,60],[64,46,84],[114,80,40],[198,56,70],[258,90,52],[352,50,92],[406,72,58],[482,60,76],[546,88,46],[638,52,88],[694,70,62],[768,60,80]];
  let w='';B.forEach(([x,wd,h],k)=>{for(let yy=120-h+10;yy<112;yy+=14)for(let xx=x+8;xx<x+wd-8;xx+=14)if((xx+yy+k)%3)w+=`<rect x="${xx}" y="${yy}" width="6" height="7" rx="1" class="win"/>`});
  return `<svg viewBox="0 0 830 120" preserveAspectRatio="xMidYMax slice" width="100%" height="100%">${B.map(([x,wd,h],k)=>`<rect x="${x}" y="${120-h}" width="${wd}" height="${h}" class="${k%2?'b2':'b1'}"/>`).join('')}${w}</svg>`;
}
function stage(inner,eve,cls){return `<section class="stage ${eve?'eve':''} ${cls||''}" aria-label="신입 100일 생존기 게임"><div class="sky" aria-hidden="true">${skyline()}</div><div class="stage-in">${inner}</div></section>`}
function topbar(extra){const G=S.game,D=DAYS[G.dayIdx];return `<div class="gtop"><span class="gday">D+${D.day}</span><span class="glabel">${esc(D.label)}</span>${extra||''}</div>`}
function pips(){const G=S.game,D=DAYS[G.dayIdx];return `<span class="gprog" aria-label="오늘 할 일 ${Math.min(G.pos,D.cards.length)}/${D.cards.length} 완료">${D.cards.map((c,i)=>`<i class="${i<G.pos||(i===G.pos&&G.phase==='feedback')?'done':i===G.pos?'now':''}"></i>`).join('')}</span>`}
function journey(){const G=S.game;const nodes=[...DAYS.map(d=>'D+'+d.day),'D+100'];return `<ol class="journey" aria-label="100일 지도">${nodes.map((n,i)=>`<li class="${i<G.dayIdx?'done':i===G.dayIdx?'now':''}"><i></i><span>${n}</span></li>`).join('')}</ol>`}
function speakerArt(p,mood){
  if(p.img)return `<img src="assets/${p.img}.jpg" alt="" draggable="false">`;
  if(p.icon)return `<div class="art-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[p.icon]}</svg></div>`;
  if(p.me)return `<div class="art-bri">${person(myLook(),{mood:mood||'tired',size:150})}</div>`;
  return `<div class="art-bri">${bri({size:170,wave:true})}</div>`;
}

function game(){
  const G=S.game;
  if(G.phase==='dayintro')G.phase='commute';
  if(G.phase==='play')G.phase='office';
  if(G.phase==='setup'){
    const L=myLook();
    const sw=(key,vals,lab)=>`<div class="f">${lab}<div class="swatches" role="group" aria-label="${lab}">${vals.map((v,k)=>`<button type="button" class="sw" style="background:${v}" aria-pressed="${L[key]===v}" aria-label="${lab} ${k+1}" data-key="${key}" data-v="${v}"></button>`).join('')}</div></div>`;
    return stage(`<div class="creator2">
      <div class="cre-pv"><div class="cre-stage">${person(L,{size:170,mood:'happy',wave:true})}</div><b id="pvName">${esc(G.name||'이름을 입력하세요')}</b><span>㈜하이브릿지 인사팀 신입</span></div>
      <div class="cre-form">
        <div><h1 class="g-h1">캐릭터 만들기</h1><p class="small muted">1-1 아바타 생성 · 100일 동안 함께할 나를 만들어요.</p></div>
        <label class="f" for="nm">이름<input type="text" id="nm" maxlength="8" placeholder="예: 김하이" value="${esc(G.name)}"></label>
        <div class="f">헤어<div class="seg2" role="group" aria-label="헤어">${LOOK_OPTS.style.map(([v,t])=>`<button type="button" aria-pressed="${L.style===v}" data-key="style" data-v="${v}">${t}</button>`).join('')}</div></div>
        ${sw('hair',LOOK_OPTS.hair,'머리 색')}${sw('shirt',LOOK_OPTS.shirt,'옷 색')}${sw('skin',LOOK_OPTS.skin,'피부 톤')}
        <div class="f">관심 있는 인사 파트<div class="parts" id="parts">${PARTS.map((p,i)=>`<button type="button" aria-pressed="${i===G.part}" data-i="${i}">${p}</button>`).join('')}</div></div>
        <button class="btn big" id="toId">사원증 발급받기</button>
      </div></div>`);
  }
  if(G.phase==='idcard'){
    const sn='HB-2026-'+String(100+[...(G.name||'김하이')].reduce((a,c)=>a+c.charCodeAt(0),0)%900).padStart(3,'0');
    return stage(`<div class="onboard">
      <div class="idcard"><div class="id-top"><img src="assets/logo-white.png" alt="HiBridge"><span>사원증</span></div>
        <div class="id-body"><div class="id-photo">${person(myLook(),{head:true,mood:'happy'})}</div>
        <dl><dt>이름</dt><dd>${esc(myName())}</dd><dt>소속</dt><dd>경영지원본부 인사팀</dd><dt>관심 파트</dt><dd>${PARTS[G.part]}</dd><dt>사번</dt><dd class="mono">${sn}</dd></dl></div>
        <div class="id-foot">입사를 환영합니다 · ㈜하이브릿지</div></div>
      <div class="rules"><h2 class="g-h2">4대 밸런스 지표</h2>
        <ul class="balance">${GAUGES.map((n,i)=>`<li>${gIcon(i,50,'rc'+i)}<div><b>${n}</b><span>${G_SUB[i]}</span></div></li>`).join('')}</ul>
        <p class="warnline">모두 50에서 시작해요. <b>하나라도 0이 되면</b> 번아웃 · 고립 엔딩이에요.</p>
        <p class="small muted">사무실에서 머리 위에 <b>!</b> 가 뜬 사람에게 다가가 말을 걸면 상황이 시작돼요. ← → 키나 바닥 클릭으로 이동하고, Space로 말을 걸어요. 고를 때는 카드를 좌우로 밀거나 1 · 2 · 3 키를 눌러요.</p>
        <div class="row"><button class="btn big" id="go">첫 출근하기</button><button class="btn ghost" id="back">캐릭터 다시 꾸미기</button></div>
      </div></div>`);
  }
  if(G.phase==='ending')return endingHTML();
  const D=DAYS[G.dayIdx];

let AC=null;
function sfx(t){

  let t0=AC.currentTime;
  N.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t==='blip'||t==='step'?'square':'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(t==='blip'||t==='step'?.025:.07,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.02);t0+=d*.9});

    if(k<1)requestAnimationFrame(step)};

    const enter=()=>{if(cur){G.phase='talk';G.typed=false;save();sfx('select');route();window.scrollTo(0,0)}else{G.phase='leave';save();route();window.scrollTo(0,0)}};
    const walkTo=(x,then)=>{x=Math.max(4,Math.min(92,x));const dist=Math.abs(x-G.px);
      const dur=RM()?0:Math.min(1400,120+dist*28);me.style.transition=`left ${dur}ms linear`;me.classList.add('walk');me.style.left=x+'%';
      const steps=Math.round(dist/8);for(let k=0;k<steps;k++)setTimeout(()=>sfx('step'),k*(dur/Math.max(1,steps)));
      setTimeout(()=>{me.classList.remove('walk');G.px=x;save();then?then():route()},dur+30)};
    const near=()=>Math.abs(G.px-goal)<6;
    $('#act').addEventListener('click',()=>near()?enter():walkTo(goal,enter));
    $('#mvL').addEventListener('click',()=>walkTo(G.px-8));
    $('#mvR').addEventListener('click',()=>walkTo(G.px+8));
    $('#floor').addEventListener('click',e=>{const r=$('#office').getBoundingClientRect();walkTo((e.clientX-r.left)/r.width*100)});
    document.querySelectorAll('.ent').forEach(b=>b.addEventListener('click',()=>{
      if(b.classList.contains('cur'))return near()?enter():walkTo(goal,enter);
      const tip=b.dataset.door?'아직 오늘 할 일이 남았어요. ! 표시를 확인하세요.':(b.classList.contains('done')?'아까 고마웠어요!':NPC_IDLE[(+b.dataset.k)%NPC_IDLE.length]);
      toast(tip)}));
    let busy=false;
    GK.office=e=>{if(busy)return false;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){busy=true;walkTo(G.px+(e.key==='ArrowLeft'?-6:6),()=>{busy=false;route()});return true}
      if(e.key===' '||e.key==='Enter'){near()?enter():walkTo(goal,enter);return true}};
    return;
  }
  if(G.phase==='talk'){
    const id=DAYS[G.dayIdx].cards[G.pos],text=CARDS[id].text,tEl=$('#dtext');
    let typer=null;
    const reveal=()=>{clearInterval(typer);typer=null;tEl.textContent=text;$('#dnext').hidden=true;$('#choose').hidden=false;if(!G.typed){G.typed=true;save()}};
    if(!G.typed){let i=0;typer=setInterval(()=>{i+=2;tEl.textContent=text.slice(0,i);if(i%6===0)sfx('blip');if(i>=text.length)reveal()},RM()?1:26)}
    $('#dlg').addEventListener('click',()=>{if(!G.typed)reveal()});
    const card=$('#gcard'),picks=[...document.querySelectorAll('.pick')];
    const hint=i=>document.querySelectorAll('.hud .dot').forEach(h=>{const v=i==null?0:Math.abs(CARDS[id].ch[i].d[+h.dataset.h]);const s=v>=12?14:v>=7?10:v?7:0;h.style.width=h.style.height=s+'px'});
    let sx=0,dx=0,drag=false,done=false;
    const setX=(x,anim)=>{dx=x;card.style.transition=anim?'':'none';card.style.transform=`translateX(${x}px) rotate(${x/16}deg)`;
      const side=x<-24?0:x>24?1:null;card.classList.toggle('l',side===0);card.classList.toggle('r',side===1);
      picks.forEach(b=>b.classList.toggle('hot',+b.dataset.i===side));hint(side)};
    const commit=i=>{if(done)return;done=true;hint(i);sfx('select');
      card.style.transition='transform .34s ease, opacity .34s ease';
      card.style.transform=i===2?'translateY(140px) scale(.85)':`translateX(${i?'':'-'}140%) rotate(${i?24:-24}deg)`;card.style.opacity='0';
      setTimeout(()=>choose(i),RM()?0:320)};
    card.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;card.setPointerCapture(e.pointerId)});
    card.addEventListener('pointermove',e=>{if(drag)setX(e.clientX-sx)});
    const end=()=>{if(!drag)return;drag=false;if(Math.abs(dx)>100)commit(dx<0?0:1);else setX(0,true)};
    card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
    picks.forEach(b=>{const i=+b.dataset.i;
      b.addEventListener('mouseenter',()=>{if(!drag&&!done)i===2?hint(2):setX(i?44:-44,true)});
      b.addEventListener('focus',()=>{if(!done)i===2?hint(2):setX(i?44:-44,true)});
      b.addEventListener('mouseleave',()=>{if(!drag&&!done)setX(0,true)});
      b.addEventListener('click',()=>commit(i))});
    GK.talk=e=>{
      if(!G.typed){if(e.key===' '||e.key==='Enter'){reveal();return true}return false}
      if(e.key==='ArrowLeft'||e.key==='1'){setX(-60,true);setTimeout(()=>commit(0),180);return true}
      if(e.key==='ArrowRight'||e.key==='2'){setX(60,true);setTimeout(()=>commit(1),180);return true}
      if(e.key==='3'){commit(2);return true}};
    return;
  }
  if(G.phase==='feedback'){
    const id=DAYS[G.dayIdx].cards[G.pos];
    if(G.anim){const from=G.anim;G.anim=null;save();tweenGauges(from)}
    $('#next').addEventListener('click',()=>{
      const z=G.g.findIndex(v=>v<=0);
      if(z>-1){G.fail=z;G.phase='ending'}else{G.pos++;G.phase='office';G.typed=false}
      save();route();window.scrollTo(0,0)});
    $('#ask').addEventListener('click',()=>askSenior(id));
    GK.feedback=e=>{if(e.key==='Enter'){$('#next').click();return true}};
    return;
  }
  if(G.phase==='retro'){
    $('#rt').addEventListener('input',e=>{G.retroText=e.target.value;save()});
    $('#reveal')?.addEventListener('click',()=>{G.retroShown=true;save();sfx('select');route()});
    $('#askR')?.addEventListener('click',e=>{e.preventDefault();askSenior(DAYS[G.dayIdx].retro.card)});
    $('#nextDay')?.addEventListener('click',()=>{
      if(G.dayIdx<DAYS.length-1){G.dayIdx++;G.pos=0;G.phase='commute'}else{G.phase='ending';S.done++}
      save();route();window.scrollTo(0,0)});
    return;
  }
  if(G.phase==='ending'){
    $('#again').addEventListener('click',()=>{G.phase='setup';save();route()});
    $('#share')?.addEventListener('click',()=>{const E=endingType();
      S.posts.unshift({id:'p'+Date.now(),ch:'peer',by:myName(),tag:'신입 · '+PARTS[G.part]+' · D+100',t:`100일 생존 완료! 제 유형은 '${E.t}'이에요. ${E.n||''}`,when:'방금',mine:true});
      S.shared=true;S.channel='peer';save();toast('동기방에 공유했어요');location.hash='#community'});
  }
};

function pickReg(type){
  const G=S.game;
  if(G.regPick&&G.regPick.day===G.dayIdx)return S.db.find(d=>d.id===G.regPick.id)||null;
  G.seen=G.seen||[];
  const pub=S.db.filter(d=>d.status==='게시'&&d.full&&!G.seen.includes(d.id));
  if(!pub.length)return null;
  const d=pub.find(x=>x.type===type)||pub[0];
  G.regPick={day:G.dayIdx,id:d.id};G.seen.push(d.id);S.views[d.id]=(S.views[d.id]||0)+1;save();
  return d;
}

function askSenior(id){

function contribHTML(mine){
  const pub=mine.filter(d=>d.status==='게시');
  const learned=pub.reduce((a,d)=>a+(S.views[d.id]||0),0);
  const answers=Object.values(S.replies).flat().filter(r=>r.by==='선배 (나)').length;
  const badges=[['첫 경험 등록',mine.length>=1],['게시된 사례',pub.length>=1],['신입 질문에 답변',answers>=1],['꾸준한 멘토 (3건 이상)',mine.length>=3]];
  const notice=learned?`<div class="notice">내 사례로 배운 신입이 <b>${learned}명</b> 있어요.</div>`
    :pub.length?`<div class="notice">게시된 사례가 신입의 퇴근 회고에 나오면 배운 신입 수가 올라가요.</div>`
    :`<p class="small muted">등록한 경험이 HRD 검토를 거쳐 게시되면 신입의 퇴근 회고에 나오고, 내 사례로 배운 신입 수가 집계돼요.</p>`;
  return `${notice}
    <div class="badges">${badges.map(([n,on])=>`<span class="chip ${on?'':'gray badge-off'}">${on?'✓ ':''}${n}</span>`).join('')}</div>
    ${mine.length?`<div class="mylist">${mine.slice(0,5).map(d=>`<div><span class="t">${esc(d.title)}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="chip ${d.status==='게시'?'good':d.status==='보류'?'gray':'amber'}">${d.status}</span><span class="muted">배운 신입 ${S.views[d.id]||0}명</span></span></div>`).join('')}</div>`:''}
    <p class="small muted">게시된 사례와 답변 수는 멘토링 활동 기록으로 HRD 담당자에게 전달돼요. 집계는 이 브라우저 기준이에요.</p>`;
}
bind.register=()=>{
  const f=$('#regf');
  const map={'r-idate':'idate','r-iby':'iby','r-who':'who','r-year':'year','r-part':'part','r-rel':'rel','r-when':'when','r-before':'before','r-q1':'q1','r-q2':'q2','r-q3':'q3','r-q4':'q4'};
  const pv=()=>{
    $('#pv-rel').textContent=REG.rel||'인물 관계';$('#pv-when').textContent=REG.when||'시점';$('#pv-part').textContent=REG.part;
    $('#pv-q1').textContent=REG.q1||'① 당황했던 순간이 상황 카드의 지문이 됩니다.';
    $('#pv-who').innerHTML=`${esc(REG.who||'익명 선배')}<span>${esc(REG.year)}</span>`;
    $('#pv-q2').textContent=REG.q2||'② 내 대응이 선배 피드백이 되고,';
    $('#pv-q3').textContent=REG.q3?'판단 근거: '+REG.q3:'③ 판단 근거가 피드백의 핵심이 됩니다.';
    $('#pv-q4').textContent=REG.q4?'퇴근 회고 팁 · '+REG.q4:'④ 조언은 퇴근 회고의 선배 팁으로 쓰여요.';
  };
  f.addEventListener('input',e=>{const k=map[e.target.id];if(k){REG[k]=e.target.value;pv()}});
  $('#r-proxy').addEventListener('change',e=>{REG.proxy=e.target.checked;route()});
  $('#r-sample').addEventListener('click',()=>{REG={...REG,who:'한지훈',year:'10년차 이상',part:'노무·조직문화',rel:'현업 팀장',when:'입사 3개월 차',before:'사수 선배 외근 중',
    q1:'현업 팀장님이 찾아와 "저 직원 좀 내보내 달라"고 하셨어요.',q2:'"알아보겠습니다"라고만 하고, 아무것도 기록하지 않았어요.',q3:'인사팀이 뭐든 해결해 줘야 한다고 생각했어요. 사실관계가 없으면 할 수 있는 게 없다는 걸 몰랐어요.',q4:'들으면서 바로 적으세요. 언제, 무엇을, 몇 번.'};route()});
  f.addEventListener('submit',e=>{e.preventDefault();
    if(!REG.q1.trim()||!REG.q2.trim()||!REG.q3.trim()){toast('1~3번 질문은 꼭 답해 주세요');return}
    S.db.unshift({id:'d'+Date.now(),type:REG.part,title:REG.q1.slice(0,40)+(REG.q1.length>40?'…':''),src:REG.proxy?'HRD 면담 대행':'시니어 등록',by:REG.who||'익명',status:'검토 대기',full:{...REG}});
    REG={...REG_DEFAULT};save();toast('등록했어요. HRD 검토 후 상황 카드로 게시돼요');route();window.scrollTo(0,0)});
};

/* ---------- hrd ---------- */
function hrd(){
  const ids=Object.keys(CARDS);
  const rows=ids.map(id=>{const c=CARDS[id],st=S.stats[id]||[0,0,0],cn=c.seed.map((v,i)=>v+(st[i]||0)),t=cn.reduce((a,b)=>a+b,0);
    const neg=cn.reduce((a,v,i)=>a+(c.ch[i].d.reduce((x,y)=>x+y,0)<0?v:0),0);return{id,c,cn,t,neg:pct(neg,t)}});
  const stuck=[...rows].sort((a,b)=>b.neg-a.neg).slice(0,3);
  const participants=48+S.runs,finished=31+S.done;
  const unanswered=allPosts().filter(p=>p.ch!=='peer'&&!repliesOf(p).length).length;
  const base=ids.map(id=>({id,type:CARDS[id].type,title:CARDS[id].title,src:'시니어 인터뷰 (예시)',status:'게시',layer:layerOf(id)}));
  const db=[...S.db,...base];
  const types=['전체',...TYPES,'미분류'];
  const shown=S.filter==='전체'?db:db.filter(d=>d.type===S.filter);
  return `
  <div><h1 class="h1" style="font-size:32px;margin-top:6px">운영 대시보드</h1>
  <p class="lead" style="margin-top:6px">신입들의 선택에서 자주 막히는 상황을 찾고, 시니어 경험을 시나리오로 묶어 교육과 멘토링을 보완해요.</p>
  <p class="sample" style="margin-top:8px">예시 데이터에 이 브라우저에서 플레이한 기록이 더해져 표시돼요.</p></div>
  <section class="grid4">
    <div class="kpi"><span>참여 신입</span><b>${participants}명</b><small>이번 기수 기준</small></div>
    <div class="kpi"><span>100일 완주율</span><b>${pct(finished,participants)}%</b><small>${finished}명 완주</small></div>
    <div class="kpi"><span>시나리오 DB</span><b>${db.length}건</b><small>검토 대기 ${db.filter(d=>d.status==='검토 대기').length}건</small></div>
    <div class="kpi"><span>답변 대기 질문</span><b>${unanswered}건</b><small>소통 공간 · 동기방 제외</small></div>
  </section>
  <section class="grid2" style="align-items:start">
    <div class="panel" style="display:grid;gap:14px">
      <div class="row" style="justify-content:space-between"><h2 class="h2" style="font-size:18px">상황별 선택 분포</h2>
      <div class="legend"><span><i style="background:#7fa2dc"></i>A</span><span><i style="background:var(--blue)"></i>B</span><span><i style="background:#b9c9e6"></i>C</span></div></div>
      <div class="distlist">${rows.map(r=>`<div class="it"><div class="nm">${esc(r.c.title)}<span>${esc(r.c.type)} · ${r.t}명</span></div><div class="stack" role="img" aria-label="A ${pct(r.cn[0],r.t)}%, B ${pct(r.cn[1],r.t)}%, C ${pct(r.cn[2],r.t)}%">${r.cn.map(v=>`<i style="width:${pct(v,r.t)}%">${pct(v,r.t)>=12?pct(v,r.t)+'%':''}</i>`).join('')}</div></div>`).join('')}</div>
    </div>
    <div style="display:grid;gap:20px">
      <div class="panel" style="display:grid;gap:12px"><h2 class="h2" style="font-size:18px">자주 막히는 상황</h2>
        <p class="small muted">게이지가 떨어지는 선택을 한 신입 비율이 높은 순서예요. 입문교육이나 멘토링 주제로 쓰기 좋아요.</p>
        <div class="stuck">${stuck.map(r=>`<div><span>${esc(r.c.title)} <span class="muted small">${esc(r.c.type)}</span></span><b>${r.neg}% 하락</b></div>`).join('')}</div></div>
      <div class="panel soft" style="display:grid;gap:8px"><h2 class="h2" style="font-size:18px">활용 제안</h2>
        <ul style="margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)"><li>막히는 상황 1위를 다음 기수 입문교육 사례로</li><li>답변 대기 질문은 해당 파트 시니어에게 알림</li><li>선택이 고르게 갈리는 카드는 토론형 멘토링 주제로</li></ul></div>
    </div>
  </section>
  <section style="display:grid;gap:12px">
    <div class="row" style="justify-content:space-between"><h2 class="h2" style="font-size:18px">시나리오 DB</h2>
    <div class="filters" id="filters">${types.map(t=>`<button aria-pressed="${t===S.filter}" data-t="${t}">${t}</button>`).join('')}</div></div>
    <p class="small muted">공통 팩은 어느 회사에서나 쓰는 기본 시나리오, 자사 맞춤은 하이브릿지 시니어 경험으로 만든 시나리오예요. 제목을 누르면 여러 선배의 대응을 함께 볼 수 있어요.</p>
    <div class="tbl"><table><thead><tr><th>구분</th><th>유형</th><th>제목</th><th>출처</th><th>상태</th><th></th></tr></thead><tbody>
    ${shown.map(d=>{const ly=d.layer||'자사 맞춤';return `<tr><td><span class="chip ${ly==='공통 팩'?'gray':''}">${ly}</span></td><td><span class="chip gray">${esc(d.type)}</span></td><td><button class="linkbtn" data-open="${d.id}" aria-expanded="${S.open===d.id}">${esc(d.title)}<span>${S.open===d.id?'접기':'보기'}</span></button></td><td class="muted">${esc(d.src)}${d.by?' · '+esc(d.by):''}</td>
      <td><span class="chip ${d.status==='게시'?'good':d.status==='보류'?'gray':'amber'}">${d.status}</span></td>
      <td>${d.status==='검토 대기'?`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-ok="${d.id}">게시</button><button class="btn sm ghost" data-no="${d.id}">보류</button></span>`:''}</td></tr>${S.open===d.id?`<tr class="detail"><td colspan="6">${detailHTML(d)}</td></tr>`:''}`}).join('')||'<tr><td colspan="6" class="muted">이 유형의 시나리오가 아직 없어요.</td></tr>'}
    </tbody></table></div>
  </section>`;
}
function detailHTML(d){
  const c=CARDS[d.id];
  if(c){const D=DAYS.find(x=>x.cards.includes(d.id));
    return `<div class="dt"><p><b>D+${D.day}</b> · ${esc(c.text)}</p><p class="small muted">인물 관계 ${esc(c.ctx[0])} · 시점 ${esc(c.ctx[1])} · 직전 상황 ${esc(c.ctx[2])}</p>
      <ol type="A">${c.ch.map(x=>`<li>${esc(x.t)} <span class="deltas" style="display:inline-flex;margin-left:6px">${deltaChips(x.d)}</span></li>`).join('')}</ol>
      ${c.sr.map(r=>{const s=SENIORS[r.s];return `<div class="senior">${avatar(s)}<div><div class="nm">${esc(s.n)}<span>${esc(s.m)} · ${'ABC'[r.p]} 선택</span></div><q>${esc(r.q)}</q><div class="why">${esc(r.w)}</div></div></div>`}).join('')}</div>`;}
  if(d.full)return `<div class="dt">${regStoryHTML(d,d.src==='HRD 면담 대행'?`HRD 면담 기록${d.full.idate?' · '+d.full.idate:''}${d.full.iby?' · '+d.full.iby:''}`:'시니어가 직접 등록')}</div>`;
  const p=allPosts().find(x=>x.id===d.from);
  if(p)return `<div class="dt"><p>${esc(p.t)}</p>${repliesOf(p).map(r=>`<p class="small"><b>${esc(r.by)}</b> ${esc(r.t)}</p>`).join('')||'<p class="small muted">아직 답변이 없어요.</p>'}</div>`;
  return '<div class="dt muted">내용이 없어요.</div>';
}
bind.hrd=()=>{
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{S.open=S.open===b.dataset.open?null:b.dataset.open;save();route()}));
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.filter=b.dataset.t;save();route()});
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.ok||b.dataset.no;const d=S.db.find(x=>x.id===id);if(!d)return;
    d.status=b.dataset.ok?'게시':'보류';save();toast(b.dataset.ok?(d.full?'게시했어요. 신입의 퇴근 회고에 나와요':'게시했어요'):'보류했어요');route()}));
};

route();
</script>

</body>
</html>
