<style>
/* Layout: white app shell — sticky brand header, tab rail, one working view at a time; the game view centres a single situation card. */
:root{
  color-scheme: light;
  --blue:#004aad; --blue-deep:#00307a; --blue-soft:#eef3fc; --blue-line:#cfdcf3;
  --ink:#1c2333; --ink-2:#4a5468; --ink-3:#7c8597;
  --line:#e3e8f0; --bg:#ffffff; --bg-soft:#f6f8fc;
  --amber:#ffb400; --amber-soft:#fff6de;
  --good:#17804f; --good-soft:#e7f5ee; --warn:#c2410c; --warn-soft:#fdeee6;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand img{height:28px;width:auto;display:block}
.brand .svc{border-left:1px solid var(--line);padding-left:12px;font-weight:700;color:var(--blue);font-size:15px;white-space:nowrap}
.roles{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--ink-2);padding:10px 14px;border-bottom:2px solid transparent;font-weight:500;font-size:14px;white-space:nowrap}
.tabs a small{font-size:11px;color:var(--ink-3);margin-left:4px;font-weight:400}
.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}

main{padding-block:28px 64px}
.view{display:grid;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--blue);font-weight:700;text-transform:uppercase}
.h1{font-family:var(--sans);font-size:clamp(30px,4.6vw,46px);line-height:1.25;color:var(--blue);font-weight:800;letter-spacing:-.02em}
.h2{font-family:var(--sans);font-size:22px;color:var(--ink);font-weight:700}
.lead{color:var(--ink-2);font-size:16px;max-width:36em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none}
.btn:hover{background:var(--blue-deep)}
.btn.ghost{background:var(--bg);color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:500;white-space:nowrap}
.chip.gray{background:var(--bg-soft);color:var(--ink-2);border:1px solid var(--line)}
.chip.amber{background:var(--amber-soft);color:#8a5a00}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:22px}
.soft{background:var(--bg-soft);border-color:transparent}
.sample{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sample::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.grid4{grid-template-columns:minmax(0,1fr)}}

/* home */
/* hero: game title screen */
.hx{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#00245c 0%,#004aad 58%,#2f6fd6 100%);color:#fff;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
@media (max-width:820px){.hx{grid-template-columns:minmax(0,1fr)}}
.hx .big{position:absolute;right:-.06em;bottom:-.28em;font-size:clamp(180px,30vw,360px);font-weight:800;line-height:1;color:rgba(255,255,255,.06);letter-spacing:-.06em;pointer-events:none;user-select:none}
.hx-copy{position:relative;display:grid;gap:20px}
.hx h1{font-size:clamp(38px,6.4vw,66px);line-height:1.1;font-weight:800;letter-spacing:-.035em}
.hx h1 em{font-style:normal;color:var(--amber)}
.hx-copy > p{color:#d6e2f7;font-size:17px;max-width:30em}
.btn.start{background:var(--amber);border-color:var(--amber);color:var(--ink);padding:15px 28px;font-size:17px;border-radius:14px;box-shadow:0 12px 28px -12px rgba(255,180,0,.9)}
.btn.start:hover{background:#ffc533}
.hx-stage{position:relative;display:grid;justify-items:center}
.hx-stage::before{display:none;content:"";position:absolute;top:50%;left:50%;width:250px;height:250px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0 52%,rgba(255,255,255,.25) 53%,rgba(255,255,255,0) 70%)}
.hx-me{position:relative;z-index:1;width:min(100%,240px);aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:6px solid rgba(255,255,255,.92);box-shadow:0 24px 50px -20px rgba(0,10,40,.7);animation:float 3.6s ease-in-out infinite}
.hx-me svg{display:block;margin-top:10px}
.hx-guide{position:absolute;z-index:2;left:calc(50% - 170px);bottom:-10px;width:96px;height:96px;display:grid;place-items:center;background:#fff;border-radius:50%;box-shadow:0 14px 30px -14px rgba(0,10,40,.6);animation:float 3s ease-in-out infinite reverse}
@media (max-width:420px){.hx-guide{left:0}}
@keyframes float{50%{transform:translateY(-8px)}}

/* feature cards */
.feats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.feats{grid-template-columns:minmax(0,1fr)}}
.feat{display:flex;flex-direction:column;gap:8px;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--bg);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
.feat:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(0,48,122,.5);border-color:var(--blue-line)}
.feat.hot{background:var(--blue);border-color:var(--blue);color:#fff}
.feat .fi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);margin-bottom:6px;overflow:hidden}
.feat .fi svg{width:24px;height:24px}
.feat .fi.br svg,.feat .fi.pt svg{width:100%;height:100%;display:block}
.feat.hot .fi{background:#fff}
.feat .who{font-size:12px;font-weight:700;color:var(--blue)}
.feat.hot .who{color:var(--amber)}
.feat h3{font-size:19px;letter-spacing:-.015em}
.feat p{font-size:14px;color:var(--ink-2)}
.feat.hot p{color:#d6e2f7}
.feat .go{margin-top:auto;padding-top:8px;font-weight:700;font-size:14px;color:var(--blue)}
.feat.hot .go{color:#fff}
.feat .go::after{content:"→";display:inline-block;margin-left:6px;transition:transform .2s}
.feat:hover .go::after{transform:translateX(4px)}
.cycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cycle > div{padding:18px;display:grid;gap:6px;border-right:1px solid var(--line);position:relative}
.cycle > div:last-child{border-right:0}
.cycle b.l{font-family:var(--sans);font-size:26px;color:var(--blue);line-height:1}
.cycle .k{font-weight:700}
.cycle .f{font-size:13px;color:var(--ink-2)}
@media (max-width:760px){.cycle{grid-template-columns:repeat(2,minmax(0,1fr))}.cycle>div:nth-child(2){border-right:0}.cycle>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.company{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.company img{width:150px;height:auto}
@media (max-width:560px){.company{grid-template-columns:minmax(0,1fr)}.company img{width:120px}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:0}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:0;font-weight:500}
@media (max-width:480px){.facts{grid-template-columns:minmax(0,1fr)}}

/* situation card */
.sc{border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:0 10px 30px -18px rgba(0,48,122,.35);overflow:hidden}
.sc-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:#eeecf0;overflow:hidden}
.av.ic{background:var(--blue-soft);color:var(--blue)}
.av.ic svg{width:56%;height:56%}
.av.br{background:var(--blue-soft)}
.av.br svg{display:block}
.av.sm{width:34px;height:34px}
.av.xs{width:26px;height:26px}
.sc-head .who{min-width:0}
.sc-head .who b{display:block;font-size:15px}
.sc-head .who span{font-size:12px;color:var(--ink-3)}
.sc-head .chip{margin-left:auto}
.sc-body{padding:22px 20px;display:grid;gap:16px}
.sc-title{font-family:var(--sans);font-size:21px;color:var(--blue)}
.sc-text{font-size:17px;line-height:1.75}
.ctx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.ctx div{background:var(--bg-soft);border-radius:8px;padding:8px 10px;min-width:0}
.ctx dt{color:var(--ink-3)}
.ctx dd{margin:0;color:var(--ink);font-weight:500}
@media (max-width:520px){.ctx{grid-template-columns:minmax(0,1fr)}}

/* game */
.game{max-width:640px;margin:0 auto;width:100%;display:grid;gap:18px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g{display:grid;gap:5px;position:relative}
.g .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.g .bar{height:8px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line);overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}
.g.low .bar i{background:var(--warn)}
.g.low .lab b{color:var(--warn)}
.g .hint{position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-radius:50%;background:var(--amber);opacity:0;transition:opacity .15s}
.g .hint.on{opacity:1}
@media (max-width:480px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dayline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayline .d{font-family:var(--sans);font-size:28px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.progress{display:flex;gap:4px;margin-left:auto}
.progress i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--blue)}
.progress i.now{background:var(--amber)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--blue-line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.55;transition:background .15s,border-color .15s}
.choice:hover,.choice:focus-visible{background:var(--blue-soft);border-color:var(--blue)}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.deltas{display:flex;gap:6px;flex-wrap:wrap}
.fb{display:grid;gap:14px}
.mine{border-left:3px solid var(--blue);padding:4px 0 4px 14px;display:grid;gap:6px}
.senior{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border-radius:12px;background:var(--bg-soft)}
.senior .av{width:46px;height:46px}
.senior .nm{font-weight:700;font-size:14px}
.senior .nm span{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.senior q{display:block;quotes:none;margin:4px 0 6px}
.senior .why{font-size:13px;color:var(--blue)}
.dist{display:grid;gap:6px}
.dist .r{display:grid;grid-template-columns:22px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.dist .track{height:10px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.dist .track i{display:block;height:100%;background:var(--blue-line)}
.dist .r.me .track i{background:var(--blue)}
.dist .r.me b{color:var(--blue)}
/* embedded office game */
.game.wide.world{max-width:1040px}
.gframe-wrap{display:grid;gap:10px;max-width:1040px;margin:0 auto;width:100%}
.gframe-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gframe{display:block;width:100%;aspect-ratio:16/9;min-height:480px;border:0;border-radius:16px;background:#1b2033;box-shadow:0 24px 50px -30px rgba(0,30,80,.6)}
@media (max-width:640px){.gframe{aspect-ratio:auto;height:78vh;min-height:0}}
/* character creator */
.game.wide{max-width:1000px}
.cc{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);border-radius:24px;overflow:hidden;background:#0d1a38;color:#fff;box-shadow:0 30px 60px -34px rgba(0,30,80,.7)}
@media (max-width:780px){.cc{grid-template-columns:minmax(0,1fr)}}
.cc-stage{position:relative;display:grid;place-items:center;align-content:center;gap:10px;padding:56px 24px 28px;background:radial-gradient(ellipse 60% 55% at 50% 40%,#f3f7ff 0%,#c4d6f7 38%,#3a62b4 72%,#0d1f4d 100%);min-height:440px;overflow:hidden}
.cc-stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px);mask-image:linear-gradient(to bottom,transparent,#000 60%)}
.cc-stage::after{content:"";position:absolute;left:50%;bottom:96px;width:62%;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(11,26,58,.28),rgba(11,26,58,0));pointer-events:none}
.cc-label{position:absolute;top:18px;left:20px;font-size:11px;letter-spacing:.24em;font-weight:800;color:rgba(255,255,255,.7)}
.cc-dice{position:absolute;top:12px;right:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;z-index:2}
.cc-dice:hover{background:rgba(255,255,255,.16)}
.cc-fig{position:relative;z-index:1;display:grid;place-items:center;animation:enter .35s ease both}
.cc-fig svg{display:block;max-width:100%;height:auto}
.cc-plate{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;background:rgba(5,14,36,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:10px 22px;margin-top:4px}
.cc-plate{grid-auto-flow:column;align-items:center;gap:12px!important;justify-items:start!important;transition:box-shadow .2s}
.cc-plate.hl{box-shadow:0 0 0 2px var(--amber)}
.cc-pf{width:52px;height:52px;border-radius:50%;overflow:hidden;display:block;border:2px solid #fff;flex:none;transition:background .2s}
.cc-pf svg{display:block}
.cc-pt{display:grid;gap:2px}
.cc-plate b{font-size:20px;letter-spacing:-.01em}
.cc-plate span{font-size:12px;color:#b9c8e6}
.cc-panel{padding:24px;display:grid;gap:18px;align-content:start;background:#0f1d3d}
.cc-title{font-size:22px;margin-top:4px;letter-spacing:-.02em}
.cc-tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px}
.cc-tabs button{flex:1;border:0;background:none;color:#a9b8d8;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px}
.cc-tabs button[aria-pressed="true"]{background:#fff;color:#0d1a38}
.cc-body{display:grid;gap:16px;min-height:236px;align-content:start}
.cc-sec{display:grid;gap:10px}
.cc-sec h4{margin:0;font-size:12px;color:#a9b8d8;letter-spacing:.04em;font-weight:700}
.cc-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.cc-opts button{border:2px solid transparent;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 4px 7px;display:grid;gap:5px;justify-items:center;color:#cfdbf3;font-size:12px;transition:background .15s,border-color .15s}
.cc-opts button:hover{background:rgba(255,255,255,.11)}
.cc-opts .th{width:54px;height:54px;border-radius:50%;overflow:hidden;display:block;padding:4px}
.cc-opts .th svg{display:block}
.cc-opts button[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,180,0,.12);color:#fff;font-weight:700}
.cc-sw{display:flex;flex-wrap:wrap;gap:10px}
.cc-sw button{width:36px;height:36px;border-radius:50%;border:3px solid #0f1d3d;box-shadow:0 0 0 1px rgba(255,255,255,.22);transition:transform .15s}
.cc-sw button:hover{transform:scale(1.08)}
.cc-sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--amber);transform:scale(1.08)}
.cc-foot{display:grid;gap:12px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}
.cc label.f,.cc .f{color:#a9b8d8}
.cc input[type=text]{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}

label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:15px}

/* community */
.cm-hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,#00245c 0%,#004aad 60%,#2f6fd6 100%);color:#fff;padding:clamp(22px,4vw,34px);display:flex;align-items:center;justify-content:space-between;gap:20px}

.cm-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

.cm-hero-bri{flex:none;width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 16px 30px -16px rgba(0,10,40,.6)}

.cm-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.cm-tabs{grid-template-columns:minmax(0,1fr)}}
.cm-tabs button{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 16px;transition:border-color .15s,background .15s,box-shadow .15s}
.cm-tabs button:hover{border-color:var(--blue-line);background:var(--bg-soft)}
.cm-tabs button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 10px 24px -18px rgba(0,48,122,.6)}
.cm-ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--bg-soft);display:grid;place-items:center;font-size:22px}
.cm-tabs button[aria-pressed="true"] .cm-ic{background:#fff}
.cm-tx{display:grid;min-width:0;flex:1}
.cm-tx b{font-size:15px}
.cm-tx small{font-size:12px;color:var(--ink-3)}
.cm-tabs button[aria-pressed="true"] .cm-tx b{color:var(--blue)}
.cm-badge{flex:none;font-size:12px;font-weight:700;background:var(--bg-soft);color:var(--ink-2);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.cm-badge.warn{background:var(--amber-soft);color:#8a5a00}
.cm-feed{display:grid;gap:14px;max-width:820px;width:100%;margin:0 auto}
.cm-compose{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--blue-line);background:var(--bg);border-radius:18px;padding:16px;box-shadow:0 12px 30px -24px rgba(0,48,122,.55)}
.cm-compose > .av{width:40px;height:40px}
.cm-compose-body{flex:1;min-width:0;display:grid;gap:10px}
.cm-compose textarea{border:0;background:var(--bg-soft);border-radius:12px;min-height:64px;padding:12px 14px;font-size:15px}
.cm-compose textarea:focus{box-shadow:0 0 0 3px var(--blue-soft);background:#fff;outline:1px solid var(--blue)}
.cm-compose-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cm-compose-foot .btn{margin-left:auto}
.cm-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.cm-toggle input{position:absolute;opacity:0;width:1px;height:1px}
.cm-toggle span{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.cm-toggle span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.cm-toggle input:checked + span{background:var(--blue)}
.cm-toggle input:checked + span::after{transform:translateX(14px)}
.cm-toggle input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}
.cm-post{border:1px solid var(--line);border-radius:18px;background:var(--bg);padding:18px 18px 14px;display:grid;gap:10px;transition:box-shadow .15s}
.cm-post:hover{box-shadow:0 14px 30px -26px rgba(0,48,122,.6)}
.cm-post header{display:flex;align-items:center;gap:10px}
.cm-who{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.cm-who b{font-size:15px}
.cm-who small{font-size:12px;color:var(--ink-3)}
.cm-when{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.cm-st{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.cm-st.wait{background:var(--amber-soft);color:#8a5a00}
.cm-st.done{background:var(--good-soft);color:var(--good)}
.cm-ref{justify-self:start;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;background:var(--blue-soft);color:var(--blue);border-radius:8px;padding:4px 10px}
.cm-text{font-size:15.5px;line-height:1.7}
.cm-thread{display:grid;gap:8px;padding-left:14px;border-left:2px solid var(--blue-line)}
.cm-reply{display:flex;gap:8px;align-items:flex-start}
.cm-bubble{background:var(--bg-soft);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14px;min-width:0}
.cm-reply.is-sr .cm-bubble{background:var(--blue-soft)}
.cm-rmeta{display:flex;gap:6px;align-items:center;margin-bottom:2px;font-size:13px}
.cm-rmeta small{color:var(--ink-3);font-size:12px}
.cm-post footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.cm-replyform{flex:1;display:flex;gap:6px;min-width:200px}
.cm-replyform input{flex:1;min-width:0;border-radius:999px;padding:8px 14px;font-size:14px;background:var(--bg-soft);border-color:transparent}
.cm-replyform input:focus{background:#fff}
.cm-empty{text-align:center;border:1.5px dashed var(--line);border-radius:18px;padding:34px 16px;font-size:30px}
.cm-empty p{font-size:14px;color:var(--ink-3);margin-top:6px}
/* peer chat room */

.chat-main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.chat-side{border-right:1px solid var(--line);background:var(--bg-soft);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:8px}
.chat-side-h{font-size:12px;font-weight:700;color:var(--ink-3);padding:8px 10px 4px;letter-spacing:.04em}
.chat-it{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;border-radius:12px;padding:9px 10px;min-width:0}
.chat-it:hover{background:#fff}

.chat-it .av.sm{width:38px;height:38px;flex:none}

.chat-it-tx{display:grid;min-width:0}
.chat-it-tx b{font-size:14px}
.chat-it-tx b small{font-weight:500;font-size:11px;color:var(--ink-3);margin-left:2px}
.chat-it-tx > span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-it[aria-pressed="true"] .chat-it-tx b{color:var(--blue)}
.cmsg-bub.typing{display:flex;gap:4px;padding:12px 14px}
.cmsg-bub.typing i{width:7px;height:7px;border-radius:50%;background:#9aa3b5;animation:tdot 1s infinite ease-in-out}
.cmsg-bub.typing i:nth-child(2){animation-delay:.15s}.cmsg-bub.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@media (max-width:720px){.chat-room{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:78vh}
  .chat-side{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .chat-side-h{display:none}.chat-it{flex:none;max-width:170px}}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
.chat-title{display:grid;min-width:0;flex:1}
.chat-title b{font-size:15px}.chat-title small{font-size:12px;color:var(--ink-3)}
.chat-faces{display:flex}.chat-faces .av{width:28px;height:28px;margin-left:-8px;border:2px solid #fff}
.chat-log{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(#f4f7fd,#eef3fc);overscroll-behavior:contain}
.chat-day{display:flex;justify-content:center;margin:8px 0 4px}
.chat-day span{font-size:11px;color:var(--ink-3);background:rgba(255,255,255,.85);border-radius:999px;padding:2px 10px}
.cmsg{display:flex;gap:8px;align-items:flex-start;max-width:86%}
.cmsg.cont{margin-top:-2px}

.cmsg-row{display:flex;align-items:flex-end;gap:6px}

.chat-input{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}

/* profile popover in the peer room */
.chat-room{position:relative}
.cmsg-avbtn,.cmsg-nmbtn,.chat-faces button{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.cmsg-avbtn{flex:none;display:block;transition:transform .15s}

function avatar(p,cls='av'){
  if(p.img&&PORTRAITS[p.img])return `<span class="${cls} pt">${portrait(p.img,true)}</span>`;
  if(p.img)return `<img class="${cls}" src="assets/${p.img}.jpg" alt="">`;
  if(p.icon)return `<span class="${cls} ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[p.icon]}</svg></span>`;
  if(p.me)return `<span class="${cls} br" style="background:${myBg()}">${bri({...myBri(),head:true,wave:false})}</span>`;
  if(p.bri)return `<span class="${cls} br">${bri({...p.bri,head:true,wave:false})}</span>`;
  return avatar({icon:'user'},cls);
}
function authorOf(post){
  if(!post.by)return {bri:{c:'#9aa3b5'}};
  if(post.mine&&S.role==='junior'&&post.by===myName())return {me:true};
  return AUTHORS[post.by]||(/신입/.test(post.tag||'')&&post.by===myName()?{me:true}:{icon:'user'});
}
const pct=(a,b)=>b?Math.round(a/b*100):0;
const myName=()=>S.game.name||'나';

/* ---------- router ---------- */
const VIEWS={home,game,community,register,hrd};
function route(){
  const v=(location.hash||'#home').slice(1);
  const name=VIEWS[v]?v:'home';
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+name?'page':'false'));
  document.querySelectorAll('#roleSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  const same=route._last===name;route._last=name;
  $('#app').innerHTML=`<div class="view${same?'':' enter'}">${VIEWS[name]()}</div>`;
  bind[name]?.();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
$('#roleSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.role=b.dataset.role;save();
  const go={junior:'#game',senior:'#register',hrd:'#hrd'}[S.role];
  if(location.hash===go)route();else location.hash=go;});
const bind={};
window.addEventListener('message',e=>{
  const m=e.data;if(!m||m.src!=='hb-game')return;
  const G=S.game;
  if(m.type==='progress'){G.progress={day:m.day,phase:m.phase,g:m.gauges};save();return}
  if(m.type==='nav'){location.hash='#'+(VIEWS[m.view]?m.view:'home');return}
  if(m.type==='restart'){G.phase='setup';save();route();window.scrollTo(0,0);return}
  if(m.type==='ask'){const anon=m.ch==='anon';
    S.posts.unshift({id:'p'+Date.now(),ch:anon?'anon':'ask',by:anon?null:myName(),tag:anon?'익명 신입':'신입 · '+(PARTS[G.part]||'')+' · '+(m.card.day||''),ref:m.card.day+' · '+m.card.title,t:String(m.text||'').slice(0,500),when:'방금',mine:true});
    save();toast('소통 공간에 질문이 올라갔어요');return}
  if(m.type==='share'){S.posts.unshift({id:'p'+Date.now(),ch:'peer',by:myName(),tag:'신입 · '+(PARTS[G.part]||'')+' · D+100',t:String(m.text||'').slice(0,500),when:'방금',mine:true});
    S.shared=true;S.channel='peer';save();setTimeout(()=>{location.hash='#community'},600);return}
});

/* ---------- game ---------- */
function gaugeHTML(){
  const G=S.game;
  return `<div class="gauges" id="gauges">${GAUGES.map((n,i)=>`<div class="g ${G.g[i]<=25?'low':''}"><span class="hint" data-h="${i}"></span><div class="lab"><span>${n}</span><b>${G.g[i]}</b></div><div class="bar"><i style="width:${G.g[i]}%"></i></div></div>`).join('')}</div>`;
}
function dayHead(){
  const G=S.game,D=DAYS[G.dayIdx];
  const total=DAYS.reduce((a,d)=>a+d.cards.length,0);
  const doneN=DAYS.slice(0,G.dayIdx).reduce((a,d)=>a+d.cards.length,0)+G.pos+(G.phase==='feedback'?1:0)+(G.phase==='retro'?0:0);
  let k=0;const bars=[];
  DAYS.forEach((d,di)=>d.cards.forEach((c,ci)=>{const idx=k++;bars.push(`<i class="${idx<doneN?'done':(di===G.dayIdx&&ci===G.pos&&G.phase==='play')?'now':''}"></i>`)}));
  return `<div class="dayline"><span class="d">D+${D.day}</span><span class="muted">${esc(D.label)}</span><div class="progress" aria-label="진행 ${doneN}/${total}">${bars.join('')}</div></div>`;
}
function cardHTML(id){
  const c=CARDS[id],p=PEOPLE[c.who];
  return `<div class="sc-head">${avatar(p)}<div class="who"><b>${esc(p.n)}</b><span>${esc(p.r)}</span></div><span class="chip">${esc(c.type)}</span></div>

  <dl class="ctx"><div><dt>인물 관계</dt><dd>${esc(c.ctx[0])}</dd></div><div><dt>시점</dt><dd>${esc(c.ctx[1])}</dd></div><div><dt>직전 상황</dt><dd>${esc(c.ctx[2])}</dd></div></dl>`;
}

          <a class="btn ghost" href="#community" id="askR">이 상황 선배에게 물어보기</a></div>`

  }
  const id=D.cards[G.pos],c=CARDS[id];
  if(G.phase==='play'){
    return `<div class="game">${gaugeHTML()}${dayHead()}
      <article class="sc">${cardHTML(id)}

          <button class="btn ghost" id="ask">선배에게 물어보기</button>
        </div>
      </div>
    </div></article></div>`;
}
function endingType(){
  const g=S.game.g;
  if(S.game.fail!==null)return {fail:true,...FAILS[S.game.fail]};
  const mx=Math.max(...g),mn=Math.min(...g);
  if(mx-mn<=15)return ENDINGS.b;
  return ENDINGS[g.indexOf(mx)];
}

bind.game=()=>{
  const G=S.game;
  if(G.phase==='world'){
    $('#gRestart').addEventListener('click',()=>{if(!confirm('처음부터 다시 시작할까요? 지금까지의 게임 진행은 사라져요.'))return;S.runs++;save();route();toast('D+1부터 다시 시작해요')});
    $('#gReset').addEventListener('click',()=>{if(!confirm('캐릭터를 다시 꾸미면 게임이 처음부터 시작돼요. 계속할까요?'))return;G.phase='setup';save();route();window.scrollTo(0,0)});
    const gf=$('#gframe');gf.addEventListener('load',()=>{try{gf.contentWindow.focus()}catch(e){}});
    return;
  }
  if(G.phase==='setup'){
    const cc=$('#cc'), redraw=()=>{cc.innerHTML=ccHTML()};
    cc.addEventListener('input',e=>{if(e.target.id!=='nm')return;G.name=e.target.value.trim();save();$('#ccName').textContent=G.name||'김하이'});
    cc.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.tab){CC_TAB=b.dataset.tab;redraw();return}
      if(b.dataset.part!=null){G.part=+b.dataset.part;save();redraw();return}
      if(b.dataset.k){const L=myBriLook(),k=b.dataset.k;L[k]=BRI_NUM.includes(k)?+b.dataset.v:b.dataset.v;G.bri=L;save();redraw();return}
      if(b.id==='ccDice'){const r=a=>Math.floor(Math.random()*a.length),pick=k=>BRI_OPTS[k][r(BRI_OPTS[k])].v;
        G.bri={c:r(BRI_OPTS.c),cheek:r(BRI_OPTS.cheek),eyes:pick('eyes'),mouth:pick('mouth'),top:pick('top'),face:pick('face'),neck:pick('neck'),ear:pick('ear'),bg:r(BRI_OPTS.bg)};save();redraw();return}
      if(b.id==='start'){if(!G.name){G.name='김하이'}if(!G.bri)G.bri=myBriLook();Object.assign(G,{phase:'world'});S.shared=false;S.runs++;save();route();window.scrollTo(0,0)}
    });
    return;
  }
  if(G.phase==='play'){
    const id=DAYS[G.dayIdx].cards[G.pos];
    const box=$('#choices');
    const hint=i=>document.querySelectorAll('.hint').forEach(h=>{const v=i==null?0:Math.abs(CARDS[id].ch[i].d[+h.dataset.h]);const s=v>=12?12:v>=7?9:6;h.style.width=h.style.height=s+'px';h.classList.toggle('on',v>0)});
    box.querySelectorAll('.choice').forEach(b=>{b.addEventListener('mouseenter',()=>hint(+b.dataset.i));b.addEventListener('focus',()=>hint(+b.dataset.i));b.addEventListener('mouseleave',()=>hint(null))});
    box.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;const i=+b.dataset.i,d=CARDS[id].ch[i].d;
      G.g=G.g.map((v,k)=>Math.max(0,Math.min(100,v+d[k])));G.last=i;G.log.push({id,i});
      S.stats[id]=S.stats[id]||[0,0,0];S.stats[id][i]++;G.phase='feedback';save();route()});
  }
  if(G.phase==='feedback'){
    const id=DAYS[G.dayIdx].cards[G.pos];
    $('#next').addEventListener('click',()=>{
      const z=G.g.findIndex(v=>v<=0);
      if(z>-1){G.fail=z;G.phase='ending'}
      else if(G.pos<DAYS[G.dayIdx].cards.length-1){G.pos++;G.phase='play'}
      else{G.phase='retro';G.retroText='';G.retroShown=false}
      save();route();window.scrollTo(0,0)});
    $('#ask').addEventListener('click',()=>askSenior(id));
  }
  if(G.phase==='retro'){
    $('#rt').addEventListener('input',e=>{G.retroText=e.target.value;save()});
    $('#reveal')?.addEventListener('click',()=>{G.retroShown=true;save();route()});
    $('#askR')?.addEventListener('click',e=>{e.preventDefault();askSenior(DAYS[G.dayIdx].retro.card)});
    $('#nextDay')?.addEventListener('click',()=>{
      if(G.dayIdx<DAYS.length-1){G.dayIdx++;G.pos=0;G.phase='play'}else{G.phase='ending';S.done++}
      save();route();window.scrollTo(0,0)});
  }
  if(G.phase==='ending'){
    $('#again').addEventListener('click',()=>{G.phase='setup';save();route()});
    $('#share')?.addEventListener('click',()=>{const E=endingType();
      S.posts.unshift({id:'p'+Date.now(),ch:'peer',by:myName(),tag:'신입 · '+PARTS[G.part]+' · D+100',t:`100일 생존 완료! 제 유형은 '${E.t}'이에요. ${E.n||''}`,when:'방금',mine:true});
      S.shared=true;S.channel='peer';save();toast('동기방에 공유했어요');location.hash='#community'});
  }
};

bind.community=()=>{

function hrdRows(){
  return Object.keys(CARDS).map(id=>{const c=CARDS[id],st=S.stats[id]||[0,0,0],cn=c.seed.map((v,i)=>v+(st[i]||0)),t=cn.reduce((a,b)=>a+b,0);
    const eff=c.ch.map(x=>x.d.reduce((p,q)=>p+q,0));
    const neg=cn.reduce((a,v,i)=>a+(eff[i]<0?v:0),0),pos=cn.reduce((a,v,i)=>a+(eff[i]>0?v:0),0);
    const day=DAYS.find(d=>d.cards.includes(id));
    const top=cn.indexOf(Math.max(...cn));
    return{id,c,cn,t,eff,day:day?day.day:0,neg:pct(neg,t),pos:pct(pos,t),mid:100-pct(neg,t)-pct(pos,t),top}});
}
function hrd(){
  const all=hrdRows(),fd=S.hday||'all';
  const rows=fd==='all'?all:all.filter(r=>String(r.day)===String(fd));
  HRD_ROWS=rows;
  const stuck=[...all].sort((a,b)=>b.neg-a.neg).slice(0,3);
  const participants=48+S.runs,finished=31+S.done,rate=pct(finished,participants);
  const unanswered=allPosts().filter(p=>p.ch!=='peer'&&!repliesOf(p).length).length;
  const base=Object.keys(CARDS).map(id=>({id,type:CARDS[id].type,title:CARDS[id].title,src:'시니어 인터뷰 (예시)',status:'게시'}));
  const db=[...S.db,...base],waiting=db.filter(d=>d.status==='검토 대기').length;
  const types=['전체',...TYPES,'미분류'];
  const shown=S.filter==='전체'?db:db.filter(d=>d.type===S.filter);
  const maxArm=Math.max(50,...rows.map(r=>Math.max(r.neg,r.pos)));
  const days=DAYS.filter(d=>fd==='all'||String(d.day)===String(fd));
  return `
  <section class="cm-hero hd-hero">
    <div class="cm-hero-copy">
      <h1>운영 대시보드</h1>
      <p>신입들이 어디서 막히는지 찾고, 시니어 경험을 시나리오로 묶어 교육과 멘토링을 보완해요.</p>
      <div class="cm-stats"><span>${UI('chart')} 예시 데이터 + 이 브라우저의 플레이 기록</span></div>
    </div>
  </section>

  <div class="hd-filter" id="hdays" role="group" aria-label="기간">
    <span class="small muted">기간</span>
    ${[['all','전체 100일'],...DAYS.map(d=>[String(d.day),'D+'+d.day+' · '+d.label])].map(([k,n])=>`<button type="button" data-d="${k}" aria-pressed="${String(fd)===k}">${n}</button>`).join('')}
  </div>

  <section class="hd-kpis">
    <div class="hd-kpi"><span class="hd-kl">참여 신입</span><b>${participants}<small>명</small></b><span class="hd-ks">이번 기수 기준</span></div>
    <div class="hd-kpi"><span class="hd-kl">100일 완주율</span><b>${rate}<small>%</small></b><span class="hd-meter" role="img" aria-label="완주율 ${rate}%"><i style="width:${rate}%"></i></span><span class="hd-ks">${finished}명 완주</span></div>
    <div class="hd-kpi"><span class="hd-kl">검토 대기 시나리오</span><b>${waiting}<small>건</small></b><span class="hd-ks">시나리오 DB 전체 ${db.length}건</span></div>
    <a class="hd-kpi link" href="#community"><span class="hd-kl">답변 대기 질문</span><b>${unanswered}<small>건</small></b><span class="hd-ks">소통 공간에서 답하기 →</span></a>
  </section>

  <section class="hd-main">
    <div class="hd-card">
      <div class="hd-card-h"><div><h2>상황별 선택 결과</h2><p>각 상황에서 신입들이 고른 선택이 게이지를 떨어뜨렸는지, 올렸는지 비율이에요.</p></div>
        <div class="hd-legend"><span><i class="neg"></i>게이지 하락 선택</span><span><i class="pos"></i>게이지 상승 선택</span></div></div>
      <div class="hd-axis" aria-hidden="true"><span>◀ 하락</span><span>상승 ▶</span></div>
      <div class="hd-div" id="hdChart">
        ${days.map(d=>`<div class="hd-day">D+${d.day} · ${esc(d.label)}</div>${rows.filter(r=>r.day===d.day).map(r=>{const i=rows.indexOf(r);return `
          <div class="hd-row" data-i="${i}" tabindex="0" aria-label="${esc(r.c.title)}: 하락 ${r.neg}%, 상승 ${r.pos}%, 응답 ${r.t}명">
            <div class="hd-nm"><b>${esc(r.c.title)}</b><small>${esc(r.c.type)} · ${r.t}명</small></div>
            <div class="hd-arms">
              <div class="hd-arm l"><span class="hd-v">${r.neg?r.neg+'%':''}</span><i class="neg" style="width:${r.neg/maxArm*100}%"></i></div>
              <div class="hd-arm r"><i class="pos" style="width:${r.pos/maxArm*100}%"></i><span class="hd-v">${r.pos?r.pos+'%':''}</span></div>
            </div>
          </div>`}).join('')}`).join('')}
      </div>
      <details class="hd-table"><summary>표로 보기</summary>
        <div class="tbl"><table><thead><tr><th>상황</th><th>응답</th><th>A</th><th>B</th><th>C</th><th>하락</th><th>상승</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.c.title)}</td><td>${r.t}</td>${r.cn.map((v,k)=>`<td>${pct(v,r.t)}% <span class="muted">${r.eff[k]>0?'▲':r.eff[k]<0?'▼':'–'}</span></td>`).join('')}<td>${r.neg}%</td><td>${r.pos}%</td></tr>`).join('')}
        </tbody></table></div></details>
    </div>

    <div class="hd-side">
      <div class="hd-card">
        <div class="hd-card-h"><div><h2>자주 막히는 상황 TOP 3</h2><p>게이지가 떨어지는 선택이 많은 순서 · 전체 기간</p></div></div>
        <ol class="hd-stuck">${stuck.map((r,k)=>`<li><span class="hd-rank">${k+1}</span><div><b>${esc(r.c.title)}</b><small>${esc(r.c.type)} · D+${r.day}</small>
          <span class="hd-pick">가장 많이 고른 선택 · ${esc(r.c.ch[r.top].t)}</span></div><strong>${r.neg}<small>%</small></strong></li>`).join('')}</ol>
      </div>
      <div class="hd-card hd-tips">
        <h2>이렇게 활용해 보세요</h2>
        <ul><li><span>${UI('cap')}</span>막히는 상황 1위를 다음 기수 입문교육 사례로</li><li><span>${UI('bell')}</span>답변 대기 질문은 해당 파트 시니어에게 알림</li><li><span>${UI('chat')}</span>선택이 고르게 갈리는 카드는 토론형 멘토링 주제로</li></ul>
      </div>
    </div>
  </section>

  <section class="hd-card">
    <div class="hd-card-h"><div><h2>시나리오 DB</h2><p>시니어 경험과 소통 공간 질문이 모이는 곳이에요. 검토 후 게시하면 다음 기수 게임에 들어가요.</p></div>
      ${waiting?`<span class="chip amber">검토 대기 ${waiting}건</span>`:''}</div>
    <div class="filters" id="filters">${types.map(t=>`<button aria-pressed="${t===S.filter}" data-t="${t}">${t}</button>`).join('')}</div>
    <div class="tbl hd-db"><table><thead><tr><th>유형</th><th>제목</th><th>출처</th><th>상태</th><th></th></tr></thead><tbody>
    ${shown.map(d=>`<tr class="${d.status==='검토 대기'?'wait':''}"><td><span class="chip gray">${esc(d.type)}</span></td><td><b>${esc(d.title)}</b></td><td class="muted">${esc(d.src)}${d.by?' · '+esc(d.by):''}</td>
      <td><span class="chip ${d.status==='게시'?'good':d.status==='보류'?'gray':'amber'}">${d.status==='게시'?'✓ ':d.status==='검토 대기'?'⏳ ':''}${d.status}</span></td>
      <td>${d.status==='검토 대기'?`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-ok="${d.id}">게시</button><button class="btn sm ghost" data-no="${d.id}">보류</button></span>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">이 유형의 시나리오가 아직 없어요.</td></tr>'}
    </tbody></table></div>
  </section>
  <div class="hd-tip" id="hdTip" role="tooltip" hidden></div>`;
}
bind.hrd=()=>{
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.filter=b.dataset.t;save();route()});
  $('#hdays').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.hday=b.dataset.d;save();route()});
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.ok||b.dataset.no;const d=S.db.find(x=>x.id===id);if(!d)return;
    d.status=b.dataset.ok?'게시':'보류';save();toast(b.dataset.ok?'게시했어요. 다음 기수 게임에 반영돼요':'보류했어요');route()}));
  document.querySelectorAll('body > .hd-tip').forEach(x=>x.remove());
  const tip=$('#hdTip'),chart=$('#hdChart');document.body.appendChild(tip);
  const show=(row,x,y)=>{const r=HRD_ROWS[+row.dataset.i];if(!r)return;
    tip.innerHTML=`<b>${esc(r.c.title)}</b><span class="muted">${esc(r.c.type)} · 응답 ${r.t}명</span>
      ${r.c.ch.map((ch,k)=>`<div class="hd-tip-r"><span class="hd-tip-k ${r.eff[k]<0?'neg':r.eff[k]>0?'pos':'mid'}">${'ABC'[k]}</span><span class="hd-tip-t">${esc(ch.t)}</span><b>${pct(r.cn[k],r.t)}%</b></div>`).join('')}`;
    tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.min(window.innerWidth-w-12,Math.max(12,x+16))+'px';tip.style.top=Math.max(12,y-h-12)+'px';};
  chart.addEventListener('mousemove',e=>{const row=e.target.closest('.hd-row');if(row)show(row,e.clientX,e.clientY);else tip.hidden=true});
  chart.addEventListener('mouseleave',()=>{tip.hidden=true});
  chart.addEventListener('focusin',e=>{const row=e.target.closest('.hd-row');if(row){const rc=row.getBoundingClientRect();show(row,rc.left+rc.width/2,rc.top)}});
  chart.addEventListener('focusout',()=>{tip.hidden=true});
};

route();
</script>

</body>
</html>
