<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="㈜하이브릿지(가상 기업) 인사팀 신입을 위한 상황 선택형 온보딩 웹 앱">
<link rel="icon" href="assets/symbol.png">
<title>신입 100일 생존기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: white app shell — sticky brand header, tab rail, one working view at a time; the game view centres a single situation card. */
:root{
  color-scheme: light;
  --blue:#004aad; --blue-deep:#00307a; --blue-soft:#eef3fc; --blue-line:#cfdcf3;
  --ink:#1c2333; --ink-2:#4a5468; --ink-3:#7c8597;
  --line:#e3e8f0; --bg:#ffffff; --bg-soft:#f6f8fc;
  --amber:#ffb400; --amber-soft:#fff6de;
  --good:#17804f; --good-soft:#e7f5ee; --warn:#c2410c; --warn-soft:#fdeee6;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand img{height:28px;width:auto;display:block}
.brand .svc{border-left:1px solid var(--line);padding-left:12px;font-weight:700;color:var(--blue);font-size:15px;white-space:nowrap}
.roles{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--ink-2);padding:10px 14px;border-bottom:2px solid transparent;font-weight:500;font-size:14px;white-space:nowrap}
.tabs a small{font-size:11px;color:var(--ink-3);margin-left:4px;font-weight:400}
.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}

main{padding-block:28px 64px}
.view{display:grid;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--blue);font-weight:700;text-transform:uppercase}
.h1{font-family:var(--sans);font-size:clamp(30px,4.6vw,46px);line-height:1.25;color:var(--blue);font-weight:800;letter-spacing:-.02em}
.h2{font-family:var(--sans);font-size:22px;color:var(--ink);font-weight:700}
.lead{color:var(--ink-2);font-size:16px;max-width:36em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none}
.btn:hover{background:var(--blue-deep)}
.btn.ghost{background:var(--bg);color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:500;white-space:nowrap}
.chip.gray{background:var(--bg-soft);color:var(--ink-2);border:1px solid var(--line)}
.chip.amber{background:var(--amber-soft);color:#8a5a00}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:22px}
.soft{background:var(--bg-soft);border-color:transparent}
.sample{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sample::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.grid4{grid-template-columns:minmax(0,1fr)}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:12px 8px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .copy{display:grid;gap:18px}
.role-card{display:grid;gap:10px;align-content:start}
.role-card h3{font-size:17px}
.role-card ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.cycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cycle > div{padding:18px;display:grid;gap:6px;border-right:1px solid var(--line);position:relative}
.cycle > div:last-child{border-right:0}
.cycle b.l{font-family:var(--sans);font-size:26px;color:var(--blue);line-height:1}
.cycle .k{font-weight:700}
.cycle .f{font-size:13px;color:var(--ink-2)}
@media (max-width:760px){.cycle{grid-template-columns:repeat(2,minmax(0,1fr))}.cycle>div:nth-child(2){border-right:0}.cycle>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.company{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.company img{width:150px;height:auto}
@media (max-width:560px){.company{grid-template-columns:minmax(0,1fr)}.company img{width:120px}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:0}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:0;font-weight:500}
@media (max-width:480px){.facts{grid-template-columns:minmax(0,1fr)}}

/* situation card */
.sc{border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:0 10px 30px -18px rgba(0,48,122,.35);overflow:hidden}
.sc-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:#eeecf0;overflow:hidden}
.av.ic{background:var(--blue-soft);color:var(--blue)}
.av.ic svg{width:56%;height:56%}
.av.br{background:var(--blue-soft)}
.av.br svg{display:block}
.av.sm{width:34px;height:34px}
.av.xs{width:26px;height:26px}
.sc-head .who{min-width:0}
.sc-head .who b{display:block;font-size:15px}
.sc-head .who span{font-size:12px;color:var(--ink-3)}
.sc-head .chip{margin-left:auto}
.sc-body{padding:22px 20px;display:grid;gap:16px}
.sc-title{font-family:var(--sans);font-size:21px;color:var(--blue)}
.sc-text{font-size:17px;line-height:1.75}
.ctx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.ctx div{background:var(--bg-soft);border-radius:8px;padding:8px 10px;min-width:0}
.ctx dt{color:var(--ink-3)}
.ctx dd{margin:0;color:var(--ink);font-weight:500}
@media (max-width:520px){.ctx{grid-template-columns:minmax(0,1fr)}}

/* game */
.game{max-width:640px;margin:0 auto;width:100%;display:grid;gap:18px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g{display:grid;gap:5px;position:relative}
.g .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.g .bar{height:8px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line);overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}
.g.low .bar i{background:var(--warn)}
.g.low .lab b{color:var(--warn)}
.g .hint{position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-radius:50%;background:var(--amber);opacity:0;transition:opacity .15s}
.g .hint.on{opacity:1}
@media (max-width:480px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dayline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayline .d{font-family:var(--sans);font-size:28px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.progress{display:flex;gap:4px;margin-left:auto}
.progress i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--blue)}
.progress i.now{background:var(--amber)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--blue-line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.55;transition:background .15s,border-color .15s}
.choice:hover,.choice:focus-visible{background:var(--blue-soft);border-color:var(--blue)}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.deltas{display:flex;gap:6px;flex-wrap:wrap}
.fb{display:grid;gap:14px}
.mine{border-left:3px solid var(--blue);padding:4px 0 4px 14px;display:grid;gap:6px}
.senior{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border-radius:12px;background:var(--bg-soft)}
.senior .av{width:46px;height:46px}
.senior .nm{font-weight:700;font-size:14px}
.senior .nm span{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.senior q{display:block;quotes:none;margin:4px 0 6px}
.senior .why{font-size:13px;color:var(--blue)}
.dist{display:grid;gap:6px}
.dist .r{display:grid;grid-template-columns:22px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.dist .track{height:10px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.dist .track i{display:block;height:100%;background:var(--blue-line)}
.dist .r.me .track i{background:var(--blue)}
.dist .r.me b{color:var(--blue)}
.avatars{display:flex;gap:10px;flex-wrap:wrap}
.avatars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:520px){.avatars{grid-template-columns:repeat(3,minmax(0,1fr))}}
.avatars button{border:2px solid var(--line);border-radius:14px;padding:8px 4px 6px;background:var(--bg);display:grid;justify-items:center;gap:2px}
.avatars button small{font-size:12px;color:var(--ink-2)}
.avatars button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.avatars button[aria-pressed="true"] small{color:var(--blue);font-weight:700}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:15px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;font-size:14px}
.parts button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.story{display:grid;gap:10px;margin:0}
.story div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;font-size:14px}
.story dt{color:var(--blue);font-weight:700}
.story dd{margin:0}
@media (max-width:520px){.story div{grid-template-columns:minmax(0,1fr);gap:2px}}
.ending{background:var(--blue);color:#fff;border-radius:20px;padding:28px;display:grid;gap:16px}
.ending img{height:24px;width:auto}
.ending .type{font-family:var(--sans);font-size:30px;font-weight:700;line-height:1.3}
.ending p{color:#dbe6f8}
.ending .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ending .stats div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px;font-size:12px;color:#dbe6f8}
.ending .stats b{display:block;font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
@media (max-width:480px){.ending .stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ending.fail{background:var(--ink)}

/* community */
.comm{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.comm{grid-template-columns:minmax(0,1fr)}}
.chans{display:grid;gap:4px}
@media (max-width:760px){.chans{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}}
.chans button{text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;display:grid;gap:1px}
.chans button b{font-size:14px}
.chans button span{font-size:12px;color:var(--ink-3)}
.chans button[aria-pressed="true"]{background:var(--blue-soft)}
.chans button[aria-pressed="true"] b{color:var(--blue)}
.posts{display:grid;gap:14px}
.post{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.post .meta b{font-size:14px}
.post .ref{font-size:13px;background:var(--bg-soft);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.replies{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.reply{font-size:14px;display:grid;gap:2px}
.reply .meta{font-size:12px}
.reply-form{display:flex;gap:8px}
.reply-form input{flex:1;min-width:0;padding:8px 10px;font-size:14px}
.composer{display:grid;gap:10px}

/* register */
.reg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:start}
@media (max-width:860px){.reg{grid-template-columns:minmax(0,1fr)}}
.reg form{display:grid;gap:16px}
.qnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;margin-right:6px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);display:grid;gap:14px}
.map{display:grid;gap:8px;font-size:13px}
.map div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.map span{background:var(--bg-soft);border-radius:8px;padding:6px 10px}
.map i{color:var(--blue);font-style:normal}
.badges{display:flex;gap:8px;flex-wrap:wrap}

/* hrd */
.kpi{display:grid;gap:2px;padding:16px;border:1px solid var(--line);border-radius:12px}
.kpi b{font-size:28px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
.kpi span{font-size:13px;color:var(--ink-2)}
.kpi small{font-size:12px;color:var(--ink-3)}
.distlist{display:grid;gap:14px}
.distlist .it{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:center}
.distlist .nm{font-size:14px;font-weight:500;min-width:0}
.distlist .nm span{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11px;font-variant-numeric:tabular-nums}
.stack i{display:grid;place-items:center;font-style:normal;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack i:nth-child(1){background:#7fa2dc}
.stack i:nth-child(2){background:var(--blue)}
.stack i:nth-child(3){background:#b9c9e6;color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (max-width:600px){.distlist .it{grid-template-columns:minmax(0,1fr);gap:6px}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink-3);font-weight:500;background:var(--bg-soft)}
tr:last-child td{border-bottom:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.stuck{display:grid;gap:10px;counter-reset:s}
.stuck div{display:flex;gap:12px;align-items:center;font-size:14px}
.stuck div::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-size:12px;font-weight:700}
.stuck b{margin-left:auto;color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}

/* character + people */
.greet{display:flex;align-items:flex-end;gap:12px}
.greet svg{flex:none}
.bubble{position:relative;background:var(--blue-soft);color:var(--ink);border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:14px;margin-bottom:28px;min-width:0}
.hero-side{display:grid;gap:4px}
.people{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.people figure{margin:0;display:grid;gap:8px}
.people img{width:100%;max-width:100%;aspect-ratio:1;border-radius:16px;background:#eeecf0;object-fit:cover}
.people figcaption{display:grid;font-size:13px;color:var(--ink-3);line-height:1.4}
.people figcaption b{font-size:15px;color:var(--ink)}
@media (max-width:760px){.people{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mascot-panel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.mascot-panel{grid-template-columns:minmax(0,1fr);justify-items:start}}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.minis .av{width:38px;height:38px}
.end-hero{display:flex;gap:18px;align-items:center}
.end-bri{flex:none;background:#fff;border-radius:50%;width:112px;height:112px;display:grid;place-items:center}
@media (max-width:420px){.end-hero{flex-direction:column;align-items:flex-start}}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--ink-3)}
footer .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
footer img{height:18px;width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top">

function route(){

  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+name?'page':'false'));

function gaugeHTML(){
  const G=S.game;
  return `<div class="gauges" id="gauges">${GAUGES.map((n,i)=>`<div class="g ${G.g[i]<=25?'low':''}"><span class="hint" data-h="${i}"></span><div class="lab"><span>${n}</span><b>${G.g[i]}</b></div><div class="bar"><i style="width:${G.g[i]}%"></i></div></div>`).join('')}</div>`;
}
function dayHead(){
  const G=S.game,D=DAYS[G.dayIdx];
  const total=DAYS.reduce((a,d)=>a+d.cards.length,0);
  const doneN=DAYS.slice(0,G.dayIdx).reduce((a,d)=>a+d.cards.length,0)+G.pos+(G.phase==='feedback'?1:0)+(G.phase==='retro'?0:0);
  let k=0;const bars=[];
  DAYS.forEach((d,di)=>d.cards.forEach((c,ci)=>{const idx=k++;bars.push(`<i class="${idx<doneN?'done':(di===G.dayIdx&&ci===G.pos&&G.phase==='play')?'now':''}"></i>`)}));
  return `<div class="dayline"><span class="d">D+${D.day}</span><span class="muted">${esc(D.label)}</span><div class="progress" aria-label="진행 ${doneN}/${total}">${bars.join('')}</div></div>`;
}

          <div class="dist">${counts.map((v,i)=>`<div class="r ${i===L?'me':''}"><b>${'ABC'[i]}</b><div class="track"><i style="width:${pct(v,tot)}%"></i></div><span>${pct(v,tot)}%</span></div>`).join('')}</div></div>

function endingType(){
  const g=S.game.g;
  if(S.game.fail!==null)return {fail:true,...FAILS[S.game.fail]};
  const mx=Math.max(...g),mn=Math.min(...g);
  if(mx-mn<=15)return ENDINGS.b;
  return ENDINGS[g.indexOf(mx)];
}
function endingHTML(){
  const G=S.game,E=endingType();
  const same=G.log.filter(l=>{const c=CARDS[l.id];const m=c.seed.indexOf(Math.max(...c.seed));return m===l.i}).length;
  const day=E.fail?DAYS[G.dayIdx].day:100;
  return `<div class="game">
    <section class="ending ${E.fail?'fail':''}">
      <div class="row" style="justify-content:space-between"><img src="assets/logo-white.png" alt="HiBridge"><span class="chip amber">${E.fail?`D+${day}에서 멈춤`:'D+100 생존'}</span></div>
      <div class="end-hero"><span class="end-bri">${bri({...BRI_VARIANTS[G.avatar],size:84,wave:!E.fail})}</span><div><p style="color:#c9d6ee;font-size:13px">${esc(myName())} 님의 100일 유형</p><div class="type">${esc(E.t)}</div></div></div>
      <p>${esc(E.d)}</p>
      <div class="stats">${GAUGES.map((n,i)=>`<div>${n}<b>${G.g[i]}</b></div>`).join('')}</div>

    </section>

      ${E.fail?'':`<button class="btn" id="share" ${S.shared?'disabled':''}>${S.shared?'동기 피드에 공유됨':'사내 동기 피드에 공유'}</button>`}

    </section></div>`;

bind.game=()=>{
  const G=S.game;
  if(G.phase==='setup'){
    $('#nm').addEventListener('input',e=>{G.name=e.target.value.trim();save()});
    $('#avs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;G.avatar=+b.dataset.i;save();route()});
    $('#parts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;G.part=+b.dataset.i;save();route()});
    $('#start').addEventListener('click',()=>{if(!G.name){G.name='김하이'}Object.assign(G,{phase:'play',dayIdx:0,pos:0,g:[50,50,50,50],log:[],last:null,retroText:'',retroShown:false,fail:null});S.shared=false;S.runs++;save();route();window.scrollTo(0,0)});
    return;
  }
  if(G.phase==='play'){
    const id=DAYS[G.dayIdx].cards[G.pos];
    const box=$('#choices');
    const hint=i=>document.querySelectorAll('.hint').forEach(h=>{const v=i==null?0:Math.abs(CARDS[id].ch[i].d[+h.dataset.h]);const s=v>=12?12:v>=7?9:6;h.style.width=h.style.height=s+'px';h.classList.toggle('on',v>0)});
    box.querySelectorAll('.choice').forEach(b=>{b.addEventListener('mouseenter',()=>hint(+b.dataset.i));b.addEventListener('focus',()=>hint(+b.dataset.i));b.addEventListener('mouseleave',()=>hint(null))});
    box.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;const i=+b.dataset.i,d=CARDS[id].ch[i].d;
      G.g=G.g.map((v,k)=>Math.max(0,Math.min(100,v+d[k])));G.last=i;G.log.push({id,i});
      S.stats[id]=S.stats[id]||[0,0,0];S.stats[id][i]++;G.phase='feedback';save();route()});
  }
  if(G.phase==='feedback'){
    const id=DAYS[G.dayIdx].cards[G.pos];
    $('#next').addEventListener('click',()=>{
      const z=G.g.findIndex(v=>v<=0);
      if(z>-1){G.fail=z;G.phase='ending'}
      else if(G.pos<DAYS[G.dayIdx].cards.length-1){G.pos++;G.phase='play'}
      else{G.phase='retro';G.retroText='';G.retroShown=false}
      save();route();window.scrollTo(0,0)});
    $('#ask').addEventListener('click',()=>askSenior(id));
  }
  if(G.phase==='retro'){
    $('#rt').addEventListener('input',e=>{G.retroText=e.target.value;save()});
    $('#reveal')?.addEventListener('click',()=>{G.retroShown=true;save();route()});
    $('#askR')?.addEventListener('click',e=>{e.preventDefault();askSenior(DAYS[G.dayIdx].retro.card)});
    $('#nextDay')?.addEventListener('click',()=>{
      if(G.dayIdx<DAYS.length-1){G.dayIdx++;G.pos=0;G.phase='play'}else{G.phase='ending';S.done++}
      save();route();window.scrollTo(0,0)});
  }
  if(G.phase==='ending'){
    $('#again').addEventListener('click',()=>{G.phase='setup';save();route()});
    $('#share')?.addEventListener('click',()=>{const E=endingType();
      S.posts.unshift({id:'p'+Date.now(),ch:'peer',by:myName(),tag:'신입 · '+PARTS[G.part]+' · D+100',t:`100일 생존 완료! 제 유형은 '${E.t}'이에요. ${E.n||''}`,when:'방금',mine:true});
      S.shared=true;S.channel='peer';save();toast('동기방에 공유했어요');location.hash='#community'});
  }
};
function askSenior(id){
  const c=CARDS[id],D=DAYS.find(d=>d.cards.includes(id));
  S.channel='ask';S.draft={ref:`D+${D.day} · ${c.title}`,t:`'${c.title}' 상황에서 선배님들은 실제로 어떻게 하셨나요? `};save();
  location.hash='#community';
}

  f.addEventListener('input',e=>{const k=map[e.target.id];if(k){REG[k]=e.target.value;pv()}});
  $('#r-sample').addEventListener('click',()=>{REG={who:'한지훈',year:'10년차 이상',part:'노무·조직문화',rel:'현업 팀장',when:'입사 3개월 차',before:'사수 선배 외근 중',
    q1:'현업 팀장님이 찾아와 "저 직원 좀 내보내 달라"고 하셨어요.',q2:'"알아보겠습니다"라고만 하고, 아무것도 기록하지 않았어요.',q3:'인사팀이 뭐든 해결해 줘야 한다고 생각했어요. 사실관계가 없으면 할 수 있는 게 없다는 걸 몰랐어요.',q4:'들으면서 바로 적으세요. 언제, 무엇을, 몇 번.'};route()});
  f.addEventListener('submit',e=>{e.preventDefault();
    if(!REG.q1.trim()||!REG.q2.trim()||!REG.q3.trim()){toast('1~3번 질문은 꼭 답해 주세요');return}
    S.db.unshift({id:'d'+Date.now(),type:REG.part,title:REG.q1.slice(0,40)+(REG.q1.length>40?'…':''),src:'시니어 등록',by:REG.who||'익명',status:'검토 대기',full:{...REG}});
    REG={...REG_DEFAULT};save();toast('등록했어요. HRD 검토 후 상황 카드로 게시돼요');route();window.scrollTo(0,0)});
};

/* ---------- hrd ---------- */
function hrd(){
  const ids=Object.keys(CARDS);
  const rows=ids.map(id=>{const c=CARDS[id],st=S.stats[id]||[0,0,0],cn=c.seed.map((v,i)=>v+(st[i]||0)),t=cn.reduce((a,b)=>a+b,0);
    const neg=cn.reduce((a,v,i)=>a+(c.ch[i].d.reduce((x,y)=>x+y,0)<0?v:0),0);return{id,c,cn,t,neg:pct(neg,t)}});
  const stuck=[...rows].sort((a,b)=>b.neg-a.neg).slice(0,3);
  const participants=48+S.runs,finished=31+S.done;
  const unanswered=allPosts().filter(p=>p.ch!=='peer'&&!repliesOf(p).length).length;
  const base=ids.map(id=>({id,type:CARDS[id].type,title:CARDS[id].title,src:'시니어 인터뷰 (예시)',status:'게시'}));
  const db=[...S.db,...base];
  const types=['전체',...TYPES,'미분류'];
  const shown=S.filter==='전체'?db:db.filter(d=>d.type===S.filter);
  return `
  <div><div class="eyebrow">SECI 연결화 · HRD 담당자</div><h1 class="h1" style="font-size:32px;margin-top:6px">운영 대시보드</h1>
  <p class="lead" style="margin-top:6px">신입들의 선택에서 자주 막히는 상황을 찾고, 시니어 경험을 시나리오로 묶어 교육과 멘토링을 보완해요.</p>
  <p class="sample" style="margin-top:8px">예시 데이터에 이 브라우저에서 플레이한 기록이 더해져 표시돼요.</p></div>
  <section class="grid4">
    <div class="kpi"><span>참여 신입</span><b>${participants}명</b><small>이번 기수 기준</small></div>
    <div class="kpi"><span>100일 완주율</span><b>${pct(finished,participants)}%</b><small>${finished}명 완주</small></div>
    <div class="kpi"><span>시나리오 DB</span><b>${db.length}건</b><small>검토 대기 ${db.filter(d=>d.status==='검토 대기').length}건</small></div>
    <div class="kpi"><span>답변 대기 질문</span><b>${unanswered}건</b><small>소통 공간 · 동기방 제외</small></div>
  </section>
  <section class="grid2" style="align-items:start">
    <div class="panel" style="display:grid;gap:14px">
      <div class="row" style="justify-content:space-between"><h2 class="h2" style="font-size:18px">상황별 선택 분포</h2>
      <div class="legend"><span><i style="background:#7fa2dc"></i>A</span><span><i style="background:var(--blue)"></i>B</span><span><i style="background:#b9c9e6"></i>C</span></div></div>
      <div class="distlist">${rows.map(r=>`<div class="it"><div class="nm">${esc(r.c.title)}<span>${esc(r.c.type)} · ${r.t}명</span></div><div class="stack" role="img" aria-label="A ${pct(r.cn[0],r.t)}%, B ${pct(r.cn[1],r.t)}%, C ${pct(r.cn[2],r.t)}%">${r.cn.map(v=>`<i style="width:${pct(v,r.t)}%">${pct(v,r.t)>=12?pct(v,r.t)+'%':''}</i>`).join('')}</div></div>`).join('')}</div>
    </div>
    <div style="display:grid;gap:20px">
      <div class="panel" style="display:grid;gap:12px"><h2 class="h2" style="font-size:18px">자주 막히는 상황</h2>
        <p class="small muted">게이지가 떨어지는 선택을 한 신입 비율이 높은 순서예요. 입문교육이나 멘토링 주제로 쓰기 좋아요.</p>
        <div class="stuck">${stuck.map(r=>`<div><span>${esc(r.c.title)} <span class="muted small">${esc(r.c.type)}</span></span><b>${r.neg}% 하락</b></div>`).join('')}</div></div>
      <div class="panel soft" style="display:grid;gap:8px"><h2 class="h2" style="font-size:18px">활용 제안</h2>
        <ul style="margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)"><li>막히는 상황 1위를 다음 기수 입문교육 사례로</li><li>답변 대기 질문은 해당 파트 시니어에게 알림</li><li>선택이 고르게 갈리는 카드는 토론형 멘토링 주제로</li></ul></div>
    </div>
  </section>
  <section style="display:grid;gap:12px">
    <div class="row" style="justify-content:space-between"><h2 class="h2" style="font-size:18px">시나리오 DB</h2>
    <div class="filters" id="filters">${types.map(t=>`<button aria-pressed="${t===S.filter}" data-t="${t}">${t}</button>`).join('')}</div></div>
    <div class="tbl"><table><thead><tr><th>유형</th><th>제목</th><th>출처</th><th>상태</th><th></th></tr></thead><tbody>
    ${shown.map(d=>`<tr><td><span class="chip gray">${esc(d.type)}</span></td><td>${esc(d.title)}</td><td class="muted">${esc(d.src)}${d.by?' · '+esc(d.by):''}</td>
      <td><span class="chip ${d.status==='게시'?'good':d.status==='보류'?'gray':'amber'}">${d.status}</span></td>
      <td>${d.status==='검토 대기'?`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-ok="${d.id}">게시</button><button class="btn sm ghost" data-no="${d.id}">보류</button></span>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">이 유형의 시나리오가 아직 없어요.</td></tr>'}
    </tbody></table></div>
  </section>`;
}
bind.hrd=()=>{
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.filter=b.dataset.t;save();route()});
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.ok||b.dataset.no;const d=S.db.find(x=>x.id===id);if(!d)return;
    d.status=b.dataset.ok?'게시':'보류';save();toast(b.dataset.ok?'게시했어요. 다음 기수 게임에 반영돼요':'보류했어요');route()}));
};

route();
</script>

</body>
</html>
