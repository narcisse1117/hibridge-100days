<head>

<style>
/* Layout: white app shell — sticky brand header, tab rail, one working view at a time; the game view centres a single situation card. */
:root{
  color-scheme: light;
  --blue:#004aad; --blue-deep:#00307a; --blue-soft:#eef3fc; --blue-line:#cfdcf3;
  --ink:#1c2333; --ink-2:#4a5468; --ink-3:#7c8597;
  --line:#e3e8f0; --bg:#ffffff; --bg-soft:#f6f8fc; --bg-app:#f5f7fb;
  --amber:#ffb400; --amber-soft:#fff6de;
  --good:#17804f; --good-soft:#e7f5ee; --warn:#c2410c; --warn-soft:#fdeee6;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg-app)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header — 사내 서비스형 상단 바: 로고 · 메뉴 · 계정 메뉴 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(10px);-webkit-backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.top-row{display:flex;align-items:center;gap:8px 56px;height:76px}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;min-width:0;flex:none}
.brand img{height:32px;width:auto;display:block}
.brand .svc{border-left:1px solid var(--line);padding-left:16px;font-weight:700;color:var(--ink);font-size:16.5px;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-right:auto;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:flex;align-items:center;text-decoration:none;color:var(--ink-2);padding:10px 18px;border-radius:10px;font-weight:600;font-size:15.5px;white-space:nowrap;transition:background .12s,color .12s}
.tabs a:hover{background:var(--bg-soft);color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
.tabs a small{font-size:11px;color:var(--ink-3);margin-left:4px;font-weight:400}
@media (max-width:1100px){.top-row{gap:8px 32px}.tabs{gap:4px}.tabs a{padding:9px 14px}}
@media (max-width:900px){
  .top-row{height:auto;flex-wrap:wrap;padding-top:12px;gap:0 12px}
  .tabs{order:3;flex-basis:100%;margin:8px -8px 0;padding:0 0 10px}
  .tabs a{padding:8px 12px;font-size:14.5px}
}
@media (max-width:560px){.brand{gap:8px}.brand img{height:24px}.brand .svc{font-size:13.5px;padding-left:8px}}

main{padding-block:36px 72px}
.view{display:grid;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--blue);font-weight:700;text-transform:uppercase}
.h1{font-family:var(--sans);font-size:clamp(30px,4.6vw,46px);line-height:1.25;color:var(--blue);font-weight:800;letter-spacing:-.02em}
.h2{font-family:var(--sans);font-size:22px;color:var(--ink);font-weight:700}
.lead{color:var(--ink-2);font-size:16px;max-width:36em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none}
.btn:hover{background:var(--blue-deep)}
.btn.ghost{background:var(--bg);color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:500;white-space:nowrap}
.chip.gray{background:var(--bg-soft);color:var(--ink-2);border:1px solid var(--line)}
.chip.amber{background:var(--amber-soft);color:#8a5a00}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:22px}
.soft{background:var(--bg-soft);border-color:transparent}
.sample{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sample::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.grid4{grid-template-columns:minmax(0,1fr)}}

/* home */
/* hero: game title screen */
.hx{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#00245c 0%,#004aad 58%,#2f6fd6 100%);color:#fff;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
@media (max-width:820px){.hx{grid-template-columns:minmax(0,1fr)}}
.hx .big{position:absolute;right:-.06em;bottom:-.28em;font-size:clamp(180px,30vw,360px);font-weight:800;line-height:1;color:rgba(255,255,255,.06);letter-spacing:-.06em;pointer-events:none;user-select:none}
.hx-copy{position:relative;display:grid;gap:20px}
.hx h1{font-size:clamp(38px,6.4vw,66px);line-height:1.1;font-weight:800;letter-spacing:-.035em}
.hx h1 em{font-style:normal;color:var(--amber)}
.hx-copy > p{color:#d6e2f7;font-size:17px;max-width:30em}
.btn.start{background:var(--amber);border-color:var(--amber);color:var(--ink);padding:15px 28px;font-size:17px;border-radius:14px;box-shadow:0 12px 28px -12px rgba(255,180,0,.9)}
.btn.start:hover{background:#ffc533}
.hx-stage{position:relative;display:grid;justify-items:center}
.hx-stage::before{display:none;content:"";position:absolute;top:50%;left:50%;width:250px;height:250px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0 52%,rgba(255,255,255,.25) 53%,rgba(255,255,255,0) 70%)}
.hx-me{position:relative;z-index:1;width:min(100%,240px);aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:6px solid rgba(255,255,255,.92);box-shadow:0 24px 50px -20px rgba(0,10,40,.7);animation:float 3.6s ease-in-out infinite}
.hx-me svg{display:block;margin-top:10px}
.hx-guide{position:absolute;z-index:2;left:calc(50% - 170px);bottom:-10px;width:96px;height:96px;display:grid;place-items:center;background:#fff;border-radius:50%;box-shadow:0 14px 30px -14px rgba(0,10,40,.6);animation:float 3s ease-in-out infinite reverse}
@media (max-width:420px){.hx-guide{left:0}}
@keyframes float{50%{transform:translateY(-8px)}}

/* feature cards */
.feats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.feats{grid-template-columns:minmax(0,1fr)}}
.feat{display:flex;flex-direction:column;gap:8px;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--bg);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
.feat:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(0,48,122,.5);border-color:var(--blue-line)}
.feat.hot{background:var(--blue);border-color:var(--blue);color:#fff}
.feat .fi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);margin-bottom:6px;overflow:hidden}
.feat .fi svg{width:24px;height:24px}
.feat .fi.br svg,.feat .fi.pt svg{width:100%;height:100%;display:block}
.feat.hot .fi{background:#fff}
.feat .who{font-size:12px;font-weight:700;color:var(--blue)}
.feat.hot .who{color:var(--amber)}
.feat h3{font-size:19px;letter-spacing:-.015em}
.feat p{font-size:14px;color:var(--ink-2)}
.feat.hot p{color:#d6e2f7}
.feat .go{margin-top:auto;padding-top:8px;font-weight:700;font-size:14px;color:var(--blue)}
.feat.hot .go{color:#fff}
.feat .go::after{content:"→";display:inline-block;margin-left:6px;transition:transform .2s}
.feat:hover .go::after{transform:translateX(4px)}
.cycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cycle > div{padding:18px;display:grid;gap:6px;border-right:1px solid var(--line);position:relative}
.cycle > div:last-child{border-right:0}
.cycle b.l{font-family:var(--sans);font-size:26px;color:var(--blue);line-height:1}
.cycle .k{font-weight:700}
.cycle .f{font-size:13px;color:var(--ink-2)}
@media (max-width:760px){.cycle{grid-template-columns:repeat(2,minmax(0,1fr))}.cycle>div:nth-child(2){border-right:0}.cycle>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.company{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.company img{width:150px;height:auto}
@media (max-width:560px){.company{grid-template-columns:minmax(0,1fr)}.company img{width:120px}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:0}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:0;font-weight:500}
@media (max-width:480px){.facts{grid-template-columns:minmax(0,1fr)}}

/* situation card */
.sc{border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:0 10px 30px -18px rgba(0,48,122,.35);overflow:hidden}
.sc-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:#eeecf0;overflow:hidden}
.av.ic{background:var(--blue-soft);color:var(--blue)}
.av.ic svg{width:56%;height:56%}
.av.br{background:var(--blue-soft)}
.av.br svg{display:block}
.av.sm{width:34px;height:34px}
.av.xs{width:26px;height:26px}
.sc-head .who{min-width:0}
.sc-head .who b{display:block;font-size:15px}
.sc-head .who span{font-size:12px;color:var(--ink-3)}
.sc-head .chip{margin-left:auto}
.sc-body{padding:22px 20px;display:grid;gap:16px}
.sc-title{font-family:var(--sans);font-size:21px;color:var(--blue)}
.sc-text{font-size:17px;line-height:1.75}
.ctx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.ctx div{background:var(--bg-soft);border-radius:8px;padding:8px 10px;min-width:0}
.ctx dt{color:var(--ink-3)}
.ctx dd{margin:0;color:var(--ink);font-weight:500}
@media (max-width:520px){.ctx{grid-template-columns:minmax(0,1fr)}}

/* game */
.game{max-width:640px;margin:0 auto;width:100%;display:grid;gap:18px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g{display:grid;gap:5px;position:relative}
.g .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.g .bar{height:8px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line);overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}
.g.low .bar i{background:var(--warn)}
.g.low .lab b{color:var(--warn)}
.g .hint{position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-radius:50%;background:var(--amber);opacity:0;transition:opacity .15s}
.g .hint.on{opacity:1}
@media (max-width:480px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dayline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayline .d{font-family:var(--sans);font-size:28px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.progress{display:flex;gap:4px;margin-left:auto}
.progress i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--blue)}
.progress i.now{background:var(--amber)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--blue-line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.55;transition:background .15s,border-color .15s}
.choice:hover,.choice:focus-visible{background:var(--blue-soft);border-color:var(--blue)}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.deltas{display:flex;gap:6px;flex-wrap:wrap}
.fb{display:grid;gap:14px}
.mine{border-left:3px solid var(--blue);padding:4px 0 4px 14px;display:grid;gap:6px}
.senior{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border-radius:12px;background:var(--bg-soft)}
.senior .av{width:46px;height:46px}
.senior .nm{font-weight:700;font-size:14px}
.senior .nm span{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.senior q{display:block;quotes:none;margin:4px 0 6px}
.senior .why{font-size:13px;color:var(--blue)}
.dist{display:grid;gap:6px}
.dist .r{display:grid;grid-template-columns:22px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.dist .track{height:10px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.dist .track i{display:block;height:100%;background:var(--blue-line)}
.dist .r.me .track i{background:var(--blue)}
.dist .r.me b{color:var(--blue)}
/* embedded office game */
.game.wide.world{max-width:1040px}
.gframe-wrap{display:grid;gap:10px;max-width:1040px;margin:0 auto;width:100%}
.gframe-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gframe{display:block;width:100%;aspect-ratio:16/9;min-height:480px;border:0;border-radius:16px;background:#1b2033;box-shadow:0 24px 50px -30px rgba(0,30,80,.6)}
@media (max-width:640px){.gframe{aspect-ratio:auto;height:78vh;min-height:0}}
/* character creator */
.game.wide{max-width:1000px}
.cc{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);border-radius:24px;overflow:hidden;background:#0d1a38;color:#fff;box-shadow:0 30px 60px -34px rgba(0,30,80,.7)}
@media (max-width:780px){.cc{grid-template-columns:minmax(0,1fr)}}
.cc-stage{position:relative;display:grid;place-items:center;align-content:center;gap:10px;padding:56px 24px 28px;background:radial-gradient(ellipse 60% 55% at 50% 40%,#f3f7ff 0%,#c4d6f7 38%,#3a62b4 72%,#0d1f4d 100%);min-height:440px;overflow:hidden}
.cc-stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px);mask-image:linear-gradient(to bottom,transparent,#000 60%)}
.cc-stage::after{content:"";position:absolute;left:50%;bottom:96px;width:62%;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(11,26,58,.28),rgba(11,26,58,0));pointer-events:none}
.cc-label{position:absolute;top:18px;left:20px;font-size:11px;letter-spacing:.24em;font-weight:800;color:rgba(255,255,255,.7)}
.cc-dice{position:absolute;top:12px;right:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;z-index:2}
.cc-dice:hover{background:rgba(255,255,255,.16)}
.cc-fig{position:relative;z-index:1;display:grid;place-items:center;animation:enter .35s ease both}
.cc-fig svg{display:block;max-width:100%;height:auto}
.cc-plate{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;background:rgba(5,14,36,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:10px 22px;margin-top:4px}
.cc-plate{grid-auto-flow:column;align-items:center;gap:12px!important;justify-items:start!important;transition:box-shadow .2s}
.cc-plate.hl{box-shadow:0 0 0 2px var(--amber)}
.cc-pf{width:52px;height:52px;border-radius:50%;overflow:hidden;display:block;border:2px solid #fff;flex:none;transition:background .2s}
.cc-pf svg{display:block}
.cc-pt{display:grid;gap:2px}
.cc-plate b{font-size:20px;letter-spacing:-.01em}
.cc-plate span{font-size:12px;color:#b9c8e6}
.cc-panel{padding:24px;display:grid;gap:18px;align-content:start;background:#0f1d3d}
.cc-title{font-size:22px;margin-top:4px;letter-spacing:-.02em}
.cc-tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px}
.cc-tabs button{flex:1;border:0;background:none;color:#a9b8d8;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px}
.cc-tabs button[aria-pressed="true"]{background:#fff;color:#0d1a38}
.cc-body{display:grid;gap:16px;min-height:236px;align-content:start}
.cc-sec{display:grid;gap:10px}
.cc-sec h4{margin:0;font-size:12px;color:#a9b8d8;letter-spacing:.04em;font-weight:700}
.cc-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.cc-opts button{border:2px solid transparent;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 4px 7px;display:grid;gap:5px;justify-items:center;color:#cfdbf3;font-size:12px;transition:background .15s,border-color .15s}
.cc-opts button:hover{background:rgba(255,255,255,.11)}
.cc-opts .th{width:54px;height:54px;border-radius:50%;overflow:hidden;display:block;padding:4px}
.cc-opts .th svg{display:block}
.cc-opts button[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,180,0,.12);color:#fff;font-weight:700}
.cc-sw{display:flex;flex-wrap:wrap;gap:10px}

  work2:{"type":"실무","field":"실무","hr":"노무·조직문화","when":"D+60","time":"저녁","who":"yoon","title":"동기로서 들은 이야기","goal":"고충을 들었을 때 신입의 역할을 '판단'이 아니라 '듣기, 약속의 범위, 전달'에서 찾습니다.","text":"퇴근 후 입사 동기 윤채린(마케팅팀)과 저녁을 먹었다. 채린이 조심스럽게 말했다. \"너 인사팀이니까… 그냥 하소연만 할게. 우리 파트장님이 회의 때마다 한 선배만 콕 집어서 망신을 줘. 그 선배 요즘 밥도 잘 못 먹어. 근데 인사팀에는 절대 말하지 마. 내가 말한 거 알면 나 끝나.\"","ctx":["입사 동기 윤채린 (마케팅팀)","60일차 저녁 · 회사 밖","당사자(그 선배)는 이 대화를 모름"],"dilemma":"동기와의 약속 vs 인사팀의 역할 · 당사자의 뜻 vs 회사가 알아야 할 일","hint":{"s":"kim","q":"그 이야기를 들은 건 '동기 OO'였을까요, '인사팀 OO'였을까요? 채린 씨는 누구에게 말했다고 생각할까요?"},"ch":[{"t":"약속을 지킨다. 대신 그 선배가 직접 이용할 수 있는 회사 고충 상담 창구와 익명 신고 방법을 채린에게 알려 준다.","r":"채린은 고마워하며 그 선배에게 창구를 전했다. 하지만 한 달이 지나도 상담 신청은 없었고, 그 선배가 휴직을 알아본다는 이야기가 들렸다.","d":[-3,5,0,-1]},{"t":"다음 날 팀장님께 들은 사실만 보고하고, 채린의 이름은 빼 달라고 부탁한다.","r":"팀장님은 \"말해 줘서 고마워요\"라며 조용히 사실 확인을 시작했다. 하지만 마케팅팀이 작아 채린은 금방 눈치챘고, 한동안 내 연락을 받지 않았다.","d":[5,-5,2,-1]},{"t":"채린에게 다시 연락해 \"나는 인사팀이라 들은 걸 혼자 덮어 두기 어려워\"라고 솔직히 말하고, 그 선배가 어떻게 하고 싶어 하는지 먼저 물어봐 달라고 한다.","r":"채린은 서운해하면서도 이야기를 전했고, 일주일 뒤 그 선배가 직접 인사팀에 상담을 요청했다. 다만 그 일주일 동안 나는 이 일을 누구에게도 말하지 않은 채 혼자 안고 있었다.","d":[-1,1,3,-2]}],"sr":[{"s":"kim","r":"인사팀장 · 노무·조직문화 12년차","p":1,"q":"인사팀원은 퇴근해도 인사팀이에요. 법은 회사가 괴롭힘을 신고받았을 때뿐 아니라 '알게 된' 경우에도 지체 없이 조사하라고 해요. 들은 사람이 혼자 판단해 덮어 두면 안 되는 이유예요. 이름은 최대한 보호할게요.","w":"고충은 혼자 판단하지 않는다. 신입의 자리는 '접수와 전달'이다."},{"s":"choi","r":"노무 6년차","p":2,"q":"저는 당사자의 뜻부터 확인하는 쪽이에요. 피해자가 원하지 않는 방식으로 일이 커지면 그것도 상처가 되거든요. 다만 일주일은 길어요. 하루 이틀 안에 팀장님께 '이런 일이 있을 수 있다' 정도라도 말해 둬요.","w":"속도와 당사자의 뜻 사이에서 균형을 잡는 것이 노무의 일이다."},{"s":"seo","r":"조직문화 3년차","p":1,"q":"인사팀은 결국 회사 쪽 부서라 직원 편만 들 수 없을 때가 많아. 노무사가 들어와야 풀리는 일도 있고. 그래서 더 '내가 판단하지 않는 것'이 중요하더라.","w":"인사팀은 직원과 회사 사이에 있다. 그래서 혼자 판단하지 않는다."}],"why":["인사팀이 고충을 들었을 때 신입이 할 일은 '판단'이 아니다. 끝까지 듣고, 지킬 수 없는 비밀은 약속하지 않고(누구에게까지 전해질 수 있는지 솔직히 말하고), 혼자 오래 안고 있지 않는 것임.","근로기준법 제76조의3은 회사가 직장 내 괴롭힘을 신고받거나 알게 되면 지체 없이 객관적으로 조사하도록 하고, 피해 근로자의 뜻에 반하는 보호 조치와 조사 과정에서 알게 된 비밀의 누설을 금지한다. B와 C가 지키려는 것이 둘 다 법에 들어 있는 셈이다.","당사자가 스스로 결정하도록 돕는 A의 마음도 틀리지 않다. 다만 '창구를 알려 주는 것'과 '인사팀원이 들은 내용을 혼자 덮어 두는 것'은 구분해야 한다. 고충 처리는 접수 → 사실 확인 → 조치 → 재발 방지로 이어지고, 필요하면 노무사 같은 외부 전문가가 들어오는 걸로"],"ask":["인사팀 밖에서 사적으로 고충을 들었을 때, 우리 팀은 어디까지 공유하는 게 원칙이에요?","고충을 처음 들은 사람이 그 자리에서 해도 되는 말과 하면 안 되는 말은 뭐예요?"],"basis":"신입(인사 직무: 직원 고충은 사측 부서라 직원 편만 들 수 없음, 노무사 개입), R2(담당 업무: 노무관리·직원 고충 처리), R1(경험을 공식 채널로 말하기 어려움, 비공식·1:1·보안), 법령(근로기준법 제76조의3 제2·3·7항)","seed":[10,18,14]},
  work5:{"type":"실무","field":"실무","hr":"교육(HRD)","when":"D+90","time":"오전","who":"han","title":"왜 3시간이었을까","goal":"오래된 방식을 바꾸기 전에 그 방식이 지키던 목적을 찾고, 혼자 맡은 일의 결정 범위를 정합니다.","text":"내 수습이 끝나는 주, 팀장님이 말했다. \"다음 달 경력 입사자 온보딩, 이번엔 OO 님이 처음부터 끝까지 맡아 봐요.\" 지난 기수 설문에서 가장 많이 나온 의견은 \"첫날 오전 3시간 연속 회사 소개가 힘들었다\", \"우리 팀 사람은 오후 늦게야 만났다\"였다. 그런데 그 3시간은 본부장 다섯 명이 30분씩 직접 하는 소개로, 매 기수 같은 순서로 해 왔다고 한다.","ctx":["한지훈 팀장님","90일차 월요일","세부 일정 확정까지 2주 · 본부장 5명 일정 연동"],"dilemma":"지키기 vs 바꾸기 · 혼자 맡는다는 것의 범위","hint":{"s":"lee","q":"그 3시간이 왜 매번 같은 순서였는지 알아요? 모른다면, 바꾸기 전에 누구에게 물어볼 수 있을까요?"},"ch":[{"t":"지난 기수 일정을 그대로 쓰고, 설문 의견은 결과 보고서의 개선 과제로 남긴다.","r":"준비는 순조로웠고 본부장실과도 문제가 없었다. 하지만 이번 기수 설문에도 같은 의견이 나왔고, 팀장님이 물었다. \"처음부터 맡긴 이유가 뭐였을까요?\"","d":[-3,2,1,2]},{"t":"회사 소개를 1시간으로 줄이고, 남는 시간을 팀 버디와의 점심·질문 시간으로 바꾸는 안을 만들어 팀장님께 올린다.","r":"팀장님은 좋은 안이라면서 \"본부장님들께는 누가, 어떻게 말씀드려요?\"라고 물었다. 본부장실 두 곳이 '예년대로'를 원해 조율에 일주일이 걸렸다.","d":[3,-3,4,-3]},{"t":"순서는 두고 방식만 바꾼다. 본부장별 발표를 15분으로 줄이고, 입사자들이 미리 낸 질문에 답하는 시간 15분을 넣자고 본부장실 다섯 곳에 요청한다.","r":"다섯 곳 중 네 곳이 좋다고 했고, 입사자 반응도 좋았다. 다만 다섯 곳과 일일이 조율하느라 준비 시간이 두 배로 들었다.","d":[2,3,2,-5]}],"sr":[{"s":"lee","r":"HRD 4년차","p":2,"q":"오래된 순서에는 대개 이유가 있어요. 그 3시간은 본부장님들이 입사자를 직접 보는 거의 유일한 자리거든요. 그 목적은 지키고 방식만 바꾸면 양쪽을 다 살릴 수 있어요.","w":"바꾸기 전에, 그 방식이 지키던 것을 먼저 찾는다."},{"s":"kim","r":"인사팀장 · 12년차","p":1,"q":"맡겼다는 건 판단해 보라는 뜻이에요. 같은 의견이 기수마다 반복되면 구조를 바꿀 때고요. 본부장님들 설득은 같이 해요. 혼자 다 하라는 게 아니에요.","w":"혼자 맡는다는 건 혼자 결정한다는 뜻이 아니라, 결정에 필요한 사람을 내가 먼저 찾아간다는 뜻이다."},{"s":"seo","r":"조직문화 3년차","p":1,"q":"기획안은 보기 좋게보다 '무엇을 강조하고, 그 근거가 뭔지'가 먼저래. 선배들이 기획안 쓰는 걸 옆에서 보면서 배웠어.","w":"기획안은 무엇을 강조할지와 그 근거부터 정한다."}],"why":["오래 유지된 방식에는 대개 이유(이해관계자, 경영진의 메시지, 관행)가 있다. 그 이유를 알면 무엇을 지키고 무엇을 바꿀지 정할 수 있고, 다음에 같은 일을 할 때 더 빨라진다.","만족도가 낮다고 목적까지 실패한 것은 아니다. 회사 소개의 목적(경영진과의 첫 만남, 회사 방향 이해)과 입사자의 요구(우리 팀과 빨리 연결)를 따로 보면 선택지가 늘어난다. 교육 설계의 요구 분석에서 조직의 요구와 학습자의 요구를 함께 보는 것과 같다.","처음 맡은 일이고 일정이 빠듯하다면 A처럼 한 번은 그대로 운영하며 이유를 파악하는 것도 방법이다. 그때는 '다음 기수에 바꿀 것'을 기록으로 남긴다."],"ask":["지난 기수 때 회사 소개를 3시간으로 정한 이유가 있었어요? 바꾸려면 누구와 먼저 이야기해야 해요?","처음 혼자 맡은 일에서 사수님은 어디까지 혼자 정하셨어요?"],"basis":"R2(처음으로 자신만의 업무를 수행하기까지의 과정, '왜'를 알아야 빨라진다), R4(팀에 쌓인 데이터로 의사결정 과정을 체험), R1(온보딩의 관계 형성·네트워킹 효과), 신입(배운 노하우: 기획안의 강조점과 근거, 어깨너머 학습), 실무 지식(교육 요구 분석)","seed":[10,18,14]},
  rep1:{"type":"보고","field":"보고","hr":null,"when":"D+3","time":"15:00","who":"han","title":"3명 중 2명","goal":"보고의 순서(일을 맡긴 사람)와 타이밍(결정이 내려지는 때)이 부딪힐 때 무엇을 앞세울지 판단.","text":"월요일에 사수님이 맡긴 일이 있다. 다음 주 월요일 입사하는 경력직 3명의 입사 서류를 목요일까지 받아 확인하기. 수요일 오후, 2명은 끝났고 1명은 전 직장 경력증명서가 \"다음 주에나 나온다\"고 한다. 사수님은 외근 중이고, 방금 팀장님이 지나가며 말했다. \"내일 아침에 본부장님께 입사자 현황 보고 들어가요.\"","ctx":["박서연 선배 (업무 지시) · 외근 중","3일차 오후 3시","팀장님 보고는 내일 오전 9시"],"dilemma":"지금 알리기 vs 해결하고 알리기 · 일을 맡긴 사람 vs 결정하는 사람","hint":{"s":"lee","q":"이 소식이 가장 먼저 '필요한' 사람과, 가장 먼저 '알아야 하는' 사람이 같은 사람일까요?"},"ch":[{"t":"사수님께 두 줄 메신저를 보낸다. \"입사 서류 3명 중 2명 완료. 1명은 경력증명서가 다음 주 발급 예정인데, 처리 방법 여쭤봐도 될까요?\"","r":"사수님이 바로 답했다. \"팀장님께는 내가 말할게요.\" 일은 빨리 풀렸지만, 팀장님은 이 건을 내가 맡고 있다는 걸 모른다.","d":[-2,4,1,0]},{"t":"오늘 안에 직접 해결책을 찾는다. 입사자에게 대신 낼 수 있는 서류가 있는지 묻고, 해결된 상태로 내일 사수님께 완료 보고를 한다.","r":"입사자가 재직 기간이 나오는 건강보험 자격득실확인서를 먼저 보내 주겠다고 했다. 그런데 그 서류로 대신해도 되는지는 내가 정할 일이 아니었고, 팀장님 보고에는 반영되지 못했다.","d":[-2,1,4,-3]},{"t":"팀장님께 지금 바로 현황을 메신저로 보내고, 사수님을 참조로 넣는다.","r":"팀장님이 \"고마워요, 보고에 넣을게요\"라고 했다. 저녁에 돌아온 사수님이 말했다. \"다음엔 나한테 먼저 말해 줘요. 팀장님이 물어보시는데 나만 몰랐어요.\"","d":[4,-4,2,0]}],"sr":[{"s":"park","r":"사수 · 채용 5년차","p":0,"q":"일을 맡긴 사람한테 먼저가 기본이에요. 외근 중이어도 두 줄이면 읽어요. 내가 모르는 채로 팀장님이 먼저 아시면, 그다음부터 팀장님은 나를 건너뛰고 OO 님한테 직접 물어보게 돼요.","w":"보고 라인은 '누가 누구를 믿고 일을 맡겼는가'의 순서다."},{"s":"lee","r":"HRD 4년차","p":2,"q":"내일 아침 보고가 걸려 있으면 저는 팀장님께 바로 드려요. 대신 사수 참조는 꼭이요. 보고는 받는 사람이 다음 결정을 할 수 있게 하는 거라, 타이밍이 순서보다 앞설 때가 있어요.","w":"보고의 목적은 받는 사람의 다음 결정이다. 결정 시점이 가까우면 타이밍이 먼저다."},{"s":"yujin","r":"먼저 들어온 신입 · HRD","p":0,"q":"나는 '3명 중 2명 완료'처럼 중간에 숫자로 보고해. 다 끝날 때까지 기다리면 꼭 늦더라.","w":"중간 보고를 숫자로 하면 짧고 정확하다."}],"why":["보고에는 순서(일을 맡긴 사람 → 그 위)와 타이밍(결정이 내려지는 때)이 있다. 둘이 부딪힐 때 무엇을 앞세우는지는 팀마다 달라서, 매뉴얼이나 AI로는 알 수 없다.","결정이 아직 멀면 순서를(A), 결정이 코앞이면 타이밍을(C) 앞세우는 판단이 자연스럽다. 해결책까지 찾아 보고하는 B를 반기는 팀도 있지만, 그 해결책이 내 권한 안인지가 먼저다. 대신 받을 서류를 인정할지는 회사가 정할 일임.","나쁜 소식은 해결 전이라도 '지금 상태 + 언제까지 무엇을 해 보겠다'와 함께 먼저 알리는 편이 안전하다. '3명 중 2명'처럼 숫자로 말하면 짧고 정확해짐"],"ask":["중간에 문제가 생기면, 우리 팀은 해결하고 보고하는 쪽이에요, 일단 알리는 쪽이에요?","팀장님이 저에게   rep5:{"type":"보고","field":"보고","hr":null,"when":"D+14","time":"13:00","who":"park","title":"그럴듯한 두 문장","goal":"AI 초안에서 '바깥 사실'과 '회사 사실'을 가려 확인하고, 확인 책임을 어디까지 질지 정합니다.","text":"사수님이 부탁했다. \"다음 달부터 시작하는 '입사자 버디 제도' 전 직원 안내문 초안, 3시까지 써 줄래요? 요즘 다들 초안은 AI로 써요.\" AI 초안은 매끄러웠다. 그런데 두 문장이 걸린다. \"한 조사에 따르면 신입사원 10명 중 3명이 1년 안에 회사를 떠납니다.\" \"버디 활동은 연말 평가에 반영됩니다.\" AI가 붙인 출처 링크는 열리지 않고, 두 번째 문장은 사실인지 모르겠다.","ctx":["박서연 선배 (사수)","14일차 오후 1시","3시 마감 · 전 직원 발송용"],"dilemma":"속도 vs 확인 · 설득력 vs 정확성 · 확인 책임은 누구에게","hint":{"s":"lee","q":"이 안내문에서 틀리면 안 되는 문장은 몇 개예요? 그 문장마다 출처를 말할 수 있어요?"},"ch":[{"t":"걸리는 두 문장에 노란색 표시와 '확인 필요' 메모를 달아 3시에 그대로 넘긴다.","r":"제시간에 넘겼다. 사수님은 \"표시해 줘서 고마워요\"라고 했지만, 두 문장을 확인하느라 사수님의 퇴근이 30분 늦어졌다.","d":[1,-2,3,1]},{"t":"두 문장을 빼고, 지난 사내 안내문 세 개를 찾아 형식과 말투를 맞춘 뒤 넘긴다.","r":"회사 안내문다운 글이 됐다. 하지만 3시 40분에 넘겼고, '왜 버디 제도를 하는지'가 빠져 설득력이 약하다는 말을 들었다.","d":[-2,1,4,-3]},{"t":"AI에게 지난 사내 안내문 두 개를 붙여 넣고 \"이 형식과 말투로, 출처가 확실한 내용만 써 줘\"라고 다시 요청한다.","r":"2시 반에 말투까지 맞춘 초안이 나왔다. 그런데 사내 안내문을 외부 AI에 넣어도 되는지 확인하지 않았고, AI가 새로 붙인 출처도 결국 다시 찾아봐야 했다.","d":[-3,0,3,2]}],"sr":[{"s":"lee","r":"HRD 4년차","p":1,"q":"전 직원한테 나가는 순간 인사팀의 공식 문장이 돼요. 출처 없는 숫자는 빼는 게 맞고, '평가 반영'은 사실이 아니면 사고예요. 설득은 우리 회사 이야기로 하면 돼요.","w":"공식 안내문에서 틀린 한 문장은 안내문 전체의 신뢰를 깎는다."},{"s":"park","r":"사수 · 채용 5년차","p":0,"q":"저는 표시해서 넘겨 주는 게 좋아요. '평가 반영' 같은 건 신입이 확인할 수 있는 게 아니라 팀장님께 여쭤봐야 하는 거라서요. 마감도 지키고요. 대신 표시는 정확하게.","w":"내가 확인할 수 없는 사실은, 확인할 수 있는 사람에게 정확히 표시해 넘기는 것까지가 내 일이다."},{"s":"yujin","r":"먼저 들어온 신입 · HRD","p":1,"q":"AI가 없는 출처를 줄 때가 있어서, 나는 숫자는 꼭 원문을 다시 찾아. 못 찾으면 안 써.","w":"원문을 찾을 수 없는 숫자는 쓰지 않는다."}],"why":["AI가 틀리는 문장은 두 종류다. 바깥 사실(통계, 법, 외부 자료)은 원문을 찾을 수 있으면 확인하고, 못 찾으면 쓰지 않는다. 회사 사실(제도, 평가, 규정)은 AI가 원래 알 수 없으니 사내 규정이나 담당자에게 확인","사내 문서나 개인정보를 외부 AI 서비스에 넣는 것을 보안 지침으로 제한하는 회사가 많다. 회사가 허용한 사내용 AI 도구가 있다면 C가 가장 빠르고 정확한 방법일 수 있다. 쓰기 전에 허용된 도구와 범위부터 확인","AI 초안은 누구나 쓸 수 있는 문장의 부담을 덜어 준다. 그렇게 아낀 시간을 '틀리면 안 되는 문장'을 확인하는 데 쓰는 것이 사람의 몫이다."],"ask":["우리 팀은 AI를 어디까지 써요? 사내 자료를 넣어도 되는 도구가 따로 있나요?","전 직원 안내문은 보통 누가 마지막으로 확인해요?"],"basis 안일 때 가장 빠른 해결이 된다.","인사 자료는 공개 범위가 중요하다. 면담처럼 사람 수가 적은 자료는 숫자만으로도 누구인지 드러날 수 있다. 안건을 누구 선까지, 어떤 형태로 공개할지는 신입이 자주 어려워하는 판단이다(R4)."],"ask":["현업 팀장님들이 인사팀 제안에 반대하실 때, 사수님은 회의 자리에서 바로 답하세요, 따로 찾아가세요?","인사 자료를 다른 팀 앞에서 쓸 때, 우리 팀은 어디까지 공개해요?"],"basis":"신입(배운 노하우: 왜 이런 전략·데이터가 필요한지 배경과 이유를 함께, 발표에서 의도와 타당성 설명 / 경험하고 싶은 상황: 발표와 피드백으로 보고서의 타당성 설명), R4(안건을 다른 조직의 누구 선까지 묻고 공개할지), R2(조직 간 의사소통), 실무 지식(입장과 이해관계의 구분: Fisher·Ury, 『Getting to Yes』)","seed":[18,10,14]},
  talk1:{"type":"소통","field":"소통","hr":null,"when":"D+3","time":"09:10","who":"me","title":"손에 잡히는 일이 없는 아침","goal":"아직 맡은 일이 없는 시간에 기다리기와 먼저 다가가기 사이에서, 내가 할 수 있는 작은 일을 찾되, 상대의 상황을 살피며 관계를 시작하는 말을 정합니다.","text":"입사 사흘째 아침 9시 10분. 첫 이틀은 교육과 계정 설정으로 정신없이 지나갔다. 오늘은 사수님이 맡긴 입사 서류 확인 건도 서류가 도착하기를 기다리는 중이라 손에 잡히는 일이 없다. 사수님은 면접 평가표에서 눈을 떼지 않고, 팀 사람들은 각자 바쁘게 키보드를 두드린다. 메일함에는 환영 메일 한 통뿐이다. 앉아 있는 시간이 점점 어색해진다.","ctx":["박서연 사수 (업무 지시)","3일차 오전 9시 10분","입사 서류 확인은 서류 도착 대기 중","팀 전체가 바쁜 시간대"],"dilemma":"기다리기 vs 먼저 다가가기 · 눈에 띄기 vs 방해하지 않기 · 일 얘기 vs 사람 얘기","hint":{"s":"seo","q":"지금 말을 걸어도 괜찮은 사람은 누구일까요? 업무를 부탁하기보다 관계를 시작하려면 어떤 첫마디가 좋을까요?"},"ch":[{"t":"사수님이 평가표를 정리하는 사이, 잠깐 손을 멈춘 것을 보고 \"지금 제가 도울 일이 있을까요? 없으면 먼저 어떤 자료를 읽어 두면 좋을까요?\"라고 묻는다.","r":"사수님이 고개를 들고 \"그럼 지난 분기 채용 현황표부터 봐요\"라며 파일 이름을 알려 줬다. 방향은 잡혔다. 다만 잠시 손을 멈춘 것이 실제 쉬는 시간은 아니어서 \"다음엔 완전히 쉬는 때에 물어봐도 돼요\"라는 말이 붙었다.","d":[2,-1,2,0]},{"t":"공유 폴더에서 지난 채용·교육 자료와 사내 규정을 찾아 읽고, 모르는 단어를 노트에 적어 둔다.","r":"오전이 금방 갔고 용어가 낯설지 않게 됐다. 그런데 하루 종일 한마디도 하지 않아 \"조용한 신입\"으로 남았고, 읽은 자료 중에는 지금은 쓰지 않는 양식도 섞여 있었다.","d":[1,-3,3,-1]},{"t":"옆자리 선배에게 인사를 건네고, 쉬는 시간에 팀 사람들이 어떤 일을 하는지 한두 가지씩 물어보며 이름과 역할을 익힌다.","r":"누가 무슨 일을 하는지 윤곽이 잡혔고, 점심을 같이 먹자는 말도 나왔다. 하지만 바쁜 선배에게 말을 건 탓에 한 명은 짧게 답했고, 사수님은 \"아직 일이 없어서 그러나\" 하는 눈으로 쳐다봤다.","d":[-1,4,0,0]}],"sr":[{"s":"park","r":"사수 · 채용 5년차","p":0,"q":"저는 물어봐 줬으면 해요. 다만 '아무 일이나'보다 '이 자료를 읽어 둬도 될까요?'처럼 고르기 쉬운 질문이면 좋아요. 그러면 30초 안에 답해 줄 수 있어요.","w":"질문이 구체적이면 선배가 짧게 답할 수 있다."},{"s":"kim","r":"인사팀장 · 12년차","p":2,"q":"첫 주에는 일보다 사람이 먼저예요. 누가 무슨 일을 하는지 알아야 나중에 물을 사람이 보여요. 업무 얘기가 아니어도 괜찮아요.","w":"첫 주의 관계가 이후 질문의 문턱을 낮춘다."},{"s":"yujin","r":"먼저 들어온 신입 · HRD","p":1,"q":"나는 첫 주에 규정집이랑 지난 자료를 읽으면서 모르는 단어를 적어 뒀어. 나중에 그 목록을 사수님께 보여 드렸더니 질문이 짧게 끝났어.","w":"아는 만큼 질문이 구체적이 된다."}],"why":["업무를 받기 전의 시간은 '비어 있는 시간'이 아니라 일하는 방식과 사람을 익힐 수 있는 시간이다(R2가 말한 '묘한 시간'). 이 시간에 무엇을 하는지는 일의 내용보다 '말을 거는 법'을 보여 준다.","사수가 마감 직전이면 B나 C처럼 방해하지 않는 쪽이, 한숨 돌리는 때라면 A처럼 직접 묻는 쪽이 낫다. C는 팀이 바쁠수록 말 거는 시점을 골라야 하고, B는 혼자 읽기만 하면 관계가 비는 점이 아쉽다.","팀이 일하는 방식(점심 시간, 메신저 쓰는 법, 질문하는 시간대)은 문서가 아니라 사람에게서 알게 된다. 일이 시작되기 전에 가볍게 한 번 물어 두면 이후 눈치 볼 일이 줄어든다."],"ask":["제가 아직 맡은 일이 없을 때, 먼저 읽어 두면 좋은 자료가 있을까요?","팀 분들이 어떤 일을 하시는지 알려면 누구에게 어떻게 여쭤보면 좋을까요?"],"basis":"신입(어려웠던 상황: 조직의 시스템을 이해하지 못한 단계 / 경험하고 싶은 상황: 인수인계 없이 새 일을 맡았을 때 어떤 자료부터 보고 언제 물을지 / 미리 알았으면: 모르는 부분을 질문하는 방법, 사회 생활), R1(비공식 조직과 관계), R2(업무를 받기 전의 '묘한 시간', 그라운드 룰), 부록 2(소통-1)","seed":[14,14,14]},
  talk2:{"type":"소통","field":"소통","hr":null,"when":"D+14","time":"10:40","who":"park","title":"\"지금 물어봐도 될까요?\"","goal":"선배의 시간을 존중하면서, 내가 먼저 해 본 것과 막힌 곳을 정리해 구체적으로 묻는 방법을 정합니다.","text":"사수님이 맡긴 '마케팅 인턴 채용 공고' 수정에서 막혔다. 우대사항을 어디까지 바꿔도 되는지, 현업 팀 요청서와 지난 공고의 표기가 서로 다르다. 점심 전에 초안을 확인받고 싶은데, 사수님은 아침부터 이어폰을 끼고 면접 일정표를 정리 중이다. 노트에는 모르는 게 일곱 개 적혀 있다. 지난주에도 비슷한 걸 두 번 물어봤다.","ctx":["박서연 사수 (업무 지시)","14일차 오전 10시 40분","점심 전 초안 확인 희망","사수님은 면접 일정 정리 중"],"dilemma":"바로 묻기 vs 정리해서 묻기 · 나의 시간 vs 선배의 시간 · 반복 질문의 부담","hint":{"s":"lee","q":"사수님이 '네' 한마디로 답할 수 있는 질문과 10분을 써야 하는 질문은 뭐가 다를까요?"},"ch":[{"t":"일곱 개 중 막힌 두 개만 골라, 지난 공고에서 찾은 내 해석을 붙여 메신저로 보낸다. \"점심 전에 2분만 시간 되실 때 알려 주세요.\"","r":"사수님이 20분 뒤 \"1번은 맞고 2번은 팀장님 확인이 필요해요\"라고 짧게 답했다. 나머지 다섯 개는 지난 자료에서 직접 찾았다. 다만 정리하느라 한 시간 반이 걸려 초안은 오후로 밀렸다.","d":[3,1,-1,-1]},{"t":"사수님이 일정표를 끝내는 오후 2시쯤까지 기다렸다가 일곱 개를 한 번에 묻고, 들은 답은 노트에 적는다.","r":"20분 동안 일곱 개를 모두 답받았고, 적어 둔 덕에 같은 질문은 되풀이하지 않게 됐다. 다만 초안은 저녁에야 끝나 현업 팀 확인이 다음 날로 밀렸다.","d":[2,2,-2,1]},{"t":"지난 공고를 보고 내 판단으로 초안을 끝까지 쓴 뒤, 사수님께 \"제 해석대로 썼는데 틀린 곳만 짚어 주세요\"라고 낸다.","r":"점심 전에 초안이 완성됐다. 사수님이 보니 우대사항 한 줄이 옛 표기라 현업 요청과 어긋나 있었다. \"이건 물어봤어야죠\"라면서도 나머지는 그대로 통과했다.","d":[-2,0,4,1]}],"sr":[{"s":"park","r":"사수 · 채용 5년차","p":0,"q":"저한텐 '질문 일곱 개'보다 '질문 두 개 + 내가 찾아본 답'이 훨씬 반가워요. 읽는 데 30초면 되니까요. 바빠도 구체적이면 답하게 돼요.","w":"질문이 구체적이면 상대가 짧게 답할 수 있다."},{"s":"lee","r":"HRD 4년차","p":1,"q":"저는 모아서 한 번에 물어요. 대신 들은 답은 바로 적어서 같은 걸 두 번 묻지 않게 해요. 사수님 시간이 쪼개지지 않거든요.","w":"답을 기록하면 반복 질문이 줄고 선배의 시간도 덜 쪼개진다."},{"s":"yujin","r":"먼저 들어온 신입 · HRD","p":2,"q":"나는 먼저 해 보고 내 판단을 같이 보여 드려. 틀려도 '왜 틀렸는지'를 들을 수 있거든. 근데 마감이 코앞일 땐 위험했어.","w":"내 해석을 들고 가면 '왜'가 남는다."}],"why":["선배는 질문이 구체적이면 잘 답하고, 추상적이거나 맥락이 없으면 경험을 꺼내기 어렵다(R1). 신입 설문에서도 '바쁜 분위기에서 질문 타이밍을 잡기 어렵다', '사소한 것까지 계속 묻기 부담스럽다'는 말이 반복됐다.","마감이 가깝고 틀리면 되돌리기 어려운 일은 A처럼 바로 짧게, 비슷한 질문이 반복될 일이라면 B처럼 모아 묻고 기록하기, 고쳐 가며 해도 되는 일이라면 C처럼 먼저 해 보고 내 해석을 보여 주기가 맞다.","신입 설문에서 도움이 됐다고 한 노하우는 '모르는 걸 빨리 묻되, 내가 할 수 있는 건 해 본 뒤에 묻기'와 '답을 기록해 같은 질문을 반복하지 않기'였다. 세 선택지는 이 둘 사이에서 서로 다른 균형을 잡는다."],"ask":["질문은 메신저가 좋으세요, 자리에서 직접이 좋으세요? 방해되는 시간대가 있어요?","제 질문 중에 '이건 물어보길 잘했다' 싶은 때와 '먼저 찾아보고 오지' 싶은 때는 어떻게 달라요?"],"basis":"신입(어려웠던 상황: 바쁜 팀원에게 사소한 것까지 계속 질문하기 부담, 질문 타이밍 / 해결 방법: 답변을 기록해 같은 질문 반복 방지 / 배운 노하우: 모르는 건 빨리 묻고, 내가 할 수 있는 건 해 본 뒤 질문 / 미리 알았으면: 모르는 부분을 질문하는 방법), R1(질문이 구체적이면 선배가 답함), R2(열린 질문으로 지도, 선배의 시간 비용)","seed":[14,14,14]},
  talk3:{"type":"소통","field":"소통","hr":null,"when":"D+30","time":"18:00","who":"me","title":"6시의 눈치","goal":"문서에 없는 팀의 '기본 규칙'을 눈치로만 짐작하지 않고, 확인할 사람과 방법을 정합니다.","text":"입사 한 달째 오후 6시. 오늘 맡은 일은 모두 끝냈고, 내일 아침 낼 자료도 팀장님께 보내 놓았다. 그런데 팀 사람들은 아무도 자리를 뜨지 않고, 사수님도 모니터를 보고 있다. 사내 규정상 퇴근 시각은 6시다. 팀장님은 \"일 끝나면 가도 돼요\"라고 했지만, 지난주 정시에 나간 다른 신입이 \"인사팀은 정시에 가는구나\"라는 말을 들었다고 한다. 가방을 챙길지 말지 마음이 불편하다.","ctx":["박서연 사수","팀 선배들","30일차 오후 6시","규정상 퇴근 시각과 팀 분위기가 다름"],"dilemma":"규정 vs 분위기 · 눈치 보기 vs 물어보기 · 나의 시간 vs 팀의 시간","hint":{"s":"seo","q":"'다들 안 가니까'는 규칙일까요, 습관일까요? 둘을 구분하려면 누구에게 무엇을 물어볼 수 있을까요?"},"ch":[{"t":"정시에 인사하고 퇴근한다. \"먼저 들어가겠습니다. 오늘 맡은 건 정리해서 메일 드렸어요.\"라고 일 상태를 한 줄로 남긴다.","r":"사수님이 \"수고했어요\"라고 했고, 다음 날 아침 팀장님이 \"어제 정리 메일 잘 봤어요\"라고 했다. 하지만 동료 한 명이 \"신입이 먼저 가네\"라고 작게 말하는 걸 들었다.","d":[2,-2,1,2]},{"t":"30분쯤 더 앉아 있다가 선배들이 일어날 때 같이 나간다.","r":"선배들이 6시 40분쯤 한꺼번에 일어났고, 엘리베이터에서 이야기가 터져 가까워졌다. 하지만 그 30분 동안 한 일은 없었고, 다음 날에도 \"일단 앉아 있어야지\" 하는 마음이 생겼다.","d":[0,4,-1,-2]},{"t":"6시 직후 사수님께 메신저로 조용히 묻는다. \"오늘 일은 마무리했는데 퇴근해도 될까요? 평소 팀 분위기도 궁금해요.\"","r":"사수님이 \"보통 6시 반쯤 정리하고 가요. 일 끝났다고 한마디만 하고 가요\"라고 알려 줬다. 마음이 편해졌다. 다만 답이 오는 동안 다른 선배들이 내 쪽을 한 번 쳐다봤다.","d":[2,-1,0,1]}],"sr":[{"s":"park","r":"사수 · 채용 5년차","p":2,"q":"저는 물어봐 주는 게 좋아요. 눈치 보다가 말 못 하고 힘들어하는 게 더 신경 쓰이거든요. 다만 옆에 사람들 있는 자리 말고 메신저로 조용히요.","w":"묻는 건 괜찮다. 묻는 자리가 중요하다."},{"s":"kim","r":"인사팀장 · 12년차","p":0,"q":"근무 시간은 정해진 거예요. 일 끝내고 한 줄 남기고 가는 건 오히려 좋은 신호예요. 인사팀이 규정을 가볍게 보는 모습이 되면 안 되기도 하고요.","w":"인사팀은 규정을 지키는 모습 자체가 업무의 일부다."},{"s":"seo","r":"조직문화 3년차","p":1,"q":"나도 처음엔 30분씩 앉아 있었어. 그러다 같이 나오는 길에 선배들이랑 얘기가 터졌고, 한 달쯤 뒤엔 '오늘은 먼저 가볼게요'가 자연스러워졌어. 대신 처음 한 달만.","w":"문서에 없는 규칙은 지켜보며 익히되 기한을 둔다."}],"why":["팀의 기본 규칙(그라운드 룰)은 규정집에도 AI에도 없다(R2). 퇴근 시각처럼 규정과 분위기가 다르면, 눈치로 짐작한 것이 실제와 어긋나기 쉽다. 내가 본 것은 '일부 사람들의 모습'일 수 있다.","일을 마쳤고 규정이 분명하다면 A처럼 일 상태를 남기고 나가는 편이, 팀과 빨리 가까워지고 싶은 첫 한 달이라면 B가 남기는 게 있다. 다만 B는 기한 없이 이어지면 습관이 된다. C는 가장 정확한 대신 묻는 자리(1:1, 메신저)가 중요하다.","퇴근처럼 민감한 일은 '눈치'로 풀기보다 '일 상태를 한 줄 공유 + 물어볼 사람 한 명'으로 풀 수 있다. 그 한 줄이 쌓이면 팀의 규칙도 신입에게 보이기 시작한다."],"ask":["우리 팀은 일이 끝났을 때 퇴근 전에 따로 말해 두는 방식이 있어요?","규정에는 없지만 팀에서 자연스럽게 지켜지는 '기본 규칙'이 또 있을까요?"],"basis":"신입(어려웠던 상황: 명확하지 않은 규율과 업무 방향성, 자유로운 분위기 속에서 업무 배우기 어려움 / 미리 알았으면: 사회 생활, 조직 내 업무 체계), R1(조직문화와 가치, 비공식 조직), R2(그라운드 룰: 문서화되지 않은 회사의 기본 규칙), 부록 3(c3 6시의 눈치)","seed":[14,14,14]},
  talk4:{"type":"소통","field":"소통","hr":null,"when":"D+60","time":"12:30","who":"yoon","title":"\"연봉 얼마야?\"","goal":"인사팀이라서 받는 사적인 질문 앞에서, 관계를 해치지 않으면서 말할 수 있는 선과 말투를 정합니다.","text":"입사 두 달째, 구내식당에서 다른 팀 동기 세 명과 점심을 먹는다. 한 명이 장난스럽게 말했다. \"야, 너 인사팀이잖아. 우리 동기 중에 연봉 제일 높은 사람 누구야? 너는 다 알잖아.\" 다른 동기들도 웃으며 쳐다본다. 지난달 급여 마감을 도우며 급여 파일을 업무로 본 적은 있다. 분위기는 즐겁고, 아무도 진지하게 묻는 것 같지는 않다.","ctx":["다른 팀 입사 동기 3명","60일차 낮 12시 30분","구내식당","급여 파일은 업무로만 열람"],"dilemma":"분위기 vs 선 긋기 · 가볍게 vs 분명하게 · 동기의 호기심 vs 업무로 알게 된 정보","hint":{"s":"lee","q":"'연봉 얼마야?'에 대답하지 않으면서도 동기가 서운하지 않으려면, 어떤 말이 들어가야 할까요?"},"ch":[{"t":"웃으면서 \"그건 말하면 나 잘려~\"라고 가볍게 넘기고 다른 화제로 돌린다.","r":"동기들이 \"역시 인사팀\"이라며 웃었고 분위기는 곧 풀렸다. 다만 한 명은 \"재미없다\"며 입을 삐죽였고, 다음 모임에서도 같은 질문이 나왔다.","d":[3,-1,0,0]},{"t":"웃으면서도 분명히 말한다. \"업무로 본 건 누구한테도 말 안 해. 대신 공개된 연봉 구조나 평가 기준은 알려 줄 수 있어.\" 그러고는 공개 자료를 설명해 준다.","r":"동기들이 \"진지하네\" 했지만 곧 \"그럼 직급별 연봉 구간은?\" 같은 질문이 이어졌고, 공개된 범위에서는 답할 수 있었다. 한 명은 \"점심시간에 일 얘기 같아서 불편하다\"고 했다.","d":[4,-2,1,-1]},{"t":"그 자리에서는 \"음, 그건 내가 확인해 보고 말해 줄게\"라고 답을 미루고, 오후에 사수님께 \"이런 질문을 받으면 팀에서는 어떻게 답해요?\"라고 묻는다.","r":"사수님이 \"인사팀은 이런 질문 정말 많이 받아요. 우리는 '업무로 아는 건 말하지 않는다'는 한 줄로 답해요\"라고 알려 줬다. 다음 점심에 동기가 \"그때 답 뭐였어?\" 하며 조금 서운해했다.","d":[2,-1,1,-1]}],"sr":[{"s":"jung","r":"평가·보상 7년차","p":1,"q":"저는 처음부터 분명하게 말해요. '업무로 아는 건 안 말해'라고요. 웃으면서도 선은 정확히. 선이 한 번 흐려지면 나중에 정말 곤란해져요. 대신 공개된 건 얼마든 알려 주고요.","w":"업무로 알게 된 정보는 업무 안에서만 쓴다. 선은 처음이 중요하다."},{"s":"kim","r":"인사팀장 · 12년차","p":0,"q":"첫 두 달에는 농담으로 받아넘기는 것도 방법이에요. 중요한 건 '말하지 않는다'는 걸 상대가 알게 되는 거예요. 분위기도 지키고요.","w":"관계를 지키면서도 선은 유지한다."},{"s":"yujin","r":"먼저 들어온 신입 · HRD","p":2,"q":"나는 처음 받았을 때 얼버무렸다가 아직도 생각나. 그래서 사수님께 물어서 '우리 팀 답변 한 줄'을 정해 놨어. 그다음엔 편해졌어.","w":"팀의 답변을 정해 두면 매번 고민하지 않는다."}],"why":["인사팀은 급여, 평가, 휴직처럼 민감한 정보를 업무 때문에 알게 된다. 업무로 알게 된 정보를 업무 밖에서 말하지 않는다는 원칙은 대부분의 회사에 있지만, 규정의 모양과 범위는 회사마다 다르다. 이 카드의 질문은 '말해도 되나'보다 '말하지 않으면서 관계를 어떻게 지키나'이다.","가볍게 넘기는 A는 분위기를 지키지만 반복되면 '말할 수 있는데 안 한다'로 읽힐 수 있고, B는 선이 분명한 대신 분위기가 한 번 무거워진다. C는 팀의 기준에 기대는 안전한 방법이지만 그 자리의 어색함을 남긴다. 사람 수, 분위기, 질문이 반복되는지에 따라 달라진다.","인사팀이라는 역할은 퇴근 후에도 이어진다(실무-2). 공식 업무 밖의 관계에서도 '내가 아는 것 중 말해도 되는 것'을 가리는 습관이 신뢰의 바탕이 된다."],"ask":["동기나 다른 팀 사람이 인사 정보를 물어볼 때, 우리 팀은 어떤 한 줄로 답해요?","업무로 알게 된 정보 중 절대 말하면 안 되는 것과 공개해도 되는 것은 어디서 나뉘어요?"],"basis":"신입(인사 직무: 직원과 회사 사이에서 한쪽 편만 들 수 없음 / 미리 알았으면: 사회 생활, 조직 내 업무 체계), R1(비공식 관계, 보안 유지), R4(안건을 누구 선까지 묻고 공개할지), 실무 지식(업무로 알게 된 정보의 목적 외 사용 제한: 회사마다 규정 다름), 부록 3(c6 \"연봉 얼마야?\")","seed":[14,14,14]},
  talk5:{"type":"소통","field":"소통","hr":null,"when":"D+90","time":"11:00","who":"me","title":"처음 보는 이름에게 부탁하기","goal":"다른 부서의 처음 보는 담당자에게 부탁할 때, 상대가 되묻지 않고 처리할 수 있게 요청을 담는 방법을 정합니다.","text":"오늘 아침 팀장님이 맡긴 다음 달 경력 입사자 온보딩을 준비 중이다. 입사자 4명의 노트북과 계정, 사원증이 입사 전날까지 필요하고, IT지원팀 접수는 이번 주 금요일까지라고 한다. 담당자는 노하린 님인데, 얼굴도 모르고 메신저를 주고받은 적도 없다. 사수님은 \"IT팀은 바빠서 답이 늦어요, 잘 부탁해 봐요\" 한마디만 남기고 외근을 나갔다. 요청 양식이 따로 있는 것 같은데 어디 있는지 모른다.","ctx":["노하린 님 (IT지원팀","처음 연락)","90일차 오전 11시","접수 마감 이번 주 금요일"],"dilemma":"정중하게 vs 빠르게 · 직접 부탁 vs 사수를 통해 부탁 · 짧게 vs 자세하게","hint":{"s":"lee","q":"받는 사람이 이 메시지 하나만 읽고 바로 움직이려면, 안에 무엇이 들어 있어야 할까요?"},"ch":[{"t":"메신저로 짧게 보낸다. \"인사팀 OO입니다. 다음 달 입사자 4명의 노트북·계정·사원증을 입사 전날까지 준비해야 해요. 요청 양식 위치와 접수 마감을 알려 주실 수 있을까요?\"","r":"한 시간 만에 양식 링크와 \"목요일 오후 4시까지\"라는 답을 받았다. 다만 양식에 적을 직급·입사일 정보를 몰라 사수님께 다시 물어야 했다.","d":[1,2,2,-2]},{"t":"사수님이 돌아올 때까지 기다렸다가, 사수님 이름으로 IT지원팀에 요청을 보내 달라고 부탁한다.","r":"사수님이 다음 날 메일을 보내 요청은 정확히 접수됐다. 하지만 접수가 마감 직전에야 됐고, 노하린 님은 내 이름을 기억하지 못했다.","d":[1,-2,3,1]},{"t":"사내 포털에서 요청 양식을 찾아 입사자 정보와 필요 일자를 모두 채워 메일로 보낸다. 처음 보는 사이라 자기소개와 요청 이유를 길게 쓰고, 사수님과 팀장님을 참조에 넣는다.","r":"노하린 님이 \"정리가 잘 돼 있어 바로 처리했다\"고 답했다. 그런데 메일 쓰는 데 반나절이 걸렸고, 참조에 팀장님이 있어서 담당자가 부담스러워했다는 말도 들렸다.","d":[2,-1,3,-3]}],"sr":[{"s":"lee","r":"HRD 4년차","p":0,"q":"저는 짧게 먼저 연락해요. 처음 보는 사이일수록 '무슨 일인지, 언제까지, 뭘 해 주시면 되는지' 세 가지만. 양식은 상대가 제일 잘 아니까 물어보는 게 빨라요.","w":"요청이 짧고 구체적이면 상대가 바로 답할 수 있다."},{"s":"jung","r":"평가·보상 7년차","p":2,"q":"다른 부서에 가는 메일은 우리 팀의 얼굴이에요. 양식이 있으면 양식대로, 첫 줄에 요청을 써요. 정확하게 보내면 오히려 답이 빨라요. 참조는 필요한 사람만요.","w":"정확한 요청은 되묻는 시간을 줄인다."},{"s":"minho","r":"먼저 들어온 신입 · 채용","p":1,"q":"나는 처음 IT팀에 부탁할 때 사수님 이름으로 보냈어. 처음엔 편했는데, 두 번째부터는 내가 직접 해야 하더라. 지금은 사수님 옆에서 보면서 연락처부터 익히고 있어.","w":"처음엔 사수를 통해 시작할 수 있지만, 내 이름의 첫 접점은 필요하다."}],"why":["다른 부서에 하는 부탁에는 ①무슨 일인지 ②언제까지 ③무엇을 해 주면 되는지 ④왜 필요한지가 들어간다. 이 네 가지가 있으면 상대가 되묻지 않는다. 처음 보는 사이라면 자기소개는 한 줄이면 된다.","마감이 가깝고 양식을 모를 때는 A처럼 짧게 먼저, 틀리면 안 되는 일이라면 C처럼 자료를 갖춰서, 처음이라 감이 안 온다면 B처럼 사수를 통해 시작할 수도 있다. 다만 앞으로도 같은 담당자와 일한다면, 내 이름으로 남긴 첫 접점이 나중에 도움이 된다(R1 비공식 관계).","다른 부서에도 그 부서의 일정과 우선순위가 있다(예: 출시 준비로 바쁜 개발2팀). 부탁은 상대의 일을 늘리는 것이니, 마감 전에 여유를 두고 보내는 것도 소통이다."],"ask":["IT지원팀이나 총무팀 같은 다른 부서에 부탁할 때, 사수님은 어떤 순서로 연락하세요? (메신저, 메일 등)","제가 미리 인사해 두면 좋은 다른 부서 담당자가 있을까요?"],"basis":"신입(어려웠던 상황: 이해당사자 간 맥락과 내 권한 파악 / 미리 알았으면: 부서별 업무 분담과 의사결정 구조, 기본적인 업무 메일 에티켓), R1(비공식 관계), R2(조직 간 의사소통, 회사 차원의 업무 흐름), 부록 2(소통-5 다른 부서·외부와 연락하기)","seed":[14,14,14]},
  cope1:{"type":"대처","field":"대처","hr":null,"when":"D+3","time":"13:30","who":"jung","title":"\"오늘 중으로\"","goal":"갑작스러운 지시에서 '오늘 중으로'가 정확히 몇 시인지, 무엇을 만들라는 것인지 먼저 정합니다.","text":"점심을 먹고 들어오니 정하은 선배가 모니터 너머로 말했다. \"OO 님, 하반기 직무교육 수요조사 응답 취합해서 오늘 중으로 보내 줘요. 양식은 지난번 거 쓰면 돼요.\" 선배는 바로 전화를 받고 돌아섰다. 응답이 어디에 모이는지도, '지난번 양식'이 뭔지도 모른다. 공유 폴더에는 비슷한 이름의 파일이 네 개다. 선배는 5시에 외부 교육을 간다고 했고, 사수님은 면접 중이다.","ctx":["정하은 선배 (업무 요청)","3일차 오후 1시 30분","\"오늘 중으로\"의 기준 시각 불명","사수님은 면접 중"],"dilemma":"지금 확인 vs 먼저 시작 · 되묻기의 부담 vs 잘못 만들 위험 · 선배의 시간 vs 나의 시간","hint":{"s":"park","q":"'오늘 중으로'는 몇 시일까요? 선배가 5시에 나간다면 그 시간은 어떤 뜻이 될까요?"},"ch":[{"t":"선배가 전화를 끊을 때를 보다가 가서 \"오늘 중이 몇 시쯤일까요? 양식은 이 두 개 중 어느 거예요?\"라고 두 가지만 확인한다.","r":"선배가 \"4시 반까지요, 두 번째 거예요\"라고 30초 만에 답했다. 방향이 바로 잡혔다. 다만 통화 직후에 말을 걸어서 \"급하면 메신저로도 돼요\"라는 말이 붙었다.","d":[2,-1,2,0]},{"t":"폴더의 양식 네 개를 열어 비교하고, 응답 파일의 날짜를 보며 가장 맞아 보이는 걸 스스로 골라 완성한다. 기한은 퇴근 전으로 짐작한다.","r":"양식은 맞았지만 선배가 원한 건 4시 반이었다. 결과물은 6시에 도착했고, 선배는 다음 날 아침에야 열었다. \"급했는데…\"라는 말이 남았다.","d":[-2,0,3,0]},{"t":"가장 가능성 높은 양식으로 일단 시작하고, 20분쯤 뒤 \"여기까지 했어요. 이 양식이 맞는지, 몇 시까지 필요하신지 확인 부탁드려요\"라고 메신저를 보낸다.","r":"선배는 회의 중이라 답이 늦었고, 3시 반쯤 \"그 양식 아니에요, 4시 반까지!\"라고 왔다. 절반은 다시 해야 했지만 시간 안에 끝났고, 중간 공유 덕분에 선배는 내가 진행 중인 걸 알고 있었다.","d":[3,1,-1,-1]}],"sr":[{"s":"park","r":"사수 · 채용 5년차","p":0,"q":"저는 바로 가서 물어요. 30초면 끝나요. 다만 '이거 맞아요?'가 아니라 '4시 반이 맞나요? 이 파일이죠?'처럼 닫힌 질문으로요.","w":"확인 질문이 구체적이면 선배는 짧게 답한다."},{"s":"lee","r":"HRD 4년차","p":2,"q":"저는 먼저 시작하고 중간에 보여 줘요. 틀려도 빨리 알 수 있거든요. 기한이 정확하지 않을수록 중간 공유가 안전해요.","w":"중간 공유는 방향 오류와 기한 오해를 일찍 드러낸다."},{"s":"yujin","r":"먼저 들어온 신입 · HRD","p":1,"q":"나는 혼자 찾아봤어. 물어볼 때 부담스러워서. 그런데 '오늘 중으로'가 4시였던 적이 있어서, 그 뒤로 시간만은 꼭 물어봐.","w":"양식은 찾을 수 있어도 기한은 지시한 사람만 안다."}],"why":["'오늘 중으로', '빨리', '간단하게' 같은 말은 사람마다 기준이 다르다. 시각(몇 시), 형식(엑셀인지 메일인지), 범위(어디까지) 세 가지만 확인해도 대부분 풀린다. '오늘 중'은 지시한 사람의 일정(5시 외부 교육)에 맞춰져 있는 경우가 많다.","지시한 사람이 바로 앞에 있고 확인이 30초면 되면 A, 자리에 없거나 바빠서 물을 수 없으면 C(중간 공유)가 낫다. 양식처럼 혼자 찾을 수 있는 건 B처럼 찾아보되, 기한은 꼭 묻는다. B는 혼자 해결하는 힘을 기르지만 기한 확인이 빠지면 위험하다.","신입 설문에서 돌발 상황이 가장 어렵다고 한 이유 중에는 갑작스러운 지시(예: 1시간 뒤 보고서 제출·발표)를 받고 정보 없이 시간 안에 해내야 했다는 경험이 있었다. 정보를 모으는 순서가 있으면 당황이 줄어든다."],"ask":["선배들이 '오늘 중으로'라고 하면 보통 몇 시를 말해요? 팀에서 쓰는 기한 표현이 따로 있어요?","갑자기 일을 받았는데 사수님이 바쁘실 때, 누구에게 먼저 확인하면 돼요?"],"basis":"신입(어려웠던 상황: 갑작스러운 업무 지시, 시간 안에 처리하기 어려움, 돌발 상황 및 문제 해결 58.3% / 경험하고 싶은 상황: 무리한 지시·돌발 상황 대처 / 미리 알았으면: 보고 체계, 업무 결과물 작성·검토 기준), R2(업무를 처음 받은 직후), 부록 3(c2 \"오늘 중으로\")","seed":[14,14,14]},
  cope2:{"type":"대처","field":"대처","hr":null,"when":"D+14","time":"16:40","who":"me","title":"강사가 늦는대요","goal":"돌발 문제에서 '지금 내가 바로 할 일'과 '위에 알려야 할 일'을 나눠 순서를 정합니다.","text":"오후 4시 40분. 5시에 시작하는 사내 직무 특강의 현장을 사수님이 맡겼다. \"교육장 문 열고 출석 체크만 해 줘요.\" 사수님은 4시부터 면접 평가 회의, 팀장님은 본부장 회의 중이다. 교육장에는 직원 38명이 앉기 시작했다. 그때 외부 강사에게서 전화가 왔다. \"죄송해요, 사고로 도로가 막혔어요. 30분쯤 늦을 것 같습니다.\" 교육장은 6시 30분까지 대관되어 있다.","ctx":["외부 강사 (전화)","14일차 오후 4시 40분","5시 시작, 강사 30분 지연 예상","사수님은 평가 회의 중, 팀장님은 본부장 회의 중"],"dilemma":"내가 정할 일 vs 알릴 일 · 기다리기 vs 프로그램 바꾸기 · 참석자의 시간 vs 강사의 사정","hint":{"s":"lee","q":"지금 이 일에서 '되돌릴 수 있는 결정'과 '되돌릴 수 없는 결정'은 각각 뭘까요?"},"ch":[{"t":"사수님과 팀장님께 메신저로 두 줄(상황·예상 시각)을 보내고, 답이 올 때까지 참석자에게 \"강사님이 도로 사정으로 30분 늦어 5시 30분에 시작합니다\"라고 안내한다.","r":"사수님이 5분 뒤 회의에서 잠깐 나와 \"알려 줘서 고마워요\"라며 같이 대응했다. 하지만 참석자 몇 명은 \"일하다 올게요\" 하며 자리를 떴고, 5시 30분에 돌아오지 않은 사람도 있었다.","d":[3,1,-2,0]},{"t":"강사에게 전화로 \"질의응답을 빼고 50분으로 줄여 5시 30분에 시작하자\"고 제안해 합의하고, 참석자에게 그대로 안내한다. 보고는 끝나고 한다.","r":"교육은 대관 시간 안에 끝났고 참석자 불만도 적었다. 그런데 이 특강은 현업 팀이 질의응답을 요청한 교육이었다. 나중에 팀장님께 변경 사유를 다시 설명해야 했다.","d":[-3,1,3,-1]},{"t":"대기 시간에 지난 특강에서 쓴 사내 안내 영상(15분)을 틀고, 참석자에게 \"5시 30분 시작\"이라고 안내한다. 사수님·팀장님께는 영상을 튼 뒤 한 줄로 알린다.","r":"대기가 덜 지루했고 강사는 5시 25분에 도착해 바로 이어 갔다. 다만 영상이 올해 개정 전 버전이었고, 한 참석자가 그 점을 지적했다.","d":[-1,2,3,-1]}],"sr":[{"s":"lee","r":"HRD 4년차","p":2,"q":"저는 현장은 현장에서 수습해요. 참석자를 앉혀 두고 기다리게 하는 게 제일 비싸니까요. 대신 쓰는 건 지난번에 쓴 것만, 그리고 그 사이에 한 줄로 알려 놓고요.","w":"내 권한 안의 임시 조치는 하되, 알리는 건 바로 이어서 한다."},{"s":"kim","r":"인사팀장 · 12년차","p":0,"q":"교육 시간표는 내가 정한 게 아니에요. 바뀌는 순간 사수나 나한테 알려야 해요. 해결하고 알리는 게 아니라 알고 바로 알리는 거예요. 두 줄이면 돼요.","w":"시간표나 프로그램에 닿는 일은 정한 사람에게 먼저 알린다."},{"s":"seo","r":"조직문화 3년차","p":0,"q":"나도 교육 직전에 상황이 바뀌어서 처리하기 전에 내 권한 범위부터 확인받았어. 그 뒤로는 일이 커져도 덜 무서웠어.","w":"권한 범위를 먼저 알면 돌발 상황에서 덜 흔들린다."}],"why":["돌발 상황에서는 ①지금 바로 해야 하는 일(참석자 안내) ②내가 정해도 되는 일(대기 방식) ③위에 알려야 하는 일(시간표·내용에 닿는 변경)을 나눈다. 알리는 건 해결한 뒤가 아니라 '알게 된 직후'가 안전하다.","사수·팀장에게 연락이 닿는다면 A처럼 알리고 판단을 같이, 연락이 어렵고 내 권한 안에서 시간을 메울 수 있다면 C처럼 임시 조치 후 바로 보고하는 편이 낫다. B처럼 프로그램 자체를 바꾸는 결정은 그 일을 맡은 사람의 권한이거나, 미리 위임받았을 때만 맞다.","교육 운영에는 대체 계획(대체 자료, 강사 연락처, 시간 조정 기준)이 따로 있는 경우가 많다. 신입 설문에도 '조직의 시스템을 이해하지 못한 단계에서 돌발 상황에 신속히 대처하지 못했다'는 응답이 있었다. 대체 계획의 위치를 미리 아는 게 첫 방어선이다."],"ask":["교육 당일에 강사가 늦거나 장비가 말썽일 때, 우리 팀의 대체 계획은 어디에 정리돼 있어요?","이런 돌발 상황에서 제가 바로 정해도 되는 건 어디까지고, 꼭 알려야 하는 건 뭐예요?"],"basis":"신입(어려웠던 상황: 돌발 상황 대처 58.3%, 조직 시스템을 이해하지 못한 단계에서 신속 대처 어려움 / 인사 직무: 교육 일정·참석 인원 조율, 권한 범위 판단 / 경험하고 싶은 상황: 돌발 문제가 생겼을 때 보고하고 수습), 실무 지식(교육 운영: 대관·시간표), 부록 3(c8 강사가 늦는대요)","seed":[18,10,14]},
  cope3:{"type":"대처","field":"대처","hr":null,"when":"D+30","time":"10:00","who":"me","title":"세 곳의 요청","goal":"같은 날 요청이 겹칠 때, 마감과 영향을 비교해 처리 순서를 정하고, 다른 사람의 일정이 걸린 요청은 먼저 조율합니다.","text":"입사 한 달째 오전 10시, 메신저가 연달아 울렸다. 사수 박서연 선배: \"채용 공고 문구 수정, 오후 2시 현업 확인 전에요.\" 이도현 선배: \"상반기 온보딩 만족도 집계, 오늘 중에 부탁해요.\" 그리고 개발2팀 오정민 팀장님이 직접 메시지를 보냈다. \"OO 님, 오늘 오후 3시 면접을 4시로 옮길 수 있을까요? 회의가 겹쳤어요.\" 세 건 모두 '오늘'이다. 사수님은 곧 면접에 들어가 오전 내내 자리를 비운다.","ctx":["박서연","이도현","오정민 팀장님(개발2팀)","30일차 오전 10시"],"dilemma":"급한 일 vs 중요한 일 · 내가 정할 일 vs 올릴 일 · 모두 만족 vs 하나는 늦게","hint":{"s":"jung","q":"이 세 건 중 '내가 혼자 결정해도 되는 것'은 몇 개일까요? 면접 시간을 옮기는 건 누가 정하는 일일까요?"},"ch":[{"t":"세 건을 한 줄씩 정리해 팀장님께 보낸다. \"공고(2시), 만족도 집계(오늘), 면접 시간 변경(3시→4시)이 겹쳤습니다. 어떤 순서로 하면 될까요?\"","r":"팀장님이 10분 뒤 \"공고 → 면접 시간 확인 → 집계 순서로 해요. 면접은 사수님께 전달해요\"라고 정리해 줬다. 일은 정확히 이어졌지만 \"이 정도는 스스로 정해 봐요\"라는 한마디가 붙었다.","d":[-1,1,3,0]},{"t":"마감이 가까운 공고부터, 그다음 만족도 집계, 면접 시간 순으로 직접 정한다. 오정민 팀장님께는 \"확인 후 알려 드리겠습니다\"라고 답하고, 세 사람에게 \"이 순서로 하겠다\"고 한 줄씩 공유한다.","r":"공고는 2시 전에 끝났고 집계는 퇴근 직전에 완료됐다. 하지만 면접 시간은 지원자에게 가능 여부를 확인하느라 3시 직전에야 \"어렵습니다\"라고 답했고, \"미리 알려 주지\"라는 반응을 들었다.","d":[1,-2,3,-1]},{"t":"공고·집계는 내 일, 면접 시간 변경은 지원자·면접관이 걸려 있어 내 권한이 아니라고 보고, 오정민 팀장님께 \"일정 변경은 담당 사수 확인이 필요해 전달드렸습니다\"라고 답한 뒤 사수님께 전달한다. 나머지 두 건을 처리한다.","r":"사수님이 면접 쉬는 시간에 지원자와 연락해 4시로 조정했다. 오정민 팀장님은 처음엔 \"답이 늦네요\" 했다가 3시 전에 확정되자 풀렸다. 하지만 사수님은 그날 쉬는 시간이 없어졌다.","d":[3,-2,2,0]}],"sr":[{"s":"jung","r":"평가·보상 7년차","p":2,"q":"저는 '내 일'과 '내가 약속하면 안 되는 일'을 제일 먼저 나눠요. 면접 일정은 지원자와 면접관이 걸려 있으니까 신입이 약속하면 안 돼요. 받았다고만 하고 담당에게 넘겨요.","w":"다른 사람이 걸린 약속은 내가 지킬 수 있는 만큼만 한다."},{"s":"park","r":"사수 · 채용 5년차","p":1,"q":"저는 시간이 제일 빠른 것부터 정해서 말해요. '이 순서로 할게요' 하고 공유하면, 틀려도 바로잡혀요. 물어보는 것도 좋은데, 한 번 정해서 보여 주는 게 더 배움이 커요.","w":"우선순위를 정해서 공유하면 틀려도 빨리 조정된다."},{"s":"seo","r":"조직문화 3년차","p":0,"q":"나는 순서를 정하기 전에 팀장님께 확인받았어. 내 권한 범위부터. 그랬더니 같은 일을 두 번 하지 않더라.","w":"권한 범위를 먼저 확인하면 되풀이가 줄어든다."}],"why":["우선순위는 기한(언제까지), 영향(안 하면 누가 곤란한가), 되돌릴 수 있는가 세 가지로 보면 순서가 보인다. 신입 설문의 '내가 판단한 우선도와 실무의 우선도 사이의 갭'은 이 셋을 나 혼자 보기 때문에 생기는 경우가 많다.","요청이 여러 사람에게서 올 때, 내가 정할 수 있는 것은 '순서와 방법'이고 정할 수 없는 것은 '다른 사람이 걸린 약속'(면접 일정)이다. 둘을 나누면 말할 내용이 보인다. 실무-1은 교육 대상·이수 기준을 바꿀 수 있는지 판단하는 카드이고, 이 카드는 여러 요청의 마감·영향을 비교해 실행 순서와 조율 시점을 정하는 카드다.","처음 한 달이라 순서가 불안하면 A처럼 확인을, 익숙해지면 B처럼 정해서 공유를, 약속이 걸린 일은 C처럼 분리하는 쪽이 낫다. 어느 쪽이든 '요청한 사람들에게 지금 상태를 알리는 것'이 빠지면 오해가 생긴다."],"ask":["요청이 여러 개 겹칠 때, 우리 팀은 우선순위를 누가 어떤 기준으로 정해요?","제가 혼자 약속해도 되는 일과 꼭 확인받아야 하는 일은 어디서 나뉘어요? (예: 면접 일정 변경)"],"basis":"신입(어려웠던 상황: 업무 우선순위 판단·시간 관리 33.3%, 스스로 판단한 우선도와 실무 우선도의 갭 / 경험하고 싶은 상황: 여러 부서가 얽힌 업무 요청에서 우선순위가 충돌하는 상황 / 인사 직무: 이해관계자별 요구, 권한 범위 판단), 부록 2(대처-3 요구가 부딪힐 때 내 권한은?)","seed":[14,14,14]},
  cope4:{"type":"대처","field":"대처","hr":null,"when":"D+60","time":"15:10","who":"me","title":"잘못 나간 메일","goal":"내 실수를 알았을 때, 숨기지 않고 '무슨 일, 누구에게 영향, 내가 제안하는 조치'를 함께 알리는 순서를 정합니다.","text":"오후 3시 10분. 방금 전 직원 120명에게 '하반기 직무교육 신청 안내' 메일을 보냈다. 보낸 편지함에서 다시 읽다 보니 신청 마감을 '내일 오전 10시'가 아니라 '모레 오전 10시'로 적은 걸 발견했다. 읽음 표시가 벌써 올라오고 있다. 사수님은 3시 30분까지 회의 중이다. 내일 오전 10시가 지나면 교육장 대관과 교재 인쇄 수량이 확정된다.","ctx":["전 직원 120명","60일차 오후 3시 10분","실제 마감은 내일 오전 10시, 메일에는 모레","사수님은 회의 중(3시 30분까지)"],"dilemma":"숨기고 고치기 vs 알리고 고치기 · 빨리 정정 vs 먼저 보고 · 내 실수의 크기","hint":{"s":"park","q":"이 실수로 지금 누가, 언제부터 곤란해질까요? 그 사람들이 알아야 하는 한 가지는 뭘까요?"},"ch":[{"t":"회의가 끝나는 3시 30분까지 기다렸다가 사수님께 상황을 말씀드리고, 정정 메일을 같이 쓴다.","r":"사수님이 \"발견하고 바로 말해 줘서 고마워요. 같이 써요\"라며 정정 문안을 다듬었다. 정정 메일은 3시 50분에 나갔지만, 그 40분 사이 몇몇 팀이 모레 마감으로 알고 일정을 공유해 버렸다.","d":[3,1,-2,0]},{"t":"바로 정정 메일을 써서 먼저 보낸다. \"신청 마감을 내일 오전 10시로 정정합니다. 인사팀 착오로 혼란을 드려 죄송합니다.\" 사수님과 팀장님께는 보낸 뒤에 알린다.","r":"3시 20분에 정정 메일이 나갔고 팀들이 빠르게 바로잡았다. 하지만 사수님이 \"'인사팀 착오'라는 표현은 팀장님 확인이 필요했어요. 말하고 보냈으면 좋았겠어요\"라고 했다.","d":[-2,0,4,-1]},{"t":"먼저 신청 현황을 열어 이미 신청한 사람 수와, 모레 마감으로 알고 일정을 잡은 팀이 있는지 확인한다. 그다음 \"실수 내용 / 영향 범위 / 제안하는 정정문\" 세 가지를 사수님께 메신저로 보낸다.","r":"사수님이 3시 25분에 읽고 \"이거면 바로 결정할 수 있어요\"라며 정정 메일을 승인했고, 3시 40분에 나갔다. 다만 영향을 확인하느라 15분이 더 걸려 그 사이 읽은 사람이 늘었다.","d":[3,1,1,-2]}],"sr":[{"s":"kim","r":"인사팀장 · 12년차","p":2,"q":"실수는 누구나 해요. 문제는 숨기거나 늦게 알리는 거예요. '무슨 일이, 누가 영향받고, 어떻게 고칠지' 세 줄이면 저는 바로 결정해요.","w":"실수 보고에 영향과 제안이 들어 있으면 받는 사람이 바로 판단할 수 있다."},{"s":"choi","r":"노무 6년차","p":0,"q":"저는 정정 문구를 혼자 쓰지 않아요. 표현 하나가 책임 문제로 이어질 수 있어서요. 사수나 팀장 확인을 받고 보내요. 5분 늦어도 괜찮아요. 실수를 알린 사람에게 화내는 팀은 드물어요.","w":"정정 문구는 책임과 약속에 닿을 수 있어 확인이 필요하다."},{"s":"minho","r":"먼저 들어온 신입 · 채용","p":1,"q":"나는 오타를 바로 정정 메일로 보내서 해결한 적이 있어. 사수님이 '고친 것보다 말 안 하고 보낸 게 마음에 걸렸다'고 하셨어. 그 뒤로는 보내기 전에 한 줄은 꼭 알려.","w":"빠른 정정과 사전 알림은 둘 다 필요하다."}],"why":["실수 보고에는 ①무슨 일인지(사실) ②누구에게 어떤 영향이 있는지 ③내가 제안하는 조치가 들어간다. 이 셋이 있으면 '실수 고백'이 '문제 해결 제안'이 된다. 신입 설문에서도 '업무 중 실수나 돌발 문제가 생겼을 때 보고하고 수습하는 상황'을 경험해 보고 싶다는 응답이 나왔다.","영향이 크고 시간이 중요할수록 B처럼 먼저 정정하고 알리는 편이 필요하지만, 정정 문구가 책임이나 약속에 닿는다면 확인이 먼저다. 사수에게 닿을 수 있다면 알리는 데 5분이면 된다. 이 카드에는 '말하지 않고 고친다'는 선택지를 넣지 않았다. 숨기면 다음에 같은 실수를 찾기 어렵다.","보고-1은 바깥 사정으로 생긴 문제의 보고 순서·타이밍, 이 카드는 내 실수의 보고다. 실수를 말하는 방식이 쌓이면 팀의 신뢰가 된다."],"ask":["사수님이 신입 때 했던 실수 중에 어떻게 수습했는지 기억나는 게 있어요?","전 직원 메일을 정정할 때 팀에서는 누가 확인하고, 어떤 문구를 써요?"],"basis":"신입(경험하고 싶은 상황: 업무 중 실수나 돌발 문제가 생겼을 때 보고하고 수습 / 어려웠던 상황: 돌발 상황에서 신속 대처 / 미리 알았으면: 보고 체계, 수정 요청에 대응하는 방법), R2(그라운드 룰), 부록 2(대처-4 실수를 보고하고 수습하기), 실무 지식(전 직원 공지 메일 정정)","seed":[14,14,14]},
  cope5:{"type":"대처","field":"대처","hr":null,"when":"D+90","time":"18:30","who":"me","title":"2주째 야근","goal":"일이 겹쳐 길어질 때 '일정과 체력'을 지키며 도움을 요청하는 시점과 방법을 정합니다.","text":"90일차 오후 6시 30분. 지난 2주 동안 수습 평가 면담 준비, 버디 제도 운영 정리, 본업이 겹쳐 8시 넘어 퇴근하고 있다. 오늘 아침 팀장님이 다음 달 경력 입사자 온보딩을 처음부터 끝까지 맡겨 주셨다. 체크리스트에는 열두 개가 적혀 있고, 세부 일정 확정까지는 2주가 남았다. 팀장님은 어제 \"잘하고 있어요\"라고 했다. 눈이 뻑뻑하고, 퇴근 시간이 지났는데 자리를 뜨기가 어렵다.","ctx":["한지훈 팀장님","90일차 오후 6시 30분","새 체크리스트 12개, 세부 일정 확정까지 2주","2주째 8시 넘어 퇴근 중"],"dilemma":"내가 해결 vs 도움 요청 · 완성도 vs 일정 · 지금의 체력 vs 다음 달의 나","hint":{"s":"seo","q":"'잘하고 있어요'는 '계속 이대로 해요'일까요, '힘들면 말해요'일까요? 팀장님은 지금 이 상황을 알고 계실까요?"},"ch":[{"t":"이번에도 늦게까지 남아 체크리스트를 하나씩 지운다. 힘들어도 혼자 끝낸다.","r":"첫 주에 체크리스트 일곱 개가 줄었다. 하지만 3주째 야근이 이어지던 날 아침, 입사자 안내문의 날짜를 한 칸 잘못 적은 걸 사수님이 발견했다.","d":[2,0,4,-3]},{"t":"지금 하는 일과 새 체크리스트를 한 장으로 정리해 팀장님께 15분 면담을 요청한다. \"지금 하는 일 5개 / 새 체크리스트 중 이번 달 안에 꼭 필요한 것 7개, 미룰 수 있는 것 3개, 도움이 필요한 것 2개\"로 나눈다.","r":"팀장님이 \"이걸 진작 말해 줬으면 좋았어요\"라며 우선순위를 같이 정했고, 도움이 필요한 두 건은 서지아와 나누기로 했다. 야근은 줄었다. 다만 \"미룰 수 있다고 한 3개 중 1개는 입사자 반응에 영향이 있을 수 있어요\"라는 말이 남았다.","d":[2,1,-1,1]},{"t":"팀장님께 말하지 않고, 내가 급하지 않다고 본 항목 세 개(입사자 환영 점심 포함)를 이번 기수에서 빼기로 정한다. 오늘부터 퇴근 시간은 6시 30분을 지킨다.","r":"퇴근 시간은 지켜졌고 마감도 맞췄다. 그런데 입사 첫날 환영 점심이 없다는 점을 입사자들이 아쉬워했고, 팀장님은 \"그건 빼도 된다고 한 적 없는데요\"라고 했다.","d":[-3,0,2,3]}],"sr":[{"s":"kim","r":"인사팀장 · 12년차","p":1,"q":"'잘하고 있어요'는 '힘들면 말해요'일 때가 많아요. 야근이 일주일 넘게 이어지면 저한텐 신호예요. 말해 주면 같이 나눠요. 말 못 하는 쪽이 더 위험해요.","w":"도움 요청은 약함이 아니라 일정 관리의 일부다."},{"s":"jung","r":"평가·보상 7년차","p":0,"q":"저는 큰 일에는 한 번 몰아서 끝내요. 대신 마지막 점검은 꼭 다른 사람에게 부탁해요. 피곤할 때 내 눈은 오타를 못 봐요.","w":"집중해서 끝내는 건 가능하지만, 점검은 다른 눈이 필요하다."},{"s":"yujin","r":"먼저 들어온 신입 · HRD","p":2,"q":"나는 내가 정한 대로 줄였다가 '그건 왜 뺐어요?'라는 말을 들었어. 그 뒤로는 줄일 때 '이걸 줄이려는데 괜찮을까요?'를 먼저 말해.","w":"줄이는 결정은 혼자 하지 않고, 기대를 맞춘 뒤에 한다."}],"why":["업무량 문제는 '얼마나 더 일하느냐'보다 '무엇을 하지 않을지'를 정하는 일에 가깝다. 하지 않을 것을 혼자 정하면 C처럼 누군가의 기대와 어긋날 수 있고, 같이 정하면(B) 그 기대가 조정된다.","마감이 짧고 한 번뿐인 일이라면 A처럼 집중해서 끝내는 판단도 있지만, 야근이 길어질수록 실수를 놓치기 쉽다. A는 마지막 점검을 다른 사람에게 부탁할 때 더 안전하다.","도움 요청은 '못 하겠다'가 아니라 /* ---------- router ---------- */
const VIEWS={home,game,community,register,hrd};
function route(){
  const v=(location.hash||'#home').slice(1);
  const name=VIEWS[v]?v:'home';
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+name?'page':'false'));
  S.role={register:'senior',hrd:'hrd'}[name]||'junior'; // '지금 나는' 대신 화면에 따라 역할이 정해짐
  const same=route._last===name;route._last=name;
  $('#app').innerHTML=`<div class="view${same?'':' enter'}">${VIEWS[name]()}</div>`;
  bind[name]?.();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

const bind={};
window.addEventListener('message',e=>{
  const m=e.data;if(!m||m.src!=='hb-game')return;
  const G=S.game;
  if(m.type==='progress'){G.progress={day:m.day,phase:m.phase,g:m.gauges};save();return}
  if(m.type==='nav'){location.hash='#'+(VIEWS[m.view]?m.view:'home');return}
  if(m.type==='equip'&&['top','neck','hand','back'].includes(m.slot)){G.bri={...myBriLook(),[m.slot]:String(m.v)};save();
    const a=document.querySelector('.gframe-bar .av');if(a)a.innerHTML=bri({...myBri(),head:true,wave:false});return}
  if(m.type==='item'){const it=typeof hbItem==='function'&&hbItem(m.id);if(it)toast(`🎁 새 아이템: ${it.n}`);return}
  if(m.type==='restart'){G.phase='setup';save();route();window.scrollTo(0,0);return}
  if(window.HBLive&&HBLive.handleGameMsg(m))return; // 실사용 모드: 로그인한 소통 공간으로
  if(m.type==='ask'&&m.ch!=='anon'){S.draft={ref:m.card.day+' · '+m.card.title,t:String(m.text||'').slice(0,500)};S.mt=null;save();toast('선배에게 물어볼 질문을 담아 뒀어요 · 소통 공간 → 선배에게 물어보기');return}
  if(m.type==='ask'){const anon=m.ch==='anon';
    S.posts.unshift({id:'p'+Date.now(),ch:anon?'anon':'ask',by:anon?null:myName(),tag:anon?'익명 신입':'신입 · 인사팀 · '+(m.card.day||''),ref:m.card.day+' · '+m.card.title,t:String(m.text||'').slice(0,500),when:'방금',mine:true});
    save();toast('소통 공간에 질문이 올라갔어요');return}
  if(m.type==='share'){S.posts.unshift({id:'p'+Date.now(),ch:'peer',by:myName(),tag:'신입 · 인사팀 · D+100',t:String(m.text||'').slice(0,500),when:'방금',mine:true});
    S.shared=true;S.channel='peer';save();setTimeout(()=>{location.hash='#community'},600);return}
});

/* ---------- game ---------- */
function gaugeHTML(){
  const G=S.game;
  return `<div class="gauges" id="gauges">${GAUGES.map((n,i)=>`<div class="g ${G.g[i]<=25?'low':''}"><span class="hint" data-h="${i}"></span><div class="lab"><span>${n}</span><b>${G.g[i]}</b></div><div class="bar"><i style="width:${G.g[i]}%"></i></div></div>`).join('')}</div>`;
}
function dayHead(){
  const G=S.game,D=DAYS[G.dayIdx];
  const total=DAYS.reduce((a,d)=>a+d.cards.length,0);
  const doneN=DAYS.slice(0,G.dayIdx).reduce((a,d)=>a+d.cards.length,0)+G.pos+(G.phase==='feedback'?1:0)+(G.phase==='retro'?0:0);
  let k=0;const bars=[];
  DAYS.forEach((d,di)=>d.cards.forEach((c,ci)=>{const idx=k++;bars.push(`<i class="${idx<doneN?'done':(di===G.dayIdx&&ci===G.pos&&G.phase==='play')?'now':''}"></i>`)}));
  return `<div class="dayline"><span class="d">D+${D.day}</span><span class="muted">${esc(D.label)}</span><div class="progress" aria-label="진행 ${doneN}/${total}">${bars.join('')}</div></div>`;
}
function cardHTML(id){
  const c=CARDS[id],p=PEOPLE[c.who];
  return `<div class="sc-head">${avatar(p)}<div class="who"><b>${esc(p.n)}</b><span>${esc(p.r)}</span></div><span class="chip">${esc(c.type)}</span></div>
  <div class="sc-body"><h2 class="sc-title">${esc(c.title)}</h2><p class="sc-text">${esc(c.text)}</p>
  <dl class="ctx"><div><dt>인물 관계</dt><dd>${esc(c.ctx[0])}</dd></div><div><dt>시점</dt><dd>${esc(c.ctx[1])}</dd></div><div><dt>직전 상황</dt><dd>${esc(c.ctx[2])}</dd></div></dl>`;
}
function deltaChips(d){return d.map((v,i)=>v?`<span class="chip ${v>0?'good':'warn'}">${GAUGES[i]} ${v>0?'+':''}${v}</span>`:'').join('')}
function gameSrc(){
  const G=S.game,q=new URLSearchParams({name:G.name||'김하이',part:PARTS[G.part]||'',run:String(S.runs),bri:JSON.stringify(myBri()),bg:myBg()});
  const td=new URLSearchParams(location.search).get('testdrop');if(td)q.set('testdrop',td); // 확인용: 사이트 주소의 ?testdrop= 을 게임에 전달
  return 'game/index.html?'+q.toString();
}
function gameFrameHTML(){
  return `<div class="gframe-wrap">
    <div class="gframe-bar"><div class="row" style="gap:10px"><span class="av br" style="width:34px;height:34px;background:${myBg()}">${bri({...myBri(),head:true,wave:false})}</span>
      <div><b>${esc(myName())}</b> <span class="small muted">· ㈜하이브릿지 인사팀 신입</span></div></div>
      <div class="row" style="gap:6px"><button class="btn sm ghost" id="gRestart">↺ 처음부터 다시</button><button class="btn sm ghost" id="gReset">캐릭터 다시 꾸미기</button></div></div>
    <iframe class="gframe" id="gframe" src="${esc(gameSrc())}" title="100일 게임 · 하이브릿지 사무실" allow="fullscreen" allowfullscreen></iframe>
  </div>`;
}
let CC_TAB='color';
const CC_TABS=[['color','색상'],['face','표정'],['acc','소품'],['items','내 아이템'],['bg','프로필 색']];
function ccHTML(){
  const G=S.game,L=myBriLook(),bg=myBg();
  const th=over=>`<span class="th" style="background:${bg}">${bri({...briOf({...L,...over}),head:true,wave:false})}</span>`;
  const opt=(key,o)=>`<button type="button" data-k="${key}" data-v="${o.v}" aria-pressed="${L[key]===o.v}">${th({[key]:o.v})}${o.n}</button>`;
  const sw=(key,arr,fill)=>arr.map((c,i)=>`<button type="button" data-k="${key}" data-v="${i}" aria-pressed="${L[key]===i}" style="background:${fill(c)}" title="${esc(c[1])}" aria-label="${esc(c[1])}"></button>`).join('');
  const sec=(t,body,cls)=>`<div class="cc-sec"><h4>${t}</h4><div class="${cls}">${body}</div></div>`;
  const tabs={
    color:sec('몸 색',sw('c',BRI_OPTS.c,c=>c[0]),'cc-sw')+sec('볼 터치',sw('cheek',BRI_OPTS.cheek,c=>c[0]==='none'?'repeating-linear-gradient(45deg,#3a4766 0 4px,#26324f 4px 8px)':c[0]),'cc-sw'),
    face:sec('눈',BRI_OPTS.eyes.map(o=>opt('eyes',o)).join(''),'cc-opts')+sec('입',BRI_OPTS.mouth.map(o=>opt('mouth',o)).join(''),'cc-opts'),
    acc:sec('머리 위',BRI_OPTS.top.map(o=>opt('top',o)).join(''),'cc-opts')+sec('얼굴',BRI_OPTS.face.map(o=>opt('face',o)).join(''),'cc-opts')+sec('목',BRI_OPTS.neck.map(o=>opt('neck',o)).join(''),'cc-opts')+sec('귀',BRI_OPTS.ear.map(o=>opt('ear',o)).join(''),'cc-opts'),
    bg:sec('프로필 동그라미 색 · 홈, 게임 HUD, 채팅에서 내 프로필 바탕으로 보여요',sw('bg',BRI_OPTS.bg,c=>c[0]),'cc-sw'),
    items:(()=>{const own=typeof hbItemsOwned==='function'?hbItemsOwned():[];const all=typeof HB_ITEMS!=='undefined'?HB_ITEMS:[];
      return `<div class="cc-sec"><h4>아이템 도감 <b class="cc-cnt">${own.length} / ${all.length}</b> · 100일 게임에서 배우는 행동을 하면 드랍돼요</h4><div class="cc-items">${all.map(it=>{const has=own.includes(it.id),on=has&&L[it.slot]===it.v,tr=HB_TIER[it.tier]||['','#6b7280'];
        return `<button type="button" class="cc-item${has?'':' locked'}" ${has?`data-item="${it.id}"`:'disabled'} aria-pressed="${on}" title="${esc(has?it.desc:'얻는 법: '+it.how)}">
          <span class="th" style="background:${bg}">${bri({...briOf({...L,[it.slot]:it.v}),head:it.slot!=='hand'&&it.slot!=='back',wave:false,size:64})}</span>
          <b>${has?esc(it.n):'???'}</b><small style="color:${tr[1]}">${tr[0]}</small><em>${has?(on?'착용 중':'착용하기'):esc(it.tier==='hidden'?'숨은 아이템':it.how)}</em>${has?'':'<i class="cc-lock">🔒</i>'}</button>`}).join('')}</div></div>`})()
  };
  return `
    <div class="cc-stage">
      <span class="cc-label">MY BRI</span>
      <button type="button" class="cc-dice" id="ccDice" aria-label="랜덤으로 꾸미기">🎲 랜덤</button>
      <div class="cc-fig">${bri({...briOf(L),size:240,label:'내가 꾸민 브리'})}</div>
      <div class="cc-plate${CC_TAB==='bg'?' hl':''}"><span class="cc-pf" style="background:${bg}" title="내 프로필">${bri({...briOf(L),head:true,wave:false})}</span><span class="cc-pt"><b id="ccName">${esc(G.name||'김하이')}</b><span>㈜하이브릿지 인사팀 신입 · 관심 분야 ${esc(PARTS[G.part]||'통합')}</span></span></div>
    </div>
    <div class="cc-panel">

        <div class="f">관심 있는 분야 <small class="f-hint">고른 분야의 상황 위주로 나와요 · 통합은 모든 분야를 섞어요</small><div class="parts">${PARTS.map((p,i)=>`<button type="button" data-part="${i}" aria-pressed="${i===G.part}" class="${i===PART_ALL?'all':''}"><b>${p}</b><small>${PART_DESC[i]}</small></button>`).join('')}</div></div>

function game(){
  const G=S.game;
  if(G.phase==='setup'){
    return `<div class="game wide">
      <div class="greet">${bri({size:84})}<div class="bubble">반가워요! 저는 하이브릿지 캐릭터 <b>브리</b>예요. 100일 동안 함께할 <b>나만의 브리</b>를 꾸며 볼까요?</div></div>
      <div class="cc" id="cc">${ccHTML()}</div>
      <div class="panel soft small" style="padding:14px 16px"><b>4대 게이지</b> · 팀장 신뢰, 동료 관계, 업무 성과, 체력은 모두 50에서 시작해요. 하나라도 0이 되면 번아웃·고립 같은 엔딩을 맞게 됩니다. 선택지에 마우스를 올리면 영향을 받는 게이지에 노란 점이 떠요.</div>
    </div>`;
  }
  if(G.phase==='world')return gameFrameHTML();
  if(G.phase==='ending')return endingHTML();
  const D=DAYS[G.dayIdx];
  if(G.phase==='retro'){
    const R=D.retro,c=CARDS[R.card],s=SENIORS[R.by];
    return `<div class="game">${gaugeHTML()}${dayHead()}
      <section class="panel" style="display:grid;gap:16px">
        <div class="greet" style="align-items:center;gap:14px"><span class="av br" style="width:60px;height:60px;background:${myBg()}">${bri({...myBri(),head:true,wave:false})}</span><div style="min-width:0"><div class="eyebrow">퇴근 회고 · D+${D.day} · 오늘도 수고했어요</div><h2 class="h2" style="margin-top:4px">오늘 '${esc(c.title)}' 상황, 나라면?</h2>
        <p class="muted small" style="margin-top:4px">${esc(c.text)}</p></div></div>
        <label class="f" for="rt">내 생각을 먼저 적어 보세요. 채점하지 않아요.<textarea id="rt" placeholder="나라면 이렇게 했을 것 같다. 왜냐하면…">${esc(G.retroText)}</textarea></label>
        ${G.retroShown?`
          <div class="senior">${avatar(s)}<div><div class="nm">${esc(s.n)} ${s.t||'선배'}의 실제 경험<span>${esc(s.m)}</span></div>
          <dl class="story" style="margin-top:8px">${R.story.map((x,i)=>`<div><dt>${STORY_Q[i]}</dt><dd>${esc(x)}</dd></div>`).join('')}</dl></div></div>
          <div class="row"><button class="btn" id="nextDay">${G.dayIdx<DAYS.length-1?`D+${DAYS[G.dayIdx+1].day}로 넘어가기`:'100일째 아침으로'}</button>
          <a class="btn ghost" href="#community" id="askR">이 상황 선배에게 물어보기</a></div>`
        :`<div class="row"><button class="btn" id="reveal">선배의 실제 대응 보기</button><span class="small muted">적은 내용은 내 브라우저에만 저장돼요.</span></div>`}
      </section></div>`;
  }
  const id=D.cards[G.pos],c=CARDS[id];
  if(G.phase==='play'){
    return `<div class="game">${gaugeHTML()}${dayHead()}
      <article class="sc">${cardHTML(id)}
        <div class="choices" id="choices">${c.ch.map((x,i)=>`<button class="choice" data-i="${i}"><span class="k">${'ABC'[i]}</span><span>${esc(x.t)}</span></button>`).join('')}</div>
      </div></article>
      </div>`;
  }
  // feedback
  const L=G.last,ch=c.ch[L],st=(S.stats[id]||[0,0,0]);
  const counts=c.seed.map((v,i)=>v+(st[i]||0)),tot=counts.reduce((a,b)=>a+b,0);
  const failed=G.g.some(v=>v<=0);
  return `<div class="game">${gaugeHTML()}${dayHead()}
    <article class="sc">${cardHTML(id)}
      <div class="fb">
        <div class="mine"><span class="small muted">내 선택 ${'ABC'[L]}</span><b>${esc(ch.t)}</b><span>${esc(ch.r)}</span><div class="deltas">${deltaChips(ch.d)}</div></div>
        <div style="display:grid;gap:10px"><h3 style="font-size:15px">선배들은 이렇게 했어요 <span class="small muted" style="font-weight:400">· 정답이 아니라 서로 다른 판단</span></h3>
          ${c.sr.map(r=>{const s=SENIORS[r.s];return `<div class="senior">${avatar(s)}<div><div class="nm">${esc(s.n)}<span>${esc(s.m)} · ${'ABC'[r.p]} 선택${r.p===L?' · 나와 같음':''}</span></div><q>${esc(r.q)}</q><div class="why">${esc(r.w)}</div></div></div>`}).join('')}
        </div>
        <div style="display:grid;gap:8px"><h3 style="font-size:15px">다른 신입들의 선택 <span class="sample" style="display:inline-flex;font-weight:400">예시 데이터 ${tot}명</span></h3>
          <div class="dist">${counts.map((v,i)=>`<div class="r ${i===L?'me':''}"><b>${'ABC'[i]}</b><div class="track"><i style="width:${pct(v,tot)}%"></i></div><span>${pct(v,tot)}%</span></div>`).join('')}</div></div>
        <div class="row">
          <button class="btn" id="next">${failed?'결과 보기':(G.pos<D.cards.length-1?'다음 상황':'퇴근하기')}</button>
          <button class="btn ghost" id="ask">선배에게 물어보기</button>
        </div>
      </div>
    </div></article></div>`;
}
function endingType(){
  const g=S.game.g;
  if(S.game.fail!==null)return {fail:true,...FAILS[S.game.fail]};
  const mx=Math.max(...g),mn=Math.min(...g);
  if(mx-mn<=15)return ENDINGS.b;
  return ENDINGS[g.indexOf(mx)];
}
function endingHTML(){
  const G=S.game,E=endingType();
  const same=G.log.filter(l=>{const c=CARDS[l.id];const m=c.seed.indexOf(Math.max(...c.seed));return m===l.i}).length;

  return `<div class="game">
    <section class="ending ${E.fail?'fail':''}">
      <div class="row" style="justify-content:space-between"><img src="assets/logo-white.png" alt="HiBridge"><span class="chip amber">${E.fail?`D+${day}에서 멈춤`:'D+100 생존'}</span></div>

      <p>${esc(E.d)}</p>
      <div class="stats">${GAUGES.map((n,i)=>`<div>${n}<b>${G.g[i]}</b></div>`).join('')}</div>
      <p style="font-size:13px">상황 ${G.log.length}개 중 ${same}개에서 다수 신입과 같은 선택을 했어요.${E.n?' '+esc(E.n):''}</p>
    </section>
    <div class="row">
      ${E.fail?'':`<button class="btn" id="share" ${S.shared?'disabled':''}>${S.shared?'동기 피드에 공유됨':'사내 동기 피드에 공유'}</button>`}
      <button class="btn ghost" id="again">처음부터 다시</button>
      <a class="btn ghost" href="#community">소통 공간 가기</a>

    $('#gReset').addEventListener('click',()=>{if(!confirm('캐릭터를 다시 꾸미면 게임이 처음부터 시작돼요. 계속할까요? (도감에 모은 아이템은 남아요)'))return;G.phase='setup';save();route();window.scrollTo(0,0)});
    const gf=$('#gframe');gf.addEventListener('load',()=>{try{gf.contentWindow.focus()}catch(e){}});
    return;
  }
  if(G.phase==='setup'){
    const cc=$('#cc'), redraw=()=>{cc.innerHTML=ccHTML()};
    cc.addEventListener('input',e=>{if(e.target.id!=='nm')return;G.name=e.target.value.trim();save();$('#ccName').textContent=G.name||'김하이'});
    cc.addEventListener('click',e=>{

      if(b.dataset.part!=null){G.part=+b.dataset.part;save();redraw();return}
      if(b.dataset.k){const L=myBriLook(),k=b.dataset.k;L[k]=BRI_NUM.includes(k)?+b.dataset.v:b.dataset.v;G.bri=L;save();redraw();return}
      if(b.id==='ccDice'){const r=a=>Math.floor(Math.random()*a.length),pick=k=>BRI_OPTS[k][r(BRI_OPTS[k])].v;
        G.bri={c:r(BRI_OPTS.c),cheek:r(BRI_OPTS.cheek),eyes:pick('eyes'),mouth:pick('mouth'),top:pick('top'),face:pick('face'),neck:pick('neck'),ear:pick('ear'),bg:r(BRI_OPTS.bg)};save();redraw();return}
      if(b.id==='start'){if(!G.name){G.name='김하이'}if(!G.bri)G.bri=myBriLook();Object.assign(G,{phase:'world'});S.shared=false;S.runs++;save();route();window.scrollTo(0,0)}
    });
    return;
  }
  if(G.phase==='play'){
    const id=DAYS[G.dayIdx].cards[G.pos];
    const box=$('#choices');
    const hint=i=>document.querySelectorAll('.hint').forEach(h=>{const v=i==null?0:Math.abs(CARDS[id].ch[i].d[+h.dataset.h]);const s=v>=12?12:v>=7?9:6;h.style.width=h.style.height=s+'px';h.classList.toggle('on',v>0)});
    box.querySelectorAll('.choice').forEach(b=>{b.addEventListener('mouseenter',()=>hint(+b.dataset.i));b.addEventListener('focus',()=>hint(+b.dataset.i));b.addEventListener('mouseleave',()=>hint(null))});
    box.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;const i=+b.dataset.i,d=CARDS[id].ch[i].d;
      G.g=G.g.map((v,k)=>Math.max(0,Math.min(100,v+d[k])));G.last=i;G.log.push({id,i});
      S.stats[id]=S.stats[id]||[0,0,0];S.stats[id][i]++;G.phase='feedback';save();route()});
  }
  if(G.phase==='feedback'){
    const id=DAYS[G.dayIdx].cards[G.pos];
    $('#next').addEventListener('click',()=>{
      const z=G.g.findIndex(v=>v<=0);

    $('#ask').addEventListener('click',()=>askSenior(id));

  if(G.phase==='retro'){

    $('#reveal')?.addEventListener('click',()=>{G.retroShown=true;save();route()});

  }
};
function askSenior(id){

/* ---------- hrd ---------- */
let HRD_ROWS=[];
function hrdRows(){
  return Object.keys(CARDS).map(id=>{const c=CARDS[id],st=S.stats[id]||[0,0,0],cn=c.seed.map((v,i)=>v+(st[i]||0)),t=cn.reduce((a,b)=>a+b,0);
    const eff=c.ch.map(x=>Math.min(...x.d)); // 선택지에서 가장 크게 깎이는 게이지
    const neg=cn.reduce((a,v,i)=>a+(eff[i]<=-4?v:0),0),pos=cn.reduce((a,v,i)=>a+(eff[i]>=-1?v:0),0);
    const day=DAYS.find(d=>d.cards.includes(id));
    const top=cn.indexOf(Math.max(...cn));
    return{id,c,cn,t,eff,day:day?day.day:0,neg:pct(neg,t),pos:pct(pos,t),mid:100-pct(neg,t)-pct(pos,t),top}});
}
function hrd(){
  const all=hrdRows(),fd=S.hday||'all';
  const rows=fd==='all'?all:all.filter(r=>String(r.day)===String(fd));
  HRD_ROWS=rows;
  const stuck=[...all].sort((a,b)=>b.neg-a.neg).slice(0,3);
  const participants=48+S.runs,finished=31+S.done,rate=pct(finished,participants);
  const unanswered=allPosts().filter(p=>p.ch!=='peer'&&!repliesOf(p).length).length;
  const base=Object.keys(CARDS).map(id=>({id,type:CARDS[id].type,title:CARDS[id].title,src:'설문·인터뷰 기반 상황 카드',status:'게시'}));
  const db=[...S.db,...base],waiting=db.filter(d=>d.status==='검토 대기').length;
  const types=['전체',...new Set(['실무','보고','소통','대처',...TYPES]),'미분류'];
  const shown=S.filter==='전체'?db:db.filter(d=>d.type===S.filter);
  const maxArm=Math.max(50,...rows.map(r=>Math.max(r.neg,r.pos)));
  const days=DAYS.filter(d=>fd==='all'||String(d.day)===String(fd));
  return `
  <section class="cm-hero hd-hero">
    <div class="cm-hero-copy">
      <h1>운영 대시보드</h1>
      <p>신입들이 어디서 막히는지 찾고, 시니어 경험을 시나리오로 묶어 교육과 멘토링을 보완해요.</p>
      <div class="cm-stats"><span>${UI('chart')} 예시 데이터 + 이 브라우저의 플레이 기록</span></div>
    </div>
  </section>

  <div class="hd-filter" id="hdays" role="group" aria-label="기간">
    <span class="small muted">기간</span>
    ${[['all','전체 100일'],...DAYS.map(d=>[String(d.day),d.label+' · '+(d.title||'')])].map(([k,n])=>`<button type="button" data-d="${k}" aria-pressed="${String(fd)===k}">${n}</button>`).join('')}
  </div>

  <section class="hd-kpis">
    <div class="hd-kpi"><span class="hd-kl">참여 신입</span><b>${participants}<small>명</small></b><span class="hd-ks">이번 기수 기준</span></div>
    <div class="hd-kpi"><span class="hd-kl">100일 완주율</span><b>${rate}<small>%</small></b><span class="hd-meter" role="img" aria-label="완주율 ${rate}%"><i style="width:${rate}%"></i></span><span class="hd-ks">${finished}명 완주</span></div>
    <div class="hd-kpi"><span class="hd-kl">검토 대기 시나리오</span><b>${waiting}<small>건</small></b><span class="hd-ks">시나리오 DB 전체 ${db.length}건</span></div>
    <a class="hd-kpi link" href="#community"><span class="hd-kl">답변 대기 질문</span><b>${unanswered}<small>건</small></b><span class="hd-ks">소통 공간에서 답하기 →</span></a>
  </section>

  <section class="hd-main">
    <div class="hd-card">
      <div class="hd-card-h"><div><h2>상황별 선택 결과</h2><p>각 상황에서 신입들이 고른 선택이 게이지를 떨어뜨렸는지, 올렸는지 비율이에요.</p></div>
        <div class="hd-legend"><span><i class="neg"></i>게이지 하락 선택</span><span><i class="pos"></i>게이지 상승 선택</span></div></div>
      <div class="hd-axis" aria-hidden="true"><span>◀ 하락</span><span>상승 ▶</span></div>
      <div class="hd-div" id="hdChart">
        ${days.map(d=>`<div class="hd-day">${esc(d.label)} · ${esc(d.title||"")}</div>${rows.filter(r=>r.day===d.day).map(r=>{const i=rows.indexOf(r);return `
          <div class="hd-row" data-i="${i}" tabindex="0" aria-label="${esc(r.c.title)}: 하락 ${r.neg}%, 상승 ${r.pos}%, 응답 ${r.t}명">
            <div class="hd-nm"><b>${esc(r.c.title)}</b><small>${esc(r.c.type)} · ${r.t}명</small></div>
            <div class="hd-arms">
              <div class="hd-arm l"><span class="hd-v">${r.neg?r.neg+'%':''}</span><i class="neg" style="width:${r.neg/maxArm*100}%"></i></div>
              <div class="hd-arm r"><i class="pos" style="width:${r.pos/maxArm*100}%"></i><span class="hd-v">${r.pos?r.pos+'%':''}</span></div>
            </div>
          </div>`}).join('')}`).join('')}
      </div>
      <details class="hd-table"><summary>표로 보기</summary>
        <div class="tbl"><table><thead><tr><th>상황</th><th>응답</th><th>A</th><th>B</th><th>C</th><th>하락</th><th>상승</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.c.title)}</td><td>${r.t}</td>${r.cn.map((v,k)=>`<td>${pct(v,r.t)}% <span class="muted">${r.eff[k]>0?'▲':r.eff[k]<0?'▼':'–'}</span></td>`).join('')}<td>${r.neg}%</td><td>${r.pos}%</td></tr>`).join('')}
        </tbody></table></div></details>
    </div>

    <div class="hd-side">
      <div class="hd-card">
        <div class="hd-card-h"><div><h2>자주 막히는 상황 TOP 3</h2><p>게이지가 떨어지는 선택이 많은 순서 · 전체 기간</p></div></div>
        <ol class="hd-stuck">${stuck.map((r,k)=>`<li><span class="hd-rank">${k+1}</span><div><b>${esc(r.c.title)}</b><small>${esc(r.c.type)} · D+${r.day}</small>
          <span class="hd-pick">가장 많이 고른 선택 · ${esc(r.c.ch[r.top].t)}</span></div><strong>${r.neg}<small>%</small></strong></li>`).join('')}</ol>
      </div>
      <div class="hd-card hd-tips">
        <h2>이렇게 활용해 보세요</h2>
        <ul><li><span>${UI('cap')}</span>막히는 상황 1위를 다음 기수 입문교육 사례로</li><li><span>${UI('bell')}</span>답변 대기 질문은 해당 파트 시니어에게 알림</li><li><span>${UI('chat')}</span>선택이 고르게 갈리는 카드는 토론형 멘토링 주제로</li></ul>
      </div>
    </div>
  </section>

  <section class="hd-card">
    <div class="hd-card-h"><div><h2>시나리오 DB</h2><p>시니어 경험과 소통 공간 질문이 모이는 곳이에요. 검토 후 게시하면 다음 기수 게임에 들어가요.</p></div>
      ${waiting?`<span class="chip amber">검토 대기 ${waiting}건</span>`:''}</div>
    <div class="filters" id="filters">${types.map(t=>`<button aria-pressed="${t===S.filter}" data-t="${t}">${t}</button>`).join('')}</div>
    <div class="tbl hd-db"><table><thead><tr><th>유형</th><th>제목</th><th>출처</th><th>상태</th><th></th></tr></thead><tbody>
    ${shown.map(d=>`<tr class="${d.status==='검토 대기'?'wait':''}"><td><span class="chip gray">${esc(d.type)}</span></td><td><b>${esc(d.title)}</b></td><td class="muted">${esc(d.src)}${d.by?' · '+esc(d.by):''}</td>
      <td><span class="chip ${d.status==='게시'?'good':d.status==='보류'?'gray':'amber'}">${d.status==='게시'?'✓ ':d.status==='검토 대기'?'⏳ ':''}${d.status}</span></td>
      <td>${d.status==='검토 대기'?`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-ok="${d.id}">게시</button><button class="btn sm ghost" data-no="${d.id}">보류</button></span>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">이 유형의 시나리오가 아직 없어요.</td></tr>'}
    </tbody></table></div>
  </section>
  <div class="hd-tip" id="hdTip" role="tooltip" hidden></div>`;
}
bind.hrd=()=>{
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.filter=b.dataset.t;save();route()});
  $('#hdays').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.hday=b.dataset.d;save();route()});
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.ok||b.dataset.no;const d=S.db.find(x=>x.id===id);if(!d)return;
    d.status=b.dataset.ok?'게시':'보류';save();toast(b.dataset.ok?'게시했어요. 다음 기수 게임에 반영돼요':'보류했어요');route()}));
  document.querySelectorAll('body > .hd-tip').forEach(x=>x.remove());
  const tip=$('#hdTip'),chart=$('#hdChart');document.body.appendChild(tip);
  const show=(row,x,y)=>{const r=HRD_ROWS[+row.dataset.i];if(!r)return;
    tip.innerHTML=`<b>${esc(r.c.title)}</b><span class="muted">${esc(r.c.type)} · 응답 ${r.t}명</span>
      ${r.c.ch.map((ch,k)=>`<div class="hd-tip-r"><span class="hd-tip-k ${r.eff[k]<0?'neg':r.eff[k]>0?'pos':'mid'}">${'ABC'[k]}</span><span class="hd-tip-t">${esc(ch.t)}</span><b>${pct(r.cn[k],r.t)}%</b></div>`).join('')}`;
    tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.min(window.innerWidth-w-12,Math.max(12,x+16))+'px';tip.style.top=Math.max(12,y-h-12)+'px';};
  chart.addEventListener('mousemove',e=>{const row=e.target.closest('.hd-row');if(row)show(row,e.clientX,e.clientY);else tip.hidden=true});
  chart.addEventListener('mouseleave',()=>{tip.hidden=true});
  chart.addEventListener('focusin',e=>{const row=e.target.closest('.hd-row');if(row){const rc=row.getBoundingClientRect();show(row,rc.left+rc.width/2,rc.top)}});
  chart.addEventListener('focusout',()=>{tip.hidden=true});
};

route();
</script>

<script src="hb-live.js"></script>
<script src="hb-bot.js"></script>
</body>
</html>
